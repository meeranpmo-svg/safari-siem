<style>
:root{--d-bg:#0b0d12;--d-panel:#12151c;--d-raise:#181c25;--d-line:#232837;--d-ink:#e7eaf0;--d-mute:#8b93a4;--d-ok:#2fb344;--d-warn:#f59f00;--d-bad:#e5484d;--d-acc:#5b8def}
[hidden]{display:none!important}*{box-sizing:border-box}
body{margin:0;background:var(--d-bg);color:var(--d-ink);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
main{max-width:1560px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}.top h1{margin:0;font-size:24px}.eb{font:600 11px ui-monospace,Consolas,monospace;letter-spacing:.09em;color:var(--d-mute);text-transform:uppercase}
.sp{flex:1}.mute{color:var(--d-mute)}.sm{font-size:12px}.mono{font-family:ui-monospace,Consolas,monospace}
.btn{font:600 13px Inter,"Segoe UI",system-ui,sans-serif;background:var(--d-raise);color:var(--d-ink);border:1px solid var(--d-line);border-radius:9px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:#3a4258}.btn.pri{background:var(--d-acc);border-color:var(--d-acc);color:#fff}.btn.sm{padding:3px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--d-panel);border:1px solid var(--d-line);border-radius:16px;padding:16px;margin-bottom:14px;min-width:0}
.card h2{margin:0 0 12px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card h2 .c{color:var(--d-mute);font-weight:400;font-size:12px}
.hero{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.kpi{background:var(--d-raise);border:1px solid var(--d-line);border-radius:12px;padding:10px 12px;text-align:left;color:inherit;font:inherit;cursor:pointer}.kpi:hover{border-color:#3a4258}.kpi .n{font-size:22px;font-weight:800}.kpi .l{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--d-mute)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:transparent;border:1px solid var(--d-line);color:var(--d-mute);border-radius:999px;padding:6px 14px;font:600 13px Inter,"Segoe UI",system-ui,sans-serif;cursor:pointer;display:inline-flex;gap:6px;align-items:center}.tabs button[aria-selected="true"]{color:#fff;border-color:var(--d-acc);background:rgba(91,141,239,.2)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.plat{background:var(--d-raise);border:1px solid var(--d-line);border-radius:14px;padding:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}.v-ok{background:rgba(47,179,68,.15);color:#56d364}.v-bad{background:rgba(229,72,77,.2);color:#ff8a8e}.v-warn{background:rgba(245,159,0,.18);color:#f5b544}.v-mute{background:rgba(139,147,164,.16);color:#aab2c2}.v-info{background:rgba(91,141,239,.18);color:#8db0ff}
.bar{height:8px;border-radius:4px;background:#232837;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.note{color:var(--d-mute);font-size:12.5px;padding:10px;border:1px dashed var(--d-line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.8px}th{text-align:left;color:var(--d-mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--d-line)}td{padding:7px 8px;border-bottom:1px solid #1b2030;vertical-align:top}
tr.rk{cursor:pointer}tr.rk:hover td{background:#151924}tr.sel td{background:#172036}
.inp,select.inp{background:#0b0d12;color:var(--d-ink);border:1px solid var(--d-line);border-radius:8px;padding:6px 9px;font:13px Inter,"Segoe UI",system-ui,sans-serif;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:inline-block;min-width:54px;text-align:center;padding:2px 6px;border-radius:6px;font:700 10.5px ui-monospace,monospace;margin:1px}.c-pass{background:rgba(47,179,68,.18);color:#56d364}.c-fail{background:rgba(229,72,77,.22);color:#ff8a8e}.c-nm{background:rgba(139,147,164,.14);color:#8b93a4}
.ans{white-space:pre-wrap;background:#10131a;border:1px solid var(--d-line);border-radius:10px;padding:12px;margin-top:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2430;border:1px solid #2e3747;border-radius:10px;padding:10px 16px;z-index:9999;max-width:90vw}
@media(max-width:1100px){.hero{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<div class="top"><div><div class="eb">IT Operations</div><h1>IT Operations &amp; Updates</h1><div class="sm mute">Every server update, measured from Endpoint Central, the IT Asset Management agent and vCenter / Prism, and checked against the patch and change policy. A server nothing reports on is shown as not measured - never as compliant.</div></div><div class="sp"></div>
 <span class="sm mute" id="me"></span><button class="btn" id="sample" type="button" hidden><i class="ti ti-camera"></i>Take today's sample</button><button class="btn" id="xls" type="button"><i class="ti ti-file-spreadsheet"></i>Excel</button><button class="btn" id="refresh" type="button"><i class="ti ti-refresh"></i>Refresh</button></div>
<div id="err" class="card" hidden></div>
<div id="main" hidden>
 <section class="card hero"><div id="ring"></div><div class="kpis" id="kpis"></div></section>
 <div id="notes"></div>
 <div class="tabs" id="tabs" role="tablist"></div>
 <div id="view"></div>
</div>
</main>
<script>
(function(){
  'use strict';
  var esc=window.zybDetail.esc, $=function(id){return document.getElementById(id);};
  var V=null, TAB='overview', SEL='', F={rule:'',plat:'',q:''}, CLOSE='', ANS=null, ROLE='viewer', USER='';
  var PCOL=['#5b8def','#22b8cf','#12b886','#f59f00','#845ef7','#e64980','#fd7e14','#94d82d'];
  function toast(t){var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},5000);}
  function req(m,u,b){return new Promise(function(ok,bad){var x=new XMLHttpRequest();x.open(m,/^\/dashboards\//.test(u)?u:'/api/itam'+u);x.withCredentials=true;x.timeout=120000;x.zybQuiet=true;if(b)x.setRequestHeader('Content-Type','application/json');
    x.onload=function(){var j=null;try{j=JSON.parse(x.responseText);}catch(e){j=null;/* not JSON: shown as the HTTP status */}if(x.status>=200&&x.status<300&&j)return ok(j);bad(Object.assign(new Error((j&&j.error)||('HTTP '+x.status)),{status:x.status}));};
    x.onerror=x.ontimeout=function(){bad(Object.assign(new Error('IT Asset Management is not reachable'),{status:0}));};x.send(b?JSON.stringify(b):null);});}
  function note(t){return '<div class="note">'+esc(t)+'</div>';}
  function pill(t,c){return '<span class="pill '+c+'">'+esc(t)+'</span>';}
  function chk(c){var cl=c.state==='pass'?'c-pass':c.state==='fail'?'c-fail':'c-nm';return '<span class="chk '+cl+'" title="'+esc(c.rule+': '+c.state+' - '+c.detail)+'">'+esc(c.rule)+'</span>';}
  function ruleName(id){var r=V.rules.find(function(x){return x.id===id;});return r?r.name:id;}
  function load(){$('err').hidden=true;return req('GET','/updates').then(function(v){V=v;$('main').hidden=false;$('sample').hidden=!v.can_act;$('me').textContent=v.can_admin?'Administrator':v.can_act?'Operator - record change references and post-update checks':'Read-only';draw();})
    .catch(function(e){$('main').hidden=true;$('err').hidden=false;$('err').innerHTML='<h2><i class="ti ti-alert-triangle"></i>IT Operations &amp; Updates is not available</h2>'+note(e.status===404?'Not installed on the server - run the update (update-platform.ps1).':e.message);});}
  function ring(p){var r=70,c=2*Math.PI*r,v=p==null?0:p,col=p==null?'#5c6370':p>=90?'#2fb344':p>=70?'#f59f00':'#e5484d';
    return '<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Updates within policy '+(p==null?'not measured':p+'%')+'"><circle cx="90" cy="90" r="'+r+'" fill="none" stroke="#232837" stroke-width="16"/><circle cx="90" cy="90" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+(c*v/100).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 90 90)"/>'
      +'<text x="90" y="88" text-anchor="middle" fill="#e7eaf0" font-size="34" font-weight="800" font-family="Inter,sans-serif">'+(p==null?'—':p+'%')+'</text><text x="90" y="112" text-anchor="middle" fill="#8b93a4" font-size="11" font-family="Inter,sans-serif">within policy</text><text x="90" y="127" text-anchor="middle" fill="#8b93a4" font-size="10" font-family="Inter,sans-serif">'+V.summary.measured+' of '+V.summary.servers+' measured</text></svg>';}
  function draw(){var s=V.summary;$('ring').innerHTML=ring(s.pct);
    function kp(n,l,col,go){return '<button type="button" class="kpi" data-go="'+go+'"><div class="n" style="color:'+(col||'inherit')+'">'+esc(n)+'</div><div class="l">'+esc(l)+'</div></button>';}
    $('kpis').innerHTML=kp(s.servers,'servers','','servers:')+kp(s.not_measured,'not measured',s.not_measured?'#aab2c2':'','servers:UPD-02')+kp(s.critical_missing,'critical patches missing',s.critical_missing?'#ff7b80':'','servers:UPD-01')+kp(s.overdue_patches,'patches past SLA',s.overdue_patches?'#ff7b80':'','patches:')+kp(s.due_soon,'reach SLA in 7 days',s.due_soon?'#f5b544':'','patches:')
      +kp(s.events_30d,'updates seen in 30 days','','history:')+kp(s.open_closeout,'need change ref / check',s.open_closeout?'#f5b544':'','history:')+kp(s.drifting,'behind their platform build',s.drifting?'#f5b544':'','servers:UPD-04')+kp(s.late,'past their usual cycle',s.late?'#f5b544':'','servers:late')+kp(V.rules.reduce(function(n,r){return n+r.fail;},0),'rule failures','','overview:');
    var N=Object.keys(V.notes||{});$('notes').innerHTML=N.length?'<div class="note" style="margin-bottom:12px"><b>Sources not read:</b> '+N.map(function(k){return esc(k.replace(/_/g,' ')+': '+V.notes[k]);}).join(' · ')+'. Servers they would report on read "not measured".</div>':'';
    var T=[['overview','layout-dashboard','Overview'],['servers','server','Servers ('+V.servers.length+')'],['history','timeline','Update history ('+V.events.length+')'],['patches','shield-exclamation','Patches'],['drift','arrows-diff','Version drift ('+V.drift.length+')'],['policy','adjustments','Policy'],['ai','robot','AI update analyst']];
    $('tabs').innerHTML=T.map(function(t){return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(TAB===t[0])+'"><i class="ti ti-'+t[1]+'"></i>'+esc(t[2])+'</button>';}).join('');
    var v=$('view');v.innerHTML=TAB==='overview'?overview():TAB==='servers'?serversView():TAB==='history'?historyView():TAB==='patches'?patchesView():TAB==='drift'?driftView():TAB==='policy'?policyView():aiView();}
  // ---------- overview
  function timeline(){var days=90,now=Date.now(),cnt={},plats={};V.events.forEach(function(e){var d=Math.floor((now-e.at)/86400000);if(d<0||d>=days)return;var p=e.platform;plats[p]=1;cnt[d]=cnt[d]||{};cnt[d][p]=(cnt[d][p]||0)+1;});
    var P=Object.keys(plats),mx=Math.max.apply(null,[1].concat(Object.keys(cnt).map(function(d){return Object.keys(cnt[d]).reduce(function(s,k){return s+cnt[d][k];},0);}))),W=900,H=110,bw=W/days;
    if(!P.length)return note('No update observed yet. The platform takes one sample a day; an update shows here as soon as a version, hotfix or installed-patch count changes between two samples.');
    var s='<svg viewBox="0 0 '+W+' '+(H+18)+'" width="100%" height="140" role="img" aria-label="Updates observed per day, last 90 days">';
    for(var d=0;d<days;d++){var y=H,x=W-(d+1)*bw;P.forEach(function(p,i){var n=(cnt[d]||{})[p]||0;if(!n)return;var h=n/mx*H;y-=h;s+='<rect x="'+(x+1).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+PCOL[i%PCOL.length]+'"><title>'+esc(p)+': '+n+' update(s), '+d+' day(s) ago</title></rect>';});}
    s+='<text x="0" y="'+(H+14)+'" fill="#8b93a4" font-size="10">90 days ago</text><text x="'+W+'" y="'+(H+14)+'" fill="#8b93a4" font-size="10" text-anchor="end">today</text></svg>';
    return s+'<div class="row sm mute">'+P.map(function(p,i){return '<span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+PCOL[i%PCOL.length]+'"></i> '+esc(p)+'</span>';}).join(' ')+'</div>';}
  function overview(){
    var plats='<div class="grid3">'+V.platforms.map(function(p){var vs=Object.keys(p.versions),tot=vs.reduce(function(s,k){return s+p.versions[k];},0);
      return '<div class="plat"><div class="row"><b>'+esc(p.platform)+'</b><span class="sp"></span>'+(p.pct==null?pill('not measured','v-mute'):pill(p.pct+'% within policy',p.pct>=90?'v-ok':p.pct>=70?'v-warn':'v-bad'))+'</div>'
        +'<div class="sm mute">'+p.servers+' server(s) · '+p.prod+' production · '+p.measured+' measured'+(p.critical_missing?' · <span style="color:#ff8a8e">'+p.critical_missing+' critical missing</span>':'')+' · '+p.events+' update(s) seen</div>'
        +(vs.length?'<div class="bar" style="margin-top:8px" title="version spread">'+vs.map(function(k,i){return '<i style="width:'+(p.versions[k]/tot*100)+'%;background:'+PCOL[i%PCOL.length]+'" title="'+esc(k)+': '+p.versions[k]+'"></i>';}).join('')+'</div><div class="sm mute" style="margin-top:4px">'+vs.length+' version(s) in use</div>':'<div class="sm mute" style="margin-top:8px">version not reported</div>')+'</div>';}).join('')+'</div>';
    var rules='<table><thead><tr><th>Rule</th><th>Policy</th><th>Framework</th><th style="min-width:200px">Servers</th></tr></thead><tbody>'+V.rules.map(function(r){var t=r.pass+r.fail+r.not_measured||1;
      return '<tr class="rk" data-rule="'+esc(r.id)+'"><td><b>'+esc(r.id)+'</b></td><td><b>'+esc(r.name)+'</b><div class="sm mute">'+esc(r.statement)+'</div></td><td class="sm">'+esc(r.refs)+'</td><td><div class="bar"><i style="width:'+(r.pass/t*100)+'%;background:#2fb344"></i><i style="width:'+(r.fail/t*100)+'%;background:#e5484d"></i><i style="width:'+(r.not_measured/t*100)+'%;background:#3a3f4b"></i></div><div class="sm mute" style="margin-top:4px">'+r.pass+' pass · '+r.fail+' fail · '+r.not_measured+' not measured</div></td></tr>';}).join('')+'</tbody></table>';
    var top=V.servers.slice(0,8);
    return '<section class="card"><h2>Updates observed <span class="c">per day, last 90 days, by platform</span></h2>'+timeline()+'</section>'
      +'<section class="card"><h2>Platforms</h2>'+(V.platforms.length?plats:note('No server in the asset register yet. Servers come from the register (Asset Studio / Asset Discovery).'))+'</section>'
      +'<section class="card"><h2>Patch and change policy <span class="c">click a rule for the servers that fail it</span></h2>'+rules+'</section>'
      +'<section class="card"><h2>Patch first <span class="c">ranked by an explainable risk score</span></h2>'+(top.length?serverTable(top):note('No server.'))+'</section>';}
  // ---------- servers
  function serverTable(L){return '<table><thead><tr><th>Server</th><th>Platform</th><th>Version / patch level</th><th>Critical missing</th><th>Last update</th><th>Rules</th><th>Risk</th></tr></thead><tbody>'+L.map(function(s){
    return '<tr class="rk'+(SEL===s.id?' sel':'')+'" data-srv="'+esc(s.id)+'"><td><b>'+esc(s.name)+'</b><div class="sm mute">'+esc([s.site,s.prod?'production':'non-production',s.criticality].filter(Boolean).join(' · '))+'</div></td><td>'+esc(s.platform_label)+(s.cluster?'<div class="sm mute">'+esc(s.cluster)+'</div>':'')+'</td>'
      +'<td class="sm">'+esc(s.version||'—')+(s.patch_level?'<div class="mute mono">'+esc(s.patch_level)+'</div>':'')+(s.drift?'<div>'+pill('behind '+s.drift.behind,'v-warn')+'</div>':'')+'</td><td>'+(s.ec&&s.ec.critical!=null?(s.ec.critical?pill(s.ec.critical,'v-bad'):pill('0','v-ok')):'<span class="sm mute">—</span>')+'</td>'
      +'<td class="sm">'+esc(s.last_update||'none seen')+(s.cadence.late?'<div>'+pill('late: usual '+s.cadence.usual_days+' d','v-warn')+'</div>':'')+'</td><td>'+s.checks.map(chk).join('')+'</td><td><b>'+s.risk+'</b></td></tr>'
      +(SEL===s.id?'<tr><td colspan="7">'+serverDetail(s)+'</td></tr>':'');}).join('')+'</tbody></table>';}
  function serverDetail(s){var ev=V.events.filter(function(e){return e.asset===s.id;});
    return '<div style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px"><div><div class="sm mute">Rule results</div><table><tbody>'+s.checks.map(function(c){return '<tr><td>'+chk(c)+'</td><td class="sm"><b>'+esc(ruleName(c.rule))+'</b><div class="mute">'+esc(c.detail)+'</div></td></tr>';}).join('')+'</tbody></table></div>'
      +'<div><div class="sm mute">Why this risk ('+s.risk+')</div><ul class="sm">'+(s.risk_why.length?s.risk_why.map(function(w){return '<li>'+esc(w)+'</li>';}).join(''):'<li>nothing raises it</li>')+'</ul>'
      +'<div class="sm mute">Reported by: '+esc(s.reported_by.join(', ')||'no source')+' · history '+s.tracked_days+' day(s)'+(s.ec?' · Endpoint Central: '+esc(s.ec.health||'—')+', '+esc(s.ec.missing==null?'?':s.ec.missing)+' missing':'')+'</div>'
      +'<div class="sm mute" style="margin-top:8px">Updates seen ('+ev.length+')</div>'+(ev.length?ev.slice(0,8).map(function(e){return '<div class="sm">'+esc(e.day)+' · '+esc(e.kind)+': '+esc(e.from)+' → '+esc(e.to)+' '+(e.change_ref?pill(e.change_ref.ref,'v-info'):'')+(e.check?pill('check '+e.check.result,e.check.result==='passed'?'v-ok':'v-bad'):'')+'</div>';}).join(''):'<div class="sm mute">none since sampling began</div>')+'</div></div>';}
  function serversView(){var L=V.servers.filter(function(s){if(F.plat&&s.platform_label!==F.plat)return false;if(F.q&&(s.name+' '+s.version+' '+s.site).toLowerCase().indexOf(F.q.toLowerCase())<0)return false;
      if(F.rule==='late')return s.cadence.late;if(F.rule){var c=s.checks.find(function(x){return x.rule===F.rule;});return c&&(F.rule==='UPD-02'?c.state!=='pass':c.state==='fail');}return true;});
    var plats=V.platforms.map(function(p){return p.platform;});
    return '<section class="card"><div class="row" style="margin-bottom:10px"><input class="inp" id="q" style="max-width:260px" placeholder="Search server, version, site" value="'+esc(F.q)+'"><select class="inp" id="fplat" style="max-width:200px"><option value="">All platforms</option>'+plats.map(function(p){return '<option'+(F.plat===p?' selected':'')+'>'+esc(p)+'</option>';}).join('')+'</select>'
      +'<select class="inp" id="frule" style="max-width:300px"><option value="">All servers</option>'+V.rules.map(function(r){return '<option value="'+esc(r.id)+'"'+(F.rule===r.id?' selected':'')+'>'+esc((r.id==='UPD-02'?'Not reporting / stale - ':'Failing ')+r.id+' '+r.name)+'</option>';}).join('')+'<option value="late"'+(F.rule==='late'?' selected':'')+'>Past their usual update cycle</option></select><span class="sm mute">'+L.length+' shown</span></div>'
      +(L.length?serverTable(L):note('No server matches.'))+'</section>';}
  // ---------- history
  function historyView(){var P=V.policy;if(!V.events.length)return note('No update observed yet. One sample is taken a day (and on "Take today\'s sample"); a change in version, hotfix or installed-patch count between two samples becomes an update here.');
    return '<section class="card"><h2>Updates observed <span class="c">production and critical servers need a change reference and a post-update check within '+P.closeout_days+' days</span></h2><table><thead><tr><th>Day</th><th>Server</th><th>Change</th><th>Change reference</th><th>Post-update check</th><th></th></tr></thead><tbody>'+V.events.map(function(e){var sens=e.prod||/critical|high/i.test(e.criticality||''),late=sens&&(!e.change_ref||!e.check)&&(Date.now()-e.at)>P.closeout_days*86400000;
      return '<tr><td class="sm">'+esc(e.day)+'</td><td><b>'+esc(e.name)+'</b><div class="sm mute">'+esc(e.platform)+(sens?' · production / critical':'')+'</div></td><td class="sm">'+esc(e.kind)+': <span class="mono">'+esc(e.from)+'</span> → <span class="mono">'+esc(e.to)+'</span></td>'
        +'<td>'+(e.change_ref?pill(e.change_ref.ref,'v-info')+'<div class="sm mute">'+esc(e.change_ref.by)+'</div>':sens?pill(late?'missing - late':'missing',late?'v-bad':'v-warn'):'<span class="sm mute">not required</span>')+'</td>'
        +'<td>'+(e.check?pill(e.check.result,e.check.result==='passed'?'v-ok':'v-bad')+'<div class="sm mute">'+esc(e.check.by)+(e.check.note?' · '+esc(e.check.note):'')+'</div>':sens?pill(late?'missing - late':'missing',late?'v-bad':'v-warn'):'<span class="sm mute">not required</span>')+'</td>'
        +'<td>'+(V.can_act?'<button class="btn sm" type="button" data-close="'+esc(e.id)+'">Record</button>':'')+'</td></tr>'
        +(CLOSE===e.id?'<tr><td colspan="6"><div class="row"><input class="inp" id="cref" style="max-width:220px" placeholder="Change reference (e.g. CHG-2026-0142)" value="'+esc(e.change_ref?e.change_ref.ref:'')+'"><select class="inp" id="ccheck" style="max-width:200px"><option value="">Post-update check…</option><option value="passed">Passed - services up</option><option value="failed">Failed</option></select><input class="inp" id="cnote" style="max-width:360px" placeholder="Note (required when the check failed)"><button class="btn pri sm" type="button" id="csave">Save</button></div></td></tr>':'');}).join('')+'</tbody></table></section>';}
  // ---------- patches
  function patchesView(){var C=V.catalog;if(!C.length)return note(V.notes&&V.notes.endpoint_central?'Endpoint Central is not read: '+V.notes.endpoint_central:'No missing patch in the Endpoint Central catalogue.');
    return '<section class="card"><h2>Missing patches against the SLA <span class="c">critical '+V.policy.sla.critical+' d · important '+V.policy.sla.important+' d · moderate '+V.policy.sla.moderate+' d · low '+V.policy.sla.low+' d</span></h2><table><thead><tr><th>Patch</th><th>Severity</th><th>Released</th><th>Age / SLA</th><th>Missing on</th><th>State</th></tr></thead><tbody>'+C.map(function(p){
      return '<tr><td><b>'+esc(p.name)+'</b><div class="sm mute">'+esc([p.patch_id,p.bulletin].filter(Boolean).join(' · '))+(p.reboot?' · reboot':'')+'</div></td><td>'+pill(p.severity,p.severity==='critical'?'v-bad':p.severity==='important'?'v-warn':'v-mute')+'</td><td class="sm">'+esc(p.released)+'</td><td class="sm">'+p.age_days+' d'+(p.sla_days!=null?' / '+p.sla_days+' d':'')+'</td><td>'+esc(p.missing_on)+' computer(s)</td>'
        +'<td>'+(p.overdue?pill('past SLA','v-bad'):p.due_in_7?pill('SLA in '+(p.sla_days-p.age_days)+' d','v-warn'):pill('within SLA','v-ok'))+'</td></tr>';}).join('')+'</tbody></table><div class="sm mute" style="margin-top:8px">Deploy from User Desktops → Patch Management (an approval request) or Endpoint Central.</div></section>';}
  // ---------- drift
  function driftView(){if(!V.drift.length)return note('Every hypervisor host runs the same build as the rest of its platform and cluster - or versions are not reported yet.');
    return V.drift.map(function(g){var tot=g.versions.reduce(function(s,x){return s+x.hosts;},0);return '<section class="card"><h2>'+esc(g.group)+' <span class="c">newest: '+esc(g.newest)+'</span></h2>'+g.versions.map(function(x,i){return '<div class="row sm" style="margin-bottom:6px"><span class="mono" style="min-width:320px">'+esc(x.version)+'</span><div class="bar" style="flex:1"><i style="width:'+(x.hosts/tot*100)+'%;background:'+(x.version===g.newest?'#2fb344':'#f59f00')+'"></i></div><span>'+x.hosts+' host(s)</span></div>';}).join('')
      +'<div class="sm mute">Hosts behind: '+esc(V.servers.filter(function(s){return s.drift&&s.drift.group.replace('|',' / ').replace(/ \/ $/,'')===g.group;}).map(function(s){return s.name;}).join(', '))+'</div></section>';}).join('');}
  // ---------- policy
  function policyView(){var P=V.policy,a=V.can_admin,f=function(id,v,min,max){return a?'<input class="inp" style="max-width:100px" type="number" min="'+min+'" max="'+max+'" id="'+id+'" value="'+v+'">':'<b>'+esc(v)+'</b>';};
    return '<section class="card"><h2>Patch SLA and cycle <span class="c">days</span></h2><table><tbody>'+['critical','important','moderate','low'].map(function(k){return '<tr><td>'+esc(k)+' patches installed within</td><td>'+f('sla-'+k,P.sla[k],1,365)+'</td></tr>';}).join('')
      +'<tr><td>Every server updated within (UPD-03)</td><td>'+f('p-cycle',P.cycle_days,7,365)+'</td></tr><tr><td>Patch state reported within (UPD-02)</td><td>'+f('p-fresh',P.fresh_days,1,60)+'</td></tr><tr><td>Change reference and post-update check recorded within (UPD-05 / 06)</td><td>'+f('p-close',P.closeout_days,1,30)+'</td></tr></tbody></table>'
      +(a?'<div class="row" style="margin-top:10px"><button class="btn pri" type="button" id="psave">Save policy</button></div>':'<div class="sm mute" style="margin-top:8px">An administrator sets the policy.</div>')+'</section>';}
  // ---------- AI
  function aiView(){var a=V.ai||{};if(!a.enabled)return note('The AI update analyst is off: '+(a.reason||'not configured')+'. Everything else on this page works without it.');if(!V.can_act)return note('The AI update analyst is for operators and administrators.');
    return '<section class="card"><h2>AI update analyst <span class="c">reads the servers, the patches and the history; it installs nothing</span></h2><div class="row"><input class="inp" id="aq" style="max-width:720px" placeholder="e.g. Which servers should we patch first this week, and which updates still need a change reference?"><button class="btn pri" type="button" id="ask">Ask</button></div>'
      +(ANS?'<div class="ans">'+esc(ANS.answer)+'</div>'+(ANS.injection_signals&&ANS.injection_signals.length?'<div class="note" style="margin-top:8px">Some server or patch text looked like instructions to the AI and was treated as data: '+esc(ANS.injection_signals.join(', '))+'.</div>':''):'')+'</section>';}
  // ---------- Excel
  function xls(){var by=USER||ROLE,s=V.summary;
    var sheets=[{name:'Summary',columns:[{h:'Measure',w:40},{h:'Value',w:18}],rows:[['Servers',s.servers],['Measured',s.measured],['Within policy',s.compliant],['Within policy %',s.pct],['Not measured',s.not_measured],['Critical patches missing',s.critical_missing],['Patches past SLA',s.overdue_patches],['Reach SLA in 7 days',s.due_soon],['Updates seen in 30 days',s.events_30d],['Awaiting change ref / check',s.open_closeout],['Behind platform build',s.drifting],['Past usual cycle',s.late]]},
      {name:'Servers',columns:[{h:'Server',w:24},{h:'Platform',w:18},{h:'Cluster',w:14},{h:'Site',w:14},{h:'Production',w:10},{h:'Criticality',w:10},{h:'Version',w:40},{h:'Patch level',w:16},{h:'Critical missing',t:'n'},{h:'Last update',w:12},{h:'Risk',t:'n'},{h:'Risk reasons',w:60}].concat(V.rules.map(function(r){return {h:r.id,w:12};})),
        rows:V.servers.map(function(x){return [x.name,x.platform_label,x.cluster,x.site,x.prod?'yes':'no',x.criticality,x.version,x.patch_level,x.ec?x.ec.critical:null,x.last_update||'',x.risk,x.risk_why.join('; ')].concat(V.rules.map(function(r){var c=x.checks.find(function(y){return y.rule===r.id;});return c?c.state:'n/a';}));})},
      {name:'Rules',columns:[{h:'Rule',w:10},{h:'Policy',w:34},{h:'Statement',w:70},{h:'Framework',w:40},{h:'Pass',t:'n'},{h:'Fail',t:'n'},{h:'Not measured',t:'n'}],rows:V.rules.map(function(r){return [r.id,r.name,r.statement,r.refs,r.pass,r.fail,r.not_measured];})},
      {name:'Update history',columns:[{h:'Day',w:12},{h:'Server',w:24},{h:'Platform',w:14},{h:'Kind',w:10},{h:'From',w:36},{h:'To',w:36},{h:'Change ref',w:18},{h:'Ref by',w:16},{h:'Check',w:10},{h:'Check by',w:16},{h:'Note',w:40}],rows:V.events.map(function(e){return [e.day,e.name,e.platform,e.kind,e.from,e.to,e.change_ref?e.change_ref.ref:'',e.change_ref?e.change_ref.by:'',e.check?e.check.result:'',e.check?e.check.by:'',e.check?e.check.note:''];})},
      {name:'Patches',columns:[{h:'Patch',w:50},{h:'ID',w:10},{h:'Bulletin',w:14},{h:'Severity',w:10},{h:'Released',w:12},{h:'Age days',t:'n'},{h:'SLA days',t:'n'},{h:'Missing on',t:'n'},{h:'Past SLA',w:8}],rows:V.catalog.map(function(p){return [p.name,p.patch_id,p.bulletin,p.severity,p.released,p.age_days,p.sla_days,p.missing_on,p.overdue?'yes':'no'];})},
      {name:'Version drift',columns:[{h:'Group',w:24},{h:'Version',w:44},{h:'Hosts',t:'n'},{h:'Newest',w:8}],rows:[].concat.apply([],V.drift.map(function(g){return g.versions.map(function(x){return [g.group,x.version,x.hosts,x.version===g.newest?'yes':'no'];});}))}];
    window.zybXlsx.download('it-operations-updates-'+String(V.at).slice(0,10)+'.xlsx',sheets,{title:('IT Operations & Updates - ' + ZYB_ORG.short),filter:'all servers; generated '+V.at,by:by});}
  // ---------- events
  document.addEventListener('input',function(ev){if(ev.target.id==='q'){F.q=ev.target.value;var pos=ev.target.selectionStart;$('view').innerHTML=serversView();var q=$('q');q.focus();try{q.setSelectionRange(pos,pos);}catch(e){/* not a text field */}}});
  document.addEventListener('change',function(ev){if(ev.target.id==='frule'){F.rule=ev.target.value;$('view').innerHTML=serversView();}if(ev.target.id==='fplat'){F.plat=ev.target.value;$('view').innerHTML=serversView();}});
  document.addEventListener('click',function(ev){var el=ev.target.closest('[data-tab],[data-go],[data-rule],[data-srv],[data-close],button[id]');if(!el)return;
    if(el.dataset.tab){TAB=el.dataset.tab;return draw();}
    if(el.dataset.go!=null){var g=el.dataset.go.split(':');TAB=g[0];if(TAB==='servers')F={rule:g[1]||'',plat:'',q:''};return draw();}
    if(el.dataset.rule){TAB='servers';F={rule:el.dataset.rule,plat:'',q:''};return draw();}
    if(el.dataset.srv){SEL=SEL===el.dataset.srv?'':el.dataset.srv;if(TAB!=='servers'&&TAB!=='overview')TAB='servers';return draw();}
    if(el.dataset.close){CLOSE=CLOSE===el.dataset.close?'':el.dataset.close;return draw();}
    var id=el.id;
    if(id==='refresh')return load();
    if(id==='xls'&&V)return xls();
    if(id==='sample'){el.disabled=true;return req('POST','/updates/sample').then(function(r){toast('Sample taken: '+r.servers+' server(s), '+r.events+' new update(s)');el.disabled=false;return load();}).catch(function(e){el.disabled=false;toast(e.message);});}
    if(id==='csave'){var b={};var ref=$('cref').value.trim(),c=$('ccheck').value,n=$('cnote').value.trim();if(ref)b.change_ref=ref;if(c)b.check=c;if(n)b.note=n;el.disabled=true;
      return req('POST','/updates/events/'+encodeURIComponent(CLOSE)+'/closeout',b).then(function(){toast('Recorded');CLOSE='';return load();}).catch(function(e){el.disabled=false;toast(e.message);});}
    if(id==='psave'){var sla={};['critical','important','moderate','low'].forEach(function(k){sla[k]=parseInt($('sla-'+k).value,10);});el.disabled=true;
      return req('POST','/updates/policy',{sla:sla,cycle_days:parseInt($('p-cycle').value,10),fresh_days:parseInt($('p-fresh').value,10),closeout_days:parseInt($('p-close').value,10)}).then(function(){toast('Policy saved');return load();}).catch(function(e){el.disabled=false;toast(e.message);});}
    if(id==='ask'){var q=$('aq').value.trim();if(q.length<3)return toast('Type a question');el.disabled=true;el.textContent='Thinking…';return req('POST','/updates/ai/ask',{question:q}).then(function(r){ANS=r;draw();}).catch(function(e){el.disabled=false;el.textContent='Ask';toast(e.message);});}
  });
  req('GET','/dashboards/whoami.json').then(function(w){ROLE=(w&&w.role)||'viewer';USER=(w&&w.user)||'';}).catch(function(){ROLE='viewer';/* no identity: read-only */}).then(load);
})();
</script></body></html>
