<!-- Risk Reports: the Risk Committee pack, the Board risk report and the regulator (Insurance Authority) pack, built by the server from
     the register, the RAS, the assessment cycles and the emerging risks at the moment they are asked for (operator - the register

     anywhere. The regulator layout is a working structure to check against the Authority's template. API: /api/itam/brisk/reports/:kind -->
<style>
.sec{break-inside:avoid}
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr);gap:14px;align-items:stretch}@media(max-width:1100px){.ex{grid-template-columns:1fr 1fr}.ex .hl{grid-column:1/-1}}@media(max-width:640px){.ex{grid-template-columns:1fr}}

.hl ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}.hl li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;font-size:13px;line-height:1.35}.hl li .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:16px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.hm{display:grid;grid-template-columns:86px repeat(5,minmax(0,1fr));gap:4px;direction:ltr;font-size:11px}.hm .c{border-radius:7px;min-height:38px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0b0e14}.hm .c.z{background:#161c28!important;color:#3a4458;font-weight:400}.hm .ax{color:var(--mu);display:flex;align-items:center;font-size:11px;line-height:1.2}.hm .ax.b{justify-content:center;text-align:center}
.sb{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}.sb .tr{height:12px;border-radius:999px;background:#1b2332;overflow:hidden;display:flex}.sb .tr i{display:block;height:100%}.sb b{text-align:end;font-variant-numeric:tabular-nums}

@media print{.hm .c.z{background:#eee!important}.em .cl{background:#f4f4f4}}
.lk{color:inherit;text-decoration:none;cursor:pointer;display:block}a.t.lk:hover{outline:1px solid var(--a,#4a5162);outline-offset:-1px}.lg a.lk{display:flex;align-items:center;gap:6px;padding:1px 4px;border-radius:6px}.lg a.lk:hover{background:rgba(255,255,255,.06)}.hl li a.lk:hover{text-decoration:underline}
</style></head><body><main>
<section class="rp-hero"><div class="eb">Enterprise risk · reporting</div><h1 id="title">Risk reports</h1>
 <p id="sub">Built from the records in the system when you open them - no copying from spreadsheets. Print or save as PDF, or download the tables to Excel.</p>
 <div class="rp-top rp-noprint"><a class="btn" href="enterprise-risk.html"><i class="ti ti-shield-chevron"></i>Enterprise risk</a><button type="button" class="btn" id="print"><i class="ti ti-printer"></i>Print / Save as PDF</button><button type="button" class="btn" id="xlsx"><i class="ti ti-file-spreadsheet"></i>Download Excel</button></div></section>
<div class="tabs rp-noprint" role="tablist"><button type="button" role="tab" data-kind="committee" aria-selected="true">Risk Committee pack</button><button type="button" role="tab" data-kind="board" aria-selected="false">Board report</button><button type="button" role="tab" data-kind="regulator" aria-selected="false">Insurance Authority pack</button></div>
<div id="err"></div><div id="rep"></div>
</main>
<script>
(function(){
  'use strict';
  var Z=window.ZRP,esc=Z.esc,$=Z.$,KIND='committee',D=null;
  var ZN={within_appetite:['Within appetite','#2fb344'],outside_appetite:['Outside appetite','#f59f00'],outside_tolerance:['Outside tolerance','#f2683c'],capacity_breach:['Capacity breach','#e5484d']};
  // every figure opens the list behind it (the register filtered, the appetite cockpit, the RAS, the cycle) - a link, so it also works from a printed PDF's URL
  function tile(l,v,s,a,href){var inner='<div class="l">'+esc(l)+'</div><div class="v">'+esc(String(v))+'</div><div class="s">'+esc(s)+'</div>';return href?'<a class="t lk" href="'+esc(href)+'" style="--a:'+a+'" title="'+esc('Open: '+l)+'">'+inner+'</a>':'<div class="t" style="--a:'+a+'">'+inner+'</div>';}
  var REG='business-risk-register.html',RAS='ras-cockpit.html';
  function table(head,rows){return rows.length?'<div class="tw"><table><thead><tr>'+head.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>':'<div class="empty">None.</div>';}
  function load(){[].forEach.call(document.querySelectorAll('[data-kind]'),function(b){b.setAttribute('aria-selected',String(b.dataset.kind===KIND));});$('rep').innerHTML='<div class="empty">Building the report…</div>';
    return Z.req('GET','/brisk/reports/'+KIND).then(function(j){D=j;$('err').innerHTML='';draw();}).catch(function(e){D=null;$('rep').innerHTML='';$('err').innerHTML='<div class="err">'+esc(e.status===403?'Reports export the whole register: they need the operator role.':e.message)+'</div>';});}
  // ---------- charts (inline SVG / CSS, drawn from the report's own figures; nothing is estimated)
  var ZC={within_appetite:'#2fb344',outside_appetite:'#f59f00',outside_tolerance:'#f2683c',capacity_breach:'#e5484d',none:'#3a4458'};
  var bandCol=function(s){return s>=15?'#e5484d':s>=10?'#f59f00':s>=5?'#e6c229':'#2fb344';};
  function donut(segs,center,sub,label){var tot=segs.reduce(function(a,x){return a+x.v;},0),R=56,C=2*Math.PI*R,off=0;
    var arcs=tot?segs.filter(function(x){return x.v;}).map(function(x){var len=x.v/tot*C,o='<circle r="'+R+'" cx="75" cy="75" fill="none" stroke="'+x.c+'" stroke-width="20" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 75 75)"><title>'+esc(x.l+': '+x.v)+'</title></circle>';off+=len;return o;}).join(''):'';
    return '<div class="dn"><svg viewBox="0 0 150 150" role="img" aria-label="'+esc(label+': '+segs.map(function(x){return x.l+' '+x.v;}).join(', '))+'"><circle r="'+R+'" cx="75" cy="75" fill="none" stroke="#1b2332" stroke-width="20"/>'+arcs+'<text x="75" y="74" text-anchor="middle" font-size="28" font-weight="800" fill="currentColor">'+esc(String(center))+'</text><text x="75" y="94" text-anchor="middle" font-size="11" fill="#8c95a8">'+esc(sub)+'</text></svg>'
      +'<div class="lg">'+segs.map(function(x){var row='<i style="background:'+x.c+'"></i>'+esc(x.l)+'<b>'+x.v+'</b>';return x.href?'<a class="lk" href="'+esc(x.href)+'" title="'+esc('Open: '+x.l)+'">'+row+'</a>':'<div>'+row+'</div>';}).join('')+'</div></div>';}
  function heat(H){var mx=0;H.inherent.forEach(function(r){r.forEach(function(v){mx=Math.max(mx,v);});});var h='';
    for(var l=5;l>=1;l--){h+='<div class="ax">'+esc(H.likelihood[l-1])+'</div>';for(var i=1;i<=5;i++){var v=H.inherent[l-1][i-1];h+='<div class="c'+(v?'':' z')+'" style="background:'+bandCol(l*i)+';opacity:'+(v?(0.45+0.55*v/mx).toFixed(2):1)+'" title="'+esc('likelihood '+l+' × impact '+i+' = '+(l*i)+': '+v+' risk(s)')+'">'+(v||'·')+'</div>';}}
    h+='<div></div>'+H.impact.map(function(x){return '<div class="ax b">'+esc(x)+'</div>';}).join('');
    return '<div class="hm" role="img" aria-label="inherent heat map, likelihood by impact">'+h+'</div><div class="cap">Rows: likelihood · columns: impact · colour: the methodology\'s band (likelihood × impact) · number: risks in the cell</div>';}
  function headlines(d){var k=d.profile.kpis,ap=d.appetite,as=d.assessment,L=[],oc=d.profile.open_classes||k['class'],c34=(oc[2]||0)+(oc[3]||0);
    L.push([c34?'#e5484d':'#2fb344','ti-alert-triangle',c34?'<b>'+c34+'</b> risk(s) are Class III / IV after controls - they need action or a recorded acceptance.':'No risk is Class III / IV after controls.']);
    var br=ap.breaches.length;L.push(!br&&!k.reported?['#5b6478','ti-gauge','No appetite metric has a value for the last period yet - '+k.due+' due.']:[br?'#f59f00':'#2fb344','ti-gauge',br?'<b>'+br+'</b> appetite metric(s) outside appetite'+(ap.breaches.some(function(b){return b.level>=2;})?', '+ap.breaches.filter(function(b){return b.level>=2;}).length+' beyond tolerance':'')+'.':'Every reported appetite metric is within appetite.'+(k.due?' '+k.due+' not reported for the last period.':'')]);
    if(ap.warnings.length)L.push(['#f59f00','ti-trending-up','<b>'+ap.warnings.length+'</b> metric(s) forecast to leave appetite within three periods.']);
    L.push(ap.approval?[ap.approval.changed_since?'#f59f00':'#2fb344','ti-certificate','RAS '+esc(ap.approval.year)+' approved by the Board ('+esc(ap.approval.board_ref)+')'+(ap.approval.changed_since?' - <b>changed since</b>: '+ap.approval.changed_since.added+' added, '+ap.approval.changed_since.removed+' retired, '+ap.approval.changed_since.limits_changed+' limit(s).':', unchanged since.')]:['#e5484d','ti-certificate','No Board approval of the RAS is recorded in the system.']);
    L.push(as.last?['#6366f1','ti-clipboard-check','Self-assessment <b>'+esc(as.last.period)+'</b> approved: '+as.last.up+' rated higher, '+as.last.down+' lower.']:['#5b6478','ti-clipboard-check','No self-assessment cycle approved yet.']);
    if(as.running)L.push([as.running.overdue?'#e5484d':'#6366f1','ti-hourglass','Cycle <b>'+esc(as.running.period)+'</b> running: '+as.running.pct+' % assessed'+(as.running.overdue?', <b>'+as.running.overdue+' overdue</b>':'')+'.']);
    var rising=d.emerging.filter(function(e){return e.trend==='rising';}).length;if(d.emerging.length)L.push(['#a78bfa','ti-radar','<b>'+d.emerging.length+'</b> emerging risk(s) watched'+(rising?', '+rising+' rising':'')+'.']);
    var LINK={'ti-alert-triangle':REG+'#class=34&status=active','ti-gauge':RAS+(k.due&&!br?'#rep':'#ov'),'ti-trending-up':RAS+'#ov','ti-certificate':'ras-manage.html','ti-clipboard-check':'risk-cycle.html','ti-hourglass':'risk-cycle.html','ti-radar':'#sec-emerging'};
    return '<ul>'+L.map(function(x){var href=LINK[x[1]];return '<li style="--c:'+x[0]+'"><span class="ic"><i class="ti '+x[1]+'"></i></span>'+(href?'<a class="lk" href="'+esc(href)+'">'+x[2]+'</a>':'<span>'+x[2]+'</span>')+'</li>';}).join('')+'</ul>';}
  function emergMatrix(E){var HZ=['0-1y','1-3y','3-5y','5y+'],h='',n=0,idx={};E.forEach(function(e){idx[e.id]=++n;});
    for(var im=5;im>=1;im--){h+='<div class="ax">impact '+im+'</div>';HZ.forEach(function(z){var I=E.filter(function(e){return e.impact===im&&e.horizon===z;});h+='<div class="cl'+(im>=4&&(z==='0-1y'||z==='1-3y')?' hot':'')+'">'+I.map(function(e){return '<span class="d" style="--c:'+(e.trend==='rising'?'#e5484d':e.trend==='falling'?'#2fb344':'#6366f1')+'" title="'+esc(e.title+' ('+e.trend+')')+'">'+idx[e.id]+'</span>';}).join('')+'</div>';});}
    h+='<div></div>'+HZ.map(function(z){return '<div class="ax b">'+esc(z)+'</div>';}).join('');
    return '<div class="em" role="img" aria-label="emerging risks by horizon and impact">'+h+'</div><div class="cap">Columns: horizon · rows: impact · colour: trend (red rising, blue stable, green falling) · the shaded corner is near and severe</div>';}
  function draw(){var d=D,k=d.profile.kpis,ap=d.appetite,as=d.assessment;$('title').textContent=d.title;
    $('sub').textContent='Generated '+String(d.generated_at).slice(0,16).replace('T',' ')+' UTC by '+d.generated_by+(d.note?'. '+d.note:' from the records in the system.');
    var h='<div class="k">'+tile('Open risks',k.open,k.risks+' in the register','#f97316',REG+'#status=active')+tile('Class III / IV',((d.profile.open_classes||k['class'])[2]||0)+((d.profile.open_classes||k['class'])[3]||0),'open, residual after controls','#e5484d',REG+'#class=34&status=active')+tile('Outside appetite',k.outside_appetite,'of '+k.metrics+' appetite metrics',k.outside_appetite?'#f59f00':'#2fb344',RAS+'#ov')
      +tile('Early warnings',k.early_warnings,'forecast to leave appetite',k.early_warnings?'#f59f00':'#3a4258',RAS+'#ov')+tile('Emerging risks',d.emerging.length,'on the watch list','#a78bfa','#sec-emerging')+tile('RAS approved',ap.approval?ap.approval.year:'no',ap.approval?'Board ref '+ap.approval.board_ref:'not recorded in the system',ap.approval?'#2fb344':'#e5484d','ras-manage.html')+'</div>';
    // the executive view: residual classes, appetite position, the headlines
    var cls=['Class I','Class II','Class III','Class IV'].map(function(c,i){return {l:c,v:(d.profile.open_classes||k['class'])[i]||0,c:Z.CLS[c],href:REG+'#class='+(i+1)+'&status=active'};}),zs=['within_appetite','outside_appetite','outside_tolerance','capacity_breach'].map(function(z){return {l:ZN[z][0],v:ap.zones[z]||0,c:ZC[z],href:RAS+'#ov'};});
    var rep=zs.reduce(function(a,x){return a+x.v;},0);zs.push({l:'Not reported / no value',v:Math.max(0,k.metrics-rep),c:ZC.none,href:RAS+'#rep'});
    h+='<div class="ex sec"><div class="card" style="margin:0"><h2><i class="ti ti-chart-donut"></i>Residual risk</h2>'+donut(cls,cls.reduce(function(a,x){return a+x.v;},0),'open risks','residual classes of open risks')+'</div>'
      +'<div class="card" style="margin:0"><h2><i class="ti ti-gauge"></i>Appetite position</h2>'+donut(zs,k.metrics,'metrics','appetite zones')+'</div>'
      +'<div class="card hl" style="margin:0"><h2><i class="ti ti-news"></i>Headlines</h2>'+headlines(d)+'</div></div><div style="height:14px"></div>';
    // 1 profile: categories (Class III / IV part in red) and the heat map
    var mx=Math.max.apply(null,[1].concat(d.profile.by_category.map(function(c){return c.risks;})));
    h+='<div class="g2"><div class="card sec"><h2>1. Risk profile by category <span class="c">open risks · red: Class III / IV</span></h2>'+(d.profile.by_category.length?d.profile.by_category.slice().sort(function(a,b){return b.risks-a.risks;}).map(function(c){return '<div class="sb"><span>'+esc(c.category)+'</span><span class="tr" title="'+esc(c.risks+' open, '+c.class3_plus+' Class III / IV')+'"><i style="width:'+(c.class3_plus/mx*100).toFixed(1)+'%;background:#e5484d"></i><i style="width:'+((c.risks-c.class3_plus)/mx*100).toFixed(1)+'%;background:#f97316"></i></span><b>'+c.risks+'</b></div>';}).join(''):'<div class="empty">No open risk.</div>')
      +(d.profile.uncategorised?'<div class="note">'+d.profile.uncategorised+' open risk(s) with no category - set them on the Insurance risk catalogue.</div>':'')+'</div>';
    h+='<div class="card sec"><h2>2. Inherent risk map</h2>'+(d.profile.heat?heat(d.profile.heat):'<div class="sm mu">The Board report shows the residual classes above; the map is in the committee and regulator packs.</div>')+'<div class="note">Quality: '+d.quality.stale+' not assessed in 12 months, '+d.quality.not_rated+' not rated, '+d.quality.acceptance_pending+' acceptance(s) waiting.</div></div></div>';
    // 3 top risks
    h+='<div class="card sec"><h2>3. '+(KIND==='board'?'Top risks':'Class III / IV risks')+' <span class="c">'+d.top_risks.length+'</span></h2>'+table(['Risk','Department','Category','Owner','Inherent','Residual','Treatment'],d.top_risks.map(function(r){var sc=Number((/\((\d+)\)/.exec(r.inherent||'')||[])[1]);return ['<b>'+esc(r.code)+'</b> '+esc(r.title),esc(r.department),esc(r.category),esc(r.owner),(sc?'<span class="sc" style="background:'+bandCol(sc)+'">'+sc+'</span> ':'')+'<span class="sm mu">'+esc(String(r.inherent||'').replace(/\s*\(\d+\)/,''))+'</span>',Z.cls(r['class']),Z.pill(String(r.treatment||'-').replace(/_/g,' '),r.treatment==='in_place'?'#2fb344':r.treatment==='partial'?'#f59f00':r.treatment==='not_in_place'?'#e5484d':'#5b6478')+(r.target?' <span class="sm mu">'+esc(r.target)+'</span>':'')];}))+'</div>';
    // 4 appetite
    h+='<div class="card sec"><h2>4. Risk appetite</h2><div class="zb" role="img" aria-label="'+esc(zs.map(function(x){return x.l+' '+x.v;}).join(', '))+'">'+zs.filter(function(x){return x.v;}).map(function(x){return '<i style="width:'+(x.v/Math.max(1,k.metrics)*100).toFixed(1)+'%;background:'+x.c+'" title="'+esc(x.l+': '+x.v)+'"></i>';}).join('')+'</div><div class="flt" style="margin-bottom:8px">'+Object.keys(ZN).map(function(z){return Z.pill(ZN[z][0]+': '+(ap.zones[z]||0),ZN[z][1]);}).join(' ')+'</div>'
      +(ap.approval?'<div class="sm">RAS '+esc(ap.approval.year)+' approved by the Board ('+esc(ap.approval.board_ref)+', recorded '+esc(String(ap.approval.decided_at).slice(0,10))+')'+(ap.approval.changed_since?' - <b style="color:#f5c26b">changed since: '+ap.approval.changed_since.added+' added, '+ap.approval.changed_since.removed+' retired, '+ap.approval.changed_since.limits_changed+' limits</b>':' - unchanged since.')+'</div>':'<div class="sm" style="color:#f5c26b">No Board approval of the RAS is recorded in the system.</div>')
      +'<h3 class="sm mu" style="margin:10px 0 4px">Breaches</h3>'+table(['Metric','Department','Period','Value','Zone'],ap.breaches.map(function(b){return ['<b>'+esc(b.id)+'</b> '+esc(b.component),esc(b.responsibility),esc(b.period),esc(b.text||b.value),Z.pill((ZN[b.zone]||[b.zone])[0],(ZN[b.zone]||[0,'#5b6478'])[1])];}))
      +(ap.warnings.length?'<h3 class="sm mu" style="margin:10px 0 4px">Early warnings</h3>'+table(['Metric','Department','Chance','Why'],ap.warnings.map(function(w){var pc=Math.round((w.p||0)*100);return ['<b>'+esc(w.id)+'</b> '+esc(w.component),esc(w.responsibility),'<span class="pb"><i style="width:'+pc+'%"></i></span>'+pc+' %',esc(w.why)];})):'')+'</div>';
    // 5 assessment: movement bars
    var mv=function(l,v,t,c){return '<div class="mvb"><span>'+esc(l)+'</span><span class="tr"><i style="width:'+(t?v/t*100:0).toFixed(1)+'%;background:'+c+'"></i></span><b>'+v+'</b></div>';};
    h+='<div class="g2"><div class="card sec"><h2>5. Risk and control self-assessment</h2>'+(as.last?'<div class="sm" style="margin-bottom:6px">Last approved: <b>'+esc(as.last.period)+'</b> ('+esc(String(as.last.approved_at).slice(0,10))+', '+esc(as.last.approved_by)+') - '+as.last.risks+' risks</div>'
        +mv('▲ rated higher',as.last.up,as.last.risks,'#e5484d')+mv('▼ rated lower',as.last.down,as.last.risks,'#2fb344')+mv('= unchanged',Math.max(0,as.last.risks-as.last.up-as.last.down),as.last.risks,'#5b6478')
        +(as.last.compare?'<div class="cap">Against the previous cycle: '+as.last.compare.up+' up, '+as.last.compare.down+' down, '+as.last['compare']['new']+' new, '+as.last.compare.left+' left.</div>':'')
      :'<div class="sm mu">No assessment cycle approved yet.</div>')
      +(as.running?'<div class="sm" style="margin-top:10px">Running: <b>'+esc(as.running.period)+'</b> '+esc(as.running.state)+', '+as.running.signed+'/'+as.running.departments+' departments signed off, due '+esc(as.running.due)+(as.running.overdue?' - <b style="color:#ff7b72">'+as.running.overdue+' overdue</b>':'')+'</div>'+mv('assessed',as.running.pct,100,'#6366f1').replace('<b>'+as.running.pct+'</b>','<b>'+as.running.pct+'%</b>'):'')+'</div>';
    // 6 emerging: horizon x impact
    h+='<div class="card sec" id="sec-emerging"><h2>6. Emerging risks <span class="c">'+d.emerging.length+'</span></h2>'+(d.emerging.length?emergMatrix(d.emerging):'')+table(['#','Risk','Category','Horizon','Trend','Impact','Owner'],d.emerging.map(function(e,i){return [String(i+1),'<b>'+esc(e.id)+'</b> '+esc(e.title),esc(e.category),esc(e.horizon),esc(e.trend==='rising'?'▲ rising':e.trend==='falling'?'▼ falling':'= stable'),esc(String(e.impact)),esc(e.owner)];}))+'</div></div>';
    if(d.register){h+='<div class="card sec"><h2>7. Risk register <span class="c">'+d.register.length+' risks</span></h2>'+table(['Code','Department','Risk','Category','Owner','L × I','Inherent','Residual','Status','Assessed'],d.register.map(function(r){var sc=(r.likelihood||0)*(r.impact||0);return [esc(r.code),esc(r.department),esc(r.title),esc(r.category),esc(r.owner),sc?'<span class="sc" style="background:'+bandCol(sc)+'">'+esc(String(r.likelihood))+'×'+esc(String(r.impact))+'</span>':'-',esc(r.inherent||''),Z.cls(r['class']),esc(r.status),esc(String(r.assessed_at||'').slice(0,10))];}))+'</div>';
      h+='<div class="card sec"><h2>8. Risk appetite statement <span class="c">'+d.ras.length+' metrics</span></h2>'+table(['Metric','Section','Department','Appetite','Tolerance','Capacity','Latest'],d.ras.map(function(m){var L=m.limits||{},two=function(a,b){return esc([L[a],L[b]].filter(Boolean).join(' / ')||'-');};return ['<b>'+esc(m.id)+'</b> '+esc(m.component),esc(m.section),esc(m.responsibility),two('app_floor','app_ceil'),two('tol_floor','tol_ceil'),two('cap_floor','cap_ceil'),m.latest?esc(m.latest.period+' '+m.latest.value)+' '+Z.pill((ZN[m.latest.zone]||[m.latest.zone])[0],(ZN[m.latest.zone]||[0,'#5b6478'])[1]):'<span class="mu">not reported</span>'];}))+'</div>';}
    h+='<div class="card sec"><h2>Method</h2><div class="sm mu">Inherent: '+esc(d.method.inherent)+'. Residual: '+esc(d.method.residual)+'.</div></div>';
    $('rep').innerHTML=h;}
  function excel(){if(!D){Z.toast('Open a report first');return;}if(!window.zybXlsx){Z.toast('The Excel writer did not load - refresh the page');return;}var d=D,S=[];
    S.push({name:'Top risks',columns:[{h:'Code'},{h:'Risk',w:50},{h:'Department'},{h:'Category'},{h:'Owner'},{h:'Inherent'},{h:'Residual'},{h:'Treatment'},{h:'Target'}],rows:d.top_risks.map(function(r){return [r.code,r.title,r.department,r.category,r.owner,r.inherent,r['class'],r.treatment,r.target];})});
    S.push({name:'By category',columns:[{h:'Category',w:36},{h:'Open risks',t:'n'},{h:'Class III / IV',t:'n'}],rows:d.profile.by_category.map(function(c){return [c.category,c.risks,c.class3_plus];})});
    S.push({name:'Appetite breaches',columns:[{h:'Metric'},{h:'Component',w:40},{h:'Department'},{h:'Period'},{h:'Value'},{h:'Zone'}],rows:d.appetite.breaches.map(function(b){return [b.id,b.component,b.responsibility,b.period,String(b.text||b.value),b.zone];})});
    S.push({name:'Emerging risks',columns:[{h:'Id'},{h:'Risk',w:50},{h:'Category'},{h:'Horizon'},{h:'Trend'},{h:'Impact',t:'n'},{h:'Owner'}],rows:d.emerging.map(function(e){return [e.id,e.title,e.category,e.horizon,e.trend,e.impact,e.owner];})});
    if(d.register)S.push({name:'Register',columns:[{h:'Code'},{h:'Department'},{h:'Risk',w:50},{h:'Category'},{h:'Owner'},{h:'Likelihood',t:'n'},{h:'Impact',t:'n'},{h:'Inherent'},{h:'Residual'},{h:'Status'},{h:'Assessed',t:'d'}],rows:d.register.map(function(r){return [r.code,r.department,r.title,r.category,r.owner,r.likelihood,r.impact,r.inherent,r['class'],r.status,String(r.assessed_at||'').slice(0,10)];})});
    if(d.ras)S.push({name:'RAS',columns:[{h:'Metric'},{h:'Component',w:40},{h:'Section'},{h:'Department'},{h:'Appetite floor'},{h:'Appetite ceiling'},{h:'Tolerance floor'},{h:'Tolerance ceiling'},{h:'Capacity floor'},{h:'Capacity ceiling'},{h:'Latest period'},{h:'Latest value'},{h:'Zone'}],rows:d.ras.map(function(m){var L=m.limits||{};return [m.id,m.component,m.section,m.responsibility,L.app_floor,L.app_ceil,L.tol_floor,L.tol_ceil,L.cap_floor,L.cap_ceil,m.latest?m.latest.period:'',m.latest?String(m.latest.value):'',m.latest?m.latest.zone:''];})});
    window.zybXlsx.download(KIND+'-risk-report-'+String(d.generated_at).slice(0,10)+'.xlsx',S,{title:d.title,by:d.generated_by});Z.toast('Excel file written in your browser');}
  document.addEventListener('click',function(ev){var t=ev.target.closest('[data-kind],#print,#xlsx');if(!t)return;
    if(t.dataset.kind){KIND=t.dataset.kind;location.hash=KIND;load();return;}if(t.id==='print'){window.print();return;}if(t.id==='xlsx')excel();});
  var h0=location.hash.replace('#','');if(['committee','board','regulator'].indexOf(h0)>=0)KIND=h0;
  Z.whoami(load);
})();
</script></body></html>
