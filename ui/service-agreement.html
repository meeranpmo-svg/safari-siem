<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Agreement (SLA &amp; NDA)</title><script src="vendor/zyb-org.js"></script><script src="vendor/zyb-dash.js"></script><script src="vendor/zyb-xlsx.js"></script><link rel="stylesheet" href="vendor/tabler/tabler-icons.min.css">
<style>
:root{--d-bg:#0b0d12;--d-panel:#12151c;--d-raise:#181c25;--d-line:#232837;--d-ink:#e7eaf0;--d-mute:#8b93a4;--d-ok:#2fb344;--d-warn:#f59f00;--d-bad:#e5484d;--d-acc:#5b8def}
[hidden]{display:none!important}*{box-sizing:border-box}
body{margin:0;background:var(--d-bg);color:var(--d-ink);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
main{max-width:1500px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}.top h1{margin:0;font-size:24px}.eb{font:600 11px ui-monospace,Consolas,monospace;letter-spacing:.09em;color:var(--d-mute);text-transform:uppercase}
.sp{flex:1}.mute{color:var(--d-mute)}.sm{font-size:12px}
.btn{font:600 13px Inter,"Segoe UI",system-ui,sans-serif;background:var(--d-raise);color:var(--d-ink);border:1px solid var(--d-line);border-radius:9px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:#3a4258}.btn.pri{background:var(--d-acc);border-color:var(--d-acc);color:#fff}.btn.bad{border-color:#5a2a2d;color:#ff8a8e}.btn.sm{padding:3px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--d-panel);border:1px solid var(--d-line);border-radius:16px;padding:16px;margin-bottom:14px;min-width:0}
.card h2{margin:0 0 12px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card h2 .c{color:var(--d-mute);font-weight:400;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.kpi{background:var(--d-raise);border:1px solid var(--d-line);border-radius:12px;padding:10px 12px}.kpi .n{font-size:24px;font-weight:800}.kpi .l{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--d-mute)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:transparent;border:1px solid var(--d-line);color:var(--d-mute);border-radius:999px;padding:6px 14px;font:600 13px Inter,"Segoe UI",system-ui,sans-serif;cursor:pointer;display:inline-flex;gap:6px;align-items:center}.tabs button[aria-selected="true"]{color:#fff;border-color:var(--d-acc);background:rgba(91,141,239,.2)}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}.v-ok{background:rgba(47,179,68,.15);color:#56d364}.v-bad{background:rgba(229,72,77,.2);color:#ff8a8e}.v-warn{background:rgba(245,159,0,.18);color:#f5b544}.v-mute{background:rgba(139,147,164,.16);color:#aab2c2}.v-info{background:rgba(91,141,239,.18);color:#8db0ff}
.note{color:var(--d-mute);font-size:12.5px;padding:10px;border:1px dashed var(--d-line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.8px}th{text-align:left;color:var(--d-mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--d-line)}td{padding:7px 8px;border-bottom:1px solid #1b2030;vertical-align:top}
.inp,select.inp,textarea.inp{background:#0b0d12;color:var(--d-ink);border:1px solid var(--d-line);border-radius:8px;padding:6px 9px;font:13px Inter,"Segoe UI",system-ui,sans-serif;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:10px}.form label{font-size:11.5px;color:var(--d-mute);display:flex;flex-direction:column;gap:3px}.form .w{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.doc{background:#fbfaf7;color:#1d1f24;border-radius:12px;padding:28px 34px;font:14px/1.6 Georgia,"Times New Roman",serif}.doc h3{font:700 18px Georgia,serif;margin:0 0 4px;text-align:center}.doc h4{font:700 14px Georgia,serif;margin:16px 0 4px}.doc p{margin:0 0 8px;white-space:pre-wrap}.doc .stamp{border:1px solid #c9c4b8;border-radius:8px;padding:8px 12px;margin-top:16px;font:12px Inter,sans-serif;color:#444}
.bar{height:8px;border-radius:4px;background:#232837;overflow:hidden;min-width:80px}.bar i{display:block;height:100%}
.li{padding:9px 10px;border-bottom:1px solid #1b2030;cursor:pointer;border-radius:8px}.li:hover{background:#151924}.li.sel{background:#172036}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2430;border:1px solid #2e3747;border-radius:10px;padding:10px 16px;z-index:9999;max-width:90vw}
@media print{body{background:#fff}main>*:not(#main),#kpis,#tabs,.noprint{display:none!important}.card{border:0;padding:0;background:#fff}.doc{padding:0}}
@media(max-width:1100px){.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<div class="top"><div><div class="eb">Reports &amp; Administration</div><h1>Service Agreement</h1><div class="sm mute" id="sub">The SLA and NDA between {{org.short}} and Citynet Work, delivered through Zyberon Information Technology - measured in the platform.</div></div><div class="sp"></div>
 <span class="sm mute" id="me"></span><button class="btn" id="refresh" type="button"><i class="ti ti-refresh"></i>Refresh</button></div>
<div id="err" class="card" hidden></div>
<div id="main" hidden>
 <section class="card" id="kcard"><div class="kpis" id="kpis"></div></section>
 <div class="tabs" id="tabs" role="tablist"></div>
 <div id="view"></div>
</div>
</main>
<script>
(function(){
  'use strict';
  var esc=window.zybDetail.esc, $=function(id){return document.getElementById(id);};
  var V=null, TAB='agreements', DOC='sla', CASES=null, SELC='', MONTH='', STM=null, ROLE='viewer', USER='';
  function toast(t){var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},5000);}
  function req(m,u,b){return new Promise(function(ok,bad){var x=new XMLHttpRequest();x.open(m,/^\/dashboards\//.test(u)?u:'/api/itam'+u);x.withCredentials=true;x.timeout=60000;x.zybQuiet=true;if(b)x.setRequestHeader('Content-Type','application/json');
    x.onload=function(){var j=null;try{j=JSON.parse(x.responseText);}catch(e){j=null;/* not JSON: shown as the HTTP status */}if(x.status>=200&&x.status<300&&j)return ok(j);bad(Object.assign(new Error((j&&j.error)||('HTTP '+x.status)),{status:x.status}));};
    x.onerror=x.ontimeout=function(){bad(Object.assign(new Error('IT Asset Management is not reachable'),{status:0}));};x.send(b?JSON.stringify(b):null);});}
  function when(t){return t?new Date(t).toLocaleString():'—';}
  function note(t){return '<div class="note">'+esc(t)+'</div>';}
  function pill(t,c){return '<span class="pill '+c+'">'+esc(t)+'</span>';}
  function metPill(m){return m===true?pill('met','v-ok'):m===false?pill('missed','v-bad'):pill('pending','v-mute');}
  function party(){return V.party;}
  function load(){$('err').hidden=true;return req('GET','/sla').then(function(v){V=v;MONTH=MONTH||v.month;$('main').hidden=false;$('me').textContent=v.party?'You act for the '+(v.party==='customer'?('Customer (' + ZYB_ORG.short + ')'):'Provider (Citynet Work / Zyberon)'):'Read-only (not a member of either party)';draw();}).catch(function(e){$('main').hidden=true;$('err').hidden=false;$('err').innerHTML='<h2><i class="ti ti-alert-triangle"></i>The Service Agreement is not available</h2>'+note(e.status===404?'Not installed on the server - run the update (update-platform.ps1).':e.message);});}
  function draw(){var c=V.current,k=V.cases;function kp(n,l,col){return '<div class="kpi"><div class="n" style="color:'+(col||'inherit')+'">'+esc(n)+'</div><div class="l">'+esc(l)+'</div></div>';}
    $('kpis').innerHTML=kp(V.documents.published.length+' / 2','agreements published',V.documents.published.length<2?'#f5b544':'')+kp(k.open,'support cases open')+kp(k.at_risk,'cases at risk (75% of time used)',k.at_risk?'#f5b544':'')+kp(k.breached,'cases past a target',k.breached?'#ff7b80':'')
      +kp(c.deduction_pct+'%','this month\'s deductions so far',c.deduction_pct?'#ff7b80':'')+kp(V.audit_due.length,'audit findings to fix');
    var T=[['agreements','file-certificate','Agreements'],['cases','lifebuoy','Support cases'],['statement','receipt','Monthly statement'],['terms','adjustments','Terms']];
    $('tabs').innerHTML=T.map(function(t){return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(TAB===t[0])+'"><i class="ti ti-'+t[1]+'"></i>'+esc(t[2])+'</button>';}).join('');
    var v=$('view');
    if(TAB==='agreements')v.innerHTML=docsView();else if(TAB==='cases'){v.innerHTML=note('Loading…');req('GET','/sla/cases').then(function(r){CASES=r.cases;v.innerHTML=casesView();});}else if(TAB==='statement'){v.innerHTML=note('Loading…');req('GET','/sla/statements/'+MONTH).then(function(s){STM=s;v.innerHTML=stmView();}).catch(function(e){v.innerHTML=note(e.message);});}else v.innerHTML=termsView();}
  // ---------- agreements
  function docHtml(d){return '<div class="doc" id="docprint"><h3>'+esc(d.title)+'</h3><div style="text-align:center;font-size:12px;color:#666">Version '+esc(d.version)+' · '+esc(d.state)+(d.published_at?' · published '+esc(when(d.published_at)):'')+'</div>'
    +d.sections.map(function(s){return '<h4>'+esc(s.h)+'</h4><p>'+esc(s.t)+'</p>';}).join('')
    +(d.approvals.length?'<div class="stamp">'+d.approvals.map(function(a){return 'Approved for the '+esc(a.party)+' by '+esc(a.name)+' ('+esc(a.user)+') on '+esc(when(a.at));}).join('<br>')+'<br><i>Recorded approval in the platform - sign the printed copy, or by the e-signature the parties agree.</i></div>':'')+'</div>';}
  function docsView(){var D=V.documents,pub=D.published.find(function(d){return d.kind===DOC;}),vers=(D.versions||[]).filter(function(d){return d.kind===DOC;});var open=vers.find(function(d){return d.state==='draft'||d.state==='review';});
    var h='<div class="row noprint" style="margin-bottom:10px">'+['sla','nda'].map(function(k){return '<button type="button" class="btn sm'+(DOC===k?' pri':'')+'" data-doc="'+k+'">'+esc(k==='sla'?'Service Level Agreement':'Non-Disclosure Agreement')+'</button>';}).join('')+'<span class="sp"></span>'+(pub?'<button class="btn sm" type="button" id="print"><i class="ti ti-printer"></i>Print / save as PDF</button>':'')+'</div>';
    h+='<div class="cols"><section class="card"><h2><i class="ti ti-file-certificate"></i>'+(pub?'Published version '+esc(pub.version):'Not published yet')+'</h2>'+(pub?docHtml(pub):note('No version of the '+(DOC==='sla'?'SLA':'NDA')+' has been approved by both parties yet.'+(V.can_edit?' Draft it from the terms on the right.':'')))+'</section><section class="card noprint"><h2><i class="ti ti-git-branch"></i>Versions <span class="c">drafts are for review by both parties\' lawyers</span></h2>';
    if(V.can_edit&&!open)h+='<button class="btn pri" type="button" data-gen="'+DOC+'"><i class="ti ti-file-plus"></i>Draft from the current terms</button>';
    if(open){h+='<div class="sm" style="margin:8px 0">'+pill(open.state,'v-warn')+' version '+esc(open.version)+(open.placeholders?' · <b>'+esc(open.placeholders)+' detail(s) still to complete</b> (in [brackets])':'')+'</div>';
      if(open.state==='draft'&&V.can_edit)h+='<div id="secs">'+open.sections.map(function(s,i){return '<label class="sm mute" style="display:block;margin-top:8px">Section '+(i+1)+'<input class="inp" data-sh="'+i+'" value="'+esc(s.h)+'"><textarea class="inp" data-st="'+i+'" style="min-height:80px;margin-top:4px">'+esc(s.t)+'</textarea></label>';}).join('')+'</div><div class="row" style="margin-top:8px"><button class="btn" type="button" data-addsec="1"><i class="ti ti-plus"></i>Add a section</button><button class="btn" type="button" data-dact="edit:'+esc(open.id)+'">Save edits</button><button class="btn pri" type="button" data-dact="submit:'+esc(open.id)+'">Send for approval</button><button class="btn bad" type="button" data-dact="discard:'+esc(open.id)+'">Discard</button></div>';
      else if(open.state==='review'){var sig=['customer','provider'].map(function(p){var s=V.terms.parties[p].signatory,a=open.approvals.find(function(x){return x.party===p;});return '<div class="sm">'+esc(p==='customer'?'Customer':'Provider')+' signatory '+esc(s.name||s.user)+': '+(a?pill('approved '+when(a.at),'v-ok'):pill('waiting','v-mute'))+'</div>';}).join('');
        var mine=['customer','provider'].find(function(p){return (V.terms.parties[p].signatory.user||'').toLowerCase()===USER.toLowerCase();});
        h+=sig+(mine&&!open.approvals.some(function(a){return a.party===mine;})?'<button class="btn pri" type="button" style="margin-top:8px" data-dact="approve:'+esc(open.id)+'"><i class="ti ti-signature"></i>Approve for the '+esc(mine)+'</button>':'')+(V.can_edit?' <button class="btn bad sm" type="button" data-dact="discard:'+esc(open.id)+'">Discard</button>':'')+'<div style="margin-top:10px">'+docHtml(open)+'</div>';}}
    h+='<h2 style="margin-top:14px">History</h2>'+(vers.length?'<table><tbody>'+vers.map(function(d){return '<tr><td>v'+esc(d.version)+'</td><td>'+pill(d.state,d.state==='published'?'v-ok':d.state==='superseded'||d.state==='discarded'?'v-mute':'v-warn')+'</td><td class="sm mute">'+esc(when(d.published_at||d.created_at))+'</td></tr>';}).join('')+'</tbody></table>':'<div class="sm mute">'+(V.party||V.can_edit?'No version yet.':'Versions are shown to the two parties.')+'</div>');
    return h+'</section></div>';}
  // ---------- cases
  function casesView(){var h='<div class="cols"><section class="card"><h2><i class="ti ti-lifebuoy"></i>Support cases <span class="c">targets in the priority\'s cover hours</span></h2>';
    h+=CASES.length?CASES.map(function(x){var u=Math.max(x.response_met===null&&x.status==='open'?x.response_used_pct:0,['resolved','closed'].indexOf(x.status)<0?x.resolve_used_pct:0),col=u>=100?'#e5484d':u>=75?'#f59f00':'#2fb344';
      return '<div class="li'+(SELC===x.id?' sel':'')+'" data-case="'+esc(x.id)+'"><div class="row">'+pill(x.priority+' '+x.priority_name,x.priority==='P1'?'v-bad':x.priority==='P2'?'v-warn':'v-info')+'<b>'+esc(x.title)+'</b><span class="sp"></span>'+pill(x.status,'v-mute')+(x.excluded?pill('excluded','v-mute'):'')+'</div><div class="sm mute">'+esc(x.id)+' · '+esc(when(x.opened_at))+' · response '+(x.response_met===null?'due '+when(x.response_due):x.response_met?'met':'missed')+' · resolution '+(x.resolve_met===null?'due '+when(x.resolve_due):x.resolve_met?'met':'missed')+'</div>'+(['resolved','closed'].indexOf(x.status)<0?'<div class="bar" style="margin-top:6px"><i style="width:'+Math.min(100,u)+'%;background:'+col+'"></i></div>':'')+'</div>';}).join(''):note('No support case yet.');
    h+='</section><section class="card" id="cdet">';var x=CASES.find(function(c){return c.id===SELC;});
    if(x){h+='<h2>'+esc(x.title)+'</h2><div class="sm">'+esc(x.description)+'</div><table style="margin-top:8px"><tbody><tr><td>Priority</td><td>'+esc(x.priority+' '+x.priority_name+' ('+x.cover+')')+'</td></tr><tr><td>Response</td><td>'+metPill(x.response_met)+' due '+esc(when(x.response_due))+(x.responded_at?' · by '+esc(x.responded_by)+' '+esc(when(x.responded_at)):'')+'</td></tr><tr><td>Resolution</td><td>'+metPill(x.resolve_met)+' due '+esc(when(x.resolve_due))+(x.resolved_at?' · by '+esc(x.resolved_by)+' '+esc(when(x.resolved_at)):'')+'</td></tr>'+(x.exclusion?'<tr><td>Exclusion</td><td>'+esc(x.exclusion.reason+' - '+x.exclusion.note+' (asked by '+x.exclusion.requested_by+')')+(x.exclusion.decision?' · '+pill(x.exclusion.decision,x.exclusion.decision==='accepted'?'v-ok':'v-bad')+' by '+esc(x.exclusion.decided_by):' · waiting for the other party')+'</td></tr>':'')+'</tbody></table>';
      var P=party(),b='';if(P==='provider'&&x.status==='open')b+='<button class="btn" type="button" data-ca="respond">Respond</button>';if(P==='provider'&&['open','responded'].indexOf(x.status)>=0)b+='<button class="btn pri" type="button" data-ca="resolve">Resolve</button>';
      if(P==='customer'&&x.status==='resolved')b+='<button class="btn pri" type="button" data-ca="close">Confirm fixed</button><button class="btn bad" type="button" data-ca="reopen">Not fixed</button>';
      if(P&&!x.exclusion)b+='<select class="inp" id="exr" style="max-width:200px"><option value="customer-caused">customer-caused</option><option value="agreed-maintenance">agreed maintenance</option><option value="force-majeure">force majeure</option><option value="third-party">third party</option><option value="other">other</option></select><button class="btn" type="button" data-ca="exclude">Ask to exclude</button>';
      if(P&&x.exclusion&&!x.exclusion.decision&&x.exclusion.party!==P)b+='<button class="btn pri" type="button" data-ca="decide-exclusion" data-dec="accepted">Accept exclusion</button><button class="btn bad" type="button" data-ca="decide-exclusion" data-dec="rejected">Reject</button>';
      if(P)b+='<button class="btn" type="button" data-ca="comment">Comment</button>';
      h+=(P?'<textarea class="inp" id="cnote" maxlength="2000" style="min-height:56px;margin-top:10px" aria-label="Note" placeholder="Note (what was done, why, what is still wrong)"></textarea><div class="row" style="margin-top:8px">'+b+'</div>':'')+'<h2 style="margin-top:12px">History</h2><div class="sm">'+(x.history||[]).slice().reverse().map(function(z){return '<div><b>'+esc(z.action)+'</b> · '+esc(z.by)+' · <span class="mute">'+esc(when(z.at))+'</span>'+(z.note?'<br><span class="mute">'+esc(z.note)+'</span>':'')+'</div>';}).join('')+'</div>';}
    else if(party()==='customer')h+='<h2><i class="ti ti-plus"></i>Open a support case</h2><div class="form"><label class="w">Title<input class="inp" id="nc-title" maxlength="160"></label><label>Priority<select class="inp" id="nc-pri">'+['P1','P2','P3','P4'].map(function(p){var t=V.terms.priorities[p];return '<option value="'+p+'">'+esc(p+' '+t.name+' - response '+t.response_min+' min, fix '+t.resolve_h+' h ('+t.cover+')')+'</option>';}).join('')+'</select></label><label>Category<select class="inp" id="nc-cat"><option>incident</option><option>request</option><option value="audit-fix">audit fix</option><option>change</option><option>question</option></select></label><label class="w">Description<textarea class="inp" id="nc-desc" maxlength="4000" style="min-height:90px"></textarea></label></div><button class="btn pri" type="button" id="nc-go">Open case</button>';
    else h+=note(party()==='provider'?'Choose a case to respond to it.':'Only the two parties\' named people work on cases - an administrator adds them under Terms.');
    return h+'</section></div>';}
  // ---------- statement
  function stmView(){var s=STM,S=s.summary,P=party();var h='<section class="card"><h2><i class="ti ti-receipt"></i>Statement '+esc(s.month)+' <span class="c">'+(s.frozen?esc(s.state)+' by '+esc(s.issued_by)+' '+esc(when(s.issued_at)):'live - '+(s.final?'month ended, ready to issue':'month in progress'))+'</span></h2>'
    +'<div class="row" style="margin-bottom:10px"><input class="inp" type="month" id="mon" value="'+esc(s.month)+'" style="max-width:180px" aria-label="Month"><button class="btn sm" type="button" id="mon-go">Show</button><button class="btn sm" type="button" id="xls"><i class="ti ti-file-spreadsheet"></i>Excel</button><span class="sp"></span>'
    +(P==='provider'&&!s.frozen&&s.final?'<button class="btn pri" type="button" id="issue">Issue to the Customer</button>':'')+(P==='customer'&&s.state==='issued'?'<input class="inp" id="dnote" placeholder="Reason (to dispute)" style="max-width:260px"><button class="btn pri" type="button" data-sd="accepted">Accept</button><button class="btn bad" type="button" data-sd="disputed">Dispute</button>':'')+'</div>'
    +(s.dispute?'<div class="note">Disputed: '+esc(s.dispute)+'</div>':'')
    +'<div class="kpis" style="margin-bottom:12px"><div class="kpi"><div class="n">'+esc(S.targets)+'</div><div class="l">targets measured</div></div><div class="kpi"><div class="n" style="color:#56d364">'+esc(S.met)+'</div><div class="l">met</div></div><div class="kpi"><div class="n" style="color:'+(S.missed?'#ff7b80':'inherit')+'">'+esc(S.missed)+'</div><div class="l">missed</div></div><div class="kpi"><div class="n">'+esc(S.pending)+'</div><div class="l">pending / not recorded</div></div><div class="kpi"><div class="n">'+esc(S.deduction_pct)+'%</div><div class="l">deduction'+(S.capped?' (capped at '+esc(S.cap_pct)+'%)':' (cap '+esc(S.cap_pct)+'%)')+'</div></div><div class="kpi"><div class="n">'+(S.deduction_sar==null?'—':'SAR '+esc(S.deduction_sar.toLocaleString()))+'</div><div class="l">'+(S.monthly_fee_sar==null?'enter the monthly fee under Terms':'of SAR '+esc(S.monthly_fee_sar.toLocaleString()))+'</div></div></div>'
    +'<table><thead><tr><th>Target</th><th>Result</th><th>Deduction</th><th>Basis</th></tr></thead><tbody>'+s.lines.map(function(l){return '<tr><td>'+esc(l.title)+'<div class="sm mute">'+esc(l.kind+' · '+l.ref)+'</div></td><td>'+metPill(l.met)+'</td><td>'+(l.deduction_pct?esc(l.deduction_pct)+'%':'—')+'</td><td class="sm mute">'+esc(l.why)+'</td></tr>';}).join('')+'</tbody></table>';
    if(P&&!s.frozen)h+='<h2 style="margin-top:14px">Monthly figures <span class="c">entered by one party, confirmed by the other</span></h2><div class="row"><input class="inp" type="number" step="0.01" id="m-av" placeholder="Availability %" style="max-width:160px"><input class="inp" type="date" id="m-rep" style="max-width:180px" aria-label="Report delivered"><button class="btn" type="button" id="m-go">Record</button><button class="btn" type="button" id="m-conf">Confirm the other party\'s figures</button></div>';
    return h+'</section>';}
  // ---------- terms
  function termsView(){var t=V.terms,ed=V.can_edit,dis=ed?'':' disabled',P=t.parties;
    var f=function(id,lab,val,typ){return '<label>'+esc(lab)+'<input class="inp" id="'+id+'" value="'+esc(val==null?'':val)+'"'+(typ?' type="'+typ+'"':'')+dis+'></label>';};
    var h='<section class="card"><h2><i class="ti ti-adjustments"></i>Terms <span class="c">'+(ed?'administrators · version '+esc(t.version)+(t.updated_by?' by '+esc(t.updated_by):''):'read-only')+'</span></h2>';
    h+='<h2>Parties</h2><div class="form">'+['customer','provider'].map(function(p){var x=P[p];return f('t-'+p+'-name',(p==='customer'?'Customer':'Provider')+' legal name',x.legal_name)+f('t-'+p+'-cr','Commercial registration',x.cr)+f('t-'+p+'-addr','Address',x.address)+f('t-'+p+'-sn','Signatory name',x.signatory.name)+f('t-'+p+'-st','Signatory title',x.signatory.title)+f('t-'+p+'-su','Signatory sign-in',x.signatory.user);}).join('')+f('t-partner-name','Delivery partner',P.partner.legal_name)+'</div>';
    h+='<h2>People of each party <span class="c">sign-in names, one per line</span></h2><div class="form">'+(typeof t.members.customer==='number'?'<div class="sm mute">'+esc(t.members.customer+' Customer and '+t.members.provider+' Provider people')+'</div>':('<label>Customer (' + ZYB_ORG.short + ')<textarea class="inp" id="t-mc" style="min-height:70px"')+dis+'>'+esc(t.members.customer.join('\n'))+'</textarea></label><label>Provider (Citynet Work / Zyberon)<textarea class="inp" id="t-mp" style="min-height:70px"'+dis+'>'+esc(t.members.provider.join('\n'))+'</textarea></label>')+'</div>';
    h+='<h2>Commercial &amp; hours</h2><div class="form">'+f('t-fee','Monthly fee (SAR)',t.commercial.monthly_fee_sar,'number')+f('t-cap','Deduction cap % per month',t.commercial.cap_pct,'number')+f('t-term','Term (months)',t.commercial.term_months,'number')+f('t-start','Start date',t.commercial.start,'date')+f('t-hs','Business hours from',t.hours.start)+f('t-he','to',t.hours.end)+'</div>';
    h+='<h2>Priorities</h2><table><thead><tr><th></th><th>Name</th><th>Cover</th><th>Response (min)</th><th>Resolution (h)</th><th>Deduction %</th></tr></thead><tbody>'+['P1','P2','P3','P4'].map(function(p){var x=t.priorities[p];return '<tr><td><b>'+p+'</b></td><td><input class="inp" id="t-'+p+'-n" value="'+esc(x.name)+'"'+dis+'></td><td><select class="inp" id="t-'+p+'-c"'+dis+'><option'+(x.cover==='24x7'?' selected':'')+'>24x7</option><option'+(x.cover==='business'?' selected':'')+'>business</option></select></td><td><input class="inp" type="number" id="t-'+p+'-r" value="'+esc(x.response_min)+'"'+dis+'></td><td><input class="inp" type="number" step="0.5" id="t-'+p+'-z" value="'+esc(x.resolve_h)+'"'+dis+'></td><td><input class="inp" type="number" step="0.05" id="t-'+p+'-k" value="'+esc(x.credit_pct)+'"'+dis+'></td></tr>';}).join('')+'</tbody></table>';
    h+='<h2 style="margin-top:12px">Internal audit remediation</h2><table><thead><tr><th>Rating</th><th>Fix within (days)</th><th>Deduction %</th></tr></thead><tbody>'+['high','medium','low'].map(function(r){return '<tr><td>'+esc(r)+'</td><td><input class="inp" type="number" id="t-ad-'+r+'" value="'+esc(t.audit.days[r])+'"'+dis+'></td><td><input class="inp" type="number" step="0.05" id="t-ac-'+r+'" value="'+esc(t.audit.credit_pct[r])+'"'+dis+'></td></tr>';}).join('')+'</tbody></table>'
      +'<div class="row sm" style="margin-top:6px">Audit teams in scope: '+[['ia','IT Audit'],['csa','Cyber Security Audit'],['iad','Internal Audit']].map(function(a){return '<label><input type="checkbox" data-team="'+a[0]+'"'+(t.audit.teams.indexOf(a[0])>=0?' checked':'')+dis+'> '+esc(a[1])+'</label>';}).join(' ')+'</div>';
    h+='<h2 style="margin-top:12px">Availability &amp; report</h2><div class="form">'+f('t-avt','Availability target %',t.availability.target_pct,'number')+f('t-avc','Deduction % below it',t.availability.credit_pct,'number')+f('t-rpd','Report due day of month',t.report.due_day,'number')+f('t-rpc','Deduction % if late',t.report.credit_pct,'number')+'</div>';
    if(ed)h+='<button class="btn pri" type="button" id="t-save"><i class="ti ti-device-floppy"></i>Save terms</button> <span class="sm mute">The defaults are a starting point: agree every figure with Citynet Work before go-live. A new agreement version is drafted from the saved terms.</span>';
    if(V.audit_due.length)h+='<h2 style="margin-top:14px">Audit findings to fix</h2><table><tbody>'+V.audit_due.map(function(a){return '<tr><td>'+esc(a.team)+'</td><td>'+esc(a.rating)+'</td><td>'+esc(a.title)+'</td><td>due '+esc(a.due)+'</td></tr>';}).join('')+'</tbody></table>';
    return h+'</section>';}
  // ---------- actions
  function val(id){var e=$(id);return e?e.value.trim():'';}
  function num(id){var v=val(id);return v===''?undefined:Number(v);}
  function act(p,b,ok){return req('POST',p,b).then(function(r){toast(ok);return load().then(function(){return r;});}).catch(function(e){toast(e.message);});}
  document.addEventListener('click',function(ev){var el=ev.target.closest('[data-tab],[data-doc],[data-gen],[data-dact],[data-addsec],[data-case],[data-ca],[data-sd],button[id]');if(!el)return;
    if(el.dataset.tab){TAB=el.dataset.tab;draw();return;}
    if(el.dataset.doc){DOC=el.dataset.doc;draw();return;}
    if(el.dataset.gen){act('/sla/documents',{kind:el.dataset.gen},'Draft created from the terms');return;}
    if(el.dataset.addsec){var box=$('secs'),n=box.querySelectorAll('[data-sh]').length;box.insertAdjacentHTML('beforeend','<label class="sm mute" style="display:block;margin-top:8px">Section '+(n+1)+'<input class="inp" data-sh="'+n+'" value=""><textarea class="inp" data-st="'+n+'" style="min-height:80px;margin-top:4px"></textarea></label>');return;}
    if(el.dataset.dact){var a=el.dataset.dact.split(':'),b={};if(a[0]==='edit'){b.sections=Array.prototype.map.call(document.querySelectorAll('[data-sh]'),function(x){return {h:x.value.trim(),t:document.querySelector('[data-st="'+x.dataset.sh+'"]').value.trim()};}).filter(function(s){return s.h||s.t;});}
      if(a[0]==='discard'&&!confirm('Discard this draft?'))return;act('/sla/documents/'+encodeURIComponent(a[1])+'/'+a[0],b,{edit:'Saved',submit:'Sent to both signatories',approve:'Approved',discard:'Discarded'}[a[0]]);return;}
    if(el.dataset.case){SELC=el.dataset.case;$('view').innerHTML=casesView();return;}
    if(el.dataset.ca){var c={},nt=val('cnote');if(nt)c.note=nt;if(el.dataset.ca==='exclude')c.reason=val('exr');if(el.dataset.dec)c.decision=el.dataset.dec;
      req('POST','/sla/cases/'+encodeURIComponent(SELC)+'/'+el.dataset.ca,c).then(function(){toast('Done');return req('GET','/sla/cases');}).then(function(r){if(r){CASES=r.cases;$('view').innerHTML=casesView();}}).catch(function(e){toast(e.message);});return;}
    if(el.dataset.sd){var d={decision:el.dataset.sd};if(val('dnote'))d.note=val('dnote');req('POST','/sla/statements/'+MONTH+'/decide',d).then(function(s){STM=s;toast(el.dataset.sd==='accepted'?'Accepted':'Disputed');$('view').innerHTML=stmView();}).catch(function(e){toast(e.message);});return;}
    var id=el.id;
    if(id==='refresh'){load();return;}
    if(id==='print'){window.print();return;}
    if(id==='nc-go'){act('/sla/cases',{title:val('nc-title'),priority:val('nc-pri'),category:val('nc-cat'),description:val('nc-desc')},'Case opened').then(function(r){if(r){SELC=r.id;TAB='cases';draw();}});return;}
    if(id==='mon-go'){MONTH=val('mon')||MONTH;draw();return;}
    if(id==='issue'){req('POST','/sla/statements/'+MONTH+'/issue',{}).then(function(s){STM=s;toast('Statement issued');$('view').innerHTML=stmView();}).catch(function(e){toast(e.message);});return;}
    if(id==='m-go'||id==='m-conf'){var m=id==='m-conf'?{confirm:true}:{};if(id==='m-go'){if(num('m-av')!=null)m.availability_pct=num('m-av');if(val('m-rep'))m.report_delivered=val('m-rep');}req('POST','/sla/measures/'+MONTH,m).then(function(){toast(id==='m-conf'?'Confirmed':'Recorded - the other party confirms it');draw();}).catch(function(e){toast(e.message);});return;}
    if(id==='xls'&&STM){window.zybXlsx.download('sla-statement-'+STM.month+'.xlsx',[{name:'Statement '+STM.month,columns:[{h:'Target',w:60},{h:'Kind',w:12},{h:'Reference',w:22},{h:'Result',w:10},{h:'Deduction %',t:'n'},{h:'Basis',w:60}],rows:STM.lines.map(function(l){return [l.title,l.kind,l.ref,l.met===true?'met':l.met===false?'missed':'pending',l.deduction_pct,l.why];})},
      {name:'Summary',columns:[{h:'Item',w:34},{h:'Value',w:24}],rows:[['Month',STM.month],['State',STM.state],['Targets measured',STM.summary.targets],['Met',STM.summary.met],['Missed',STM.summary.missed],['Deduction before cap %',STM.summary.deduction_raw_pct],['Cap %',STM.summary.cap_pct],['Deduction %',STM.summary.deduction_pct],['Monthly fee SAR',STM.summary.monthly_fee_sar==null?'not entered':STM.summary.monthly_fee_sar],['Deduction SAR',STM.summary.deduction_sar==null?'—':STM.summary.deduction_sar]]}],{title:'SLA statement '+STM.month+(' - ' + ZYB_ORG.short + ' / Citynet Work'),filter:'month '+STM.month,by:USER});return;}
    if(id==='t-save'){var T={parties:{},members:{},commercial:{monthly_fee_sar:val('t-fee')===''?null:num('t-fee'),cap_pct:num('t-cap'),term_months:num('t-term')},hours:{start:val('t-hs'),end:val('t-he')},priorities:{},audit:{days:{},credit_pct:{},teams:Array.prototype.filter.call(document.querySelectorAll('[data-team]'),function(x){return x.checked;}).map(function(x){return x.dataset.team;})},availability:{target_pct:num('t-avt'),credit_pct:num('t-avc')},report:{due_day:num('t-rpd'),credit_pct:num('t-rpc')}};
      if(val('t-start'))T.commercial.start=val('t-start');
      ['customer','provider'].forEach(function(p){T.parties[p]={legal_name:val('t-'+p+'-name'),cr:val('t-'+p+'-cr'),address:val('t-'+p+'-addr'),signatory:{name:val('t-'+p+'-sn'),title:val('t-'+p+'-st')}};if(val('t-'+p+'-su'))T.parties[p].signatory.user=val('t-'+p+'-su');});T.parties.partner={legal_name:val('t-partner-name')};
      if($('t-mc')){T.members.customer=val('t-mc').split(/\s*\n\s*/).filter(Boolean);T.members.provider=val('t-mp').split(/\s*\n\s*/).filter(Boolean);}
      ['P1','P2','P3','P4'].forEach(function(p){T.priorities[p]={name:val('t-'+p+'-n'),cover:val('t-'+p+'-c'),response_min:num('t-'+p+'-r'),resolve_h:num('t-'+p+'-z'),credit_pct:num('t-'+p+'-k')};});
      ['high','medium','low'].forEach(function(r){T.audit.days[r]=num('t-ad-'+r);T.audit.credit_pct[r]=num('t-ac-'+r);});
      act('/sla/terms',{terms:T,baseVersion:V.terms.version},'Terms saved');return;}
  });
  req('GET','/dashboards/whoami.json').then(function(w){ROLE=(w&&w.role)||'viewer';USER=(w&&w.user)||'';}).catch(function(){ROLE='viewer';/* no identity: read-only */}).then(load);
})();
</script></body></html>
