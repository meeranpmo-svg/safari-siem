<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Audit Inspections</title><script src="vendor/zyb-org.js"></script><script src="vendor/zyb-dash.js"></script><link rel="stylesheet" href="vendor/tabler/tabler-icons.min.css">

<style>
:root{--bg:#0b0e14;--pn:#121722;--rs:#18202d;--ln:#232c3c;--tx:#e8ecf3;--mu:#8c95a8;--ok:#2fb344;--wa:#f59f00;--ba:#e5484d;--ac:#3b82f6;--ml:#a371f7}
[hidden]{display:none!important}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
main{max-width:1500px;margin:0 auto;padding:16px 16px 80px}
.top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}.top h1{margin:0;font-size:26px}.sp{flex:1}.mu{color:var(--mu)}.sm{font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--ln);padding-bottom:8px;margin-bottom:14px}
.tab{background:none;border:0;color:var(--mu);font:600 14px Inter,"Segoe UI",system-ui,sans-serif;padding:8px 14px;border-radius:8px;cursor:pointer}.tab[aria-selected="true"]{background:var(--ac);color:#fff}
.btn{font:600 13px Inter,"Segoe UI",system-ui,sans-serif;background:var(--rs);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}.btn:hover{border-color:#3a4560}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.ai{background:linear-gradient(135deg,#7c4dff,#3b82f6);border:0;color:#fff}.btn.no{color:#ff9a9e}.btn:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.k{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px 14px}.k .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.k .l{font-size:12px;color:var(--mu)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin-bottom:14px;min-width:0}.card h2{margin:0 0 10px;font-size:16px;display:flex;gap:8px;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mu);font-weight:600;font-size:12px;padding:7px;border-bottom:1px solid var(--ln)}td{padding:8px 7px;border-bottom:1px solid #1a2130;vertical-align:top}
.bar{height:7px;border-radius:5px;background:#232c3c;overflow:hidden;min-width:80px}.bar i{display:block;height:100%}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}.p-pass,.p-low,.p-verified,.p-closed{background:rgba(47,179,68,.15);color:#56d364}.p-fail,.p-high,.p-critical{background:rgba(229,72,77,.16);color:#ff7b80}.p-medium,.p-major,.p-actions_open,.p-exception_requested{background:rgba(245,159,0,.16);color:#ffc14d}.p-in_progress,.p-submitted,.p-open,.p-fixed,.p-accepted,.p-reopened{background:rgba(59,130,246,.16);color:#8ab4ff}
.inp{background:#0b0e14;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;font:13px Inter,"Segoe UI",system-ui,sans-serif;min-width:0}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
.sec{margin:14px 0 6px;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center}
.it{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--rs)}.it.fail{border-color:rgba(229,72,77,.6)}.it.done{border-color:rgba(47,179,68,.35)}
.it .q{font-weight:600}.it .ar{direction:rtl;color:var(--mu);font-size:13px}.ans{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ch{border:1px solid var(--ln);background:#0b0e14;color:var(--tx);border-radius:8px;padding:7px 14px;font:600 13px Inter,sans-serif;cursor:pointer;min-width:52px}.ch[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}.ch.y[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}.ch.n[aria-pressed="true"]{background:var(--ba);border-color:var(--ba)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
.score{position:sticky;top:0;z-index:5;background:rgba(11,14,20,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pad{border:1px dashed #3a4560;border-radius:10px;background:#fff;touch-action:none;width:100%;max-width:420px;height:150px;display:block}
.note{font-size:12px;color:var(--mu);border-left:3px solid var(--ac);padding:6px 10px;background:rgba(59,130,246,.06);border-radius:0 8px 8px 0;margin:8px 0}
.err{background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.4);border-radius:12px;padding:12px;margin-bottom:12px}
.empty{color:var(--mu);padding:24px;text-align:center;border:1px dashed var(--ln);border-radius:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2430;border:1px solid #2e3747;border-radius:10px;padding:10px 16px;z-index:9999;max-width:92vw}
.tb td{padding:4px}.tb .inp{width:100%}
@media (max-width:900px){.g2{grid-template-columns:1fr}}
</style></head><body><main>
<div class="top"><div><h1><i class="ti ti-clipboard-check" style="color:#3b82f6"></i> IT Audit Inspections</h1><div class="mu sm">On-site, scored checklists with photo evidence and signatures; corrective actions verified by a second person; exceptions; schedules; trends across sites. Built for an insurer: SAMA CSF, Insurance Authority, NCA ECC and PDPL references.</div></div><span class="sp"></span><span class="sm mu" id="net"></span><button type="button" class="btn" id="refresh" aria-label="Refresh"><i class="ti ti-refresh"></i></button></div>
<div id="err"></div>
<div class="kpis" id="kpis"></div>
<div class="tabs" role="tablist" id="tabs"><button type="button" class="tab" data-t="dash" aria-selected="true">Dashboard</button><button type="button" class="tab" data-t="ins" data-w>Inspections</button><button type="button" class="tab" data-t="act" data-w>Corrective actions</button><button type="button" class="tab" data-t="sch" data-w>Schedules</button><button type="button" class="tab" data-t="tpl" data-w>Templates</button></div>
<section id="v-dash"></section>
<section id="v-ins" hidden></section>
<section id="v-run" hidden></section>
<section id="v-act" hidden></section>
<section id="v-sch" hidden></section>
<section id="v-tpl" hidden></section>
<script>
(function(){
  'use strict';
  var esc=window.zybDetail.esc,$=function(id){return document.getElementById(id);};
  var RANK={viewer:0,analyst:1,operator:2,admin:3},ROLE='viewer',ME='',V=null,CUR=null,TAB='dash',SAVE_T=null,PADS={};
  function toast(t){var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},4500);}
  function req(m,u,b){return new Promise(function(ok,bad){var x=new XMLHttpRequest();x.open(m,'/api/itam'+u);x.withCredentials=true;x.timeout=150000;x.zybQuiet=true;if(b)x.setRequestHeader('Content-Type','application/json');
    x.onload=function(){var j=null;try{j=JSON.parse(x.responseText);}catch(e){j=null;/* not JSON: reported by status */}if(x.status>=200&&x.status<300&&j)return ok(j);bad(Object.assign(new Error((j&&j.error)||('HTTP '+x.status)),{status:x.status}));};
    x.onerror=x.ontimeout=function(){bad(Object.assign(new Error('not reachable'),{offline:true}));};x.send(b?JSON.stringify(b):null);});}
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;/* storage blocked */}}
  function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){/* storage blocked: offline queue unavailable */}}
  function pill(s){return '<span class="pill p-'+esc(s)+'">'+esc(String(s).replace(/_/g,' '))+'</span>';}
  function scoreBar(v,pm){var c=v==null?'#3a4560':v>=(pm||80)?'#2fb344':v>=(pm||80)*0.75?'#f59f00':'#e5484d';return '<div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><i style="width:'+(v||0)+'%;background:'+c+'"></i></div><b>'+(v==null?'—':esc(String(v))+'%')+'</b></div>';}
  function show(t){TAB=t;['dash','ins','run','act','sch','tpl'].forEach(function(x){$('v-'+x).hidden=x!==t;});[].forEach.call(document.querySelectorAll('.tab'),function(b){b.setAttribute('aria-selected',String(b.getAttribute('data-t')===t||(t==='run'&&b.getAttribute('data-t')==='ins')));});}
  /* ---- dashboard */
  function dash(){var v=V,k=v.kpis;
    $('kpis').innerHTML=[[k.inspections_90d,'inspections (90 days)'],[k.average_90d==null?'—':k.average_90d+'%','average score'],[k.pass_rate_90d==null?'—':k.pass_rate_90d+'%','pass rate'],[k.open_actions,'open actions'],[k.overdue_actions,'overdue actions'],[k.high_risk_actions,'high-risk actions'],[k.exceptions_active+' / '+k.exceptions_waiting,'risk accepted / waiting'],[k.repeat_failures,'repeat failures'],[k.overdue_schedules,'overdue schedules']].map(function(x){return '<div class="k"><div class="v">'+esc(String(x[0]))+'</div><div class="l">'+esc(x[1])+'</div></div>';}).join('');
    var mx=Math.max.apply(null,[100].concat(v.by_month.map(function(m){return m.average;})));
    $('v-dash').innerHTML='<div class="card"><h2><i class="ti ti-building"></i>Sites</h2>'+(v.sites.length?'<div class="tw"><table><thead><tr><th>Site</th><th style="width:28%">Last score</th><th>Result</th><th>Average</th><th>Inspections</th><th>Trend / forecast</th><th>Open actions</th></tr></thead><tbody>'+v.sites.map(function(s){return '<tr><td><b>'+esc(s.site)+'</b>'+(s.at_risk?' <span class="pill p-fail">at risk</span>':'')+'</td><td>'+scoreBar(s.last_score)+'</td><td>'+pill(s.last_result)+'</td><td>'+esc(String(s.average))+'%</td><td>'+s.inspections+'</td><td>'+(s.trend_per_inspection==null?'<span class="sm mu">'+esc(s.note)+'</span>':'<i class="ti ti-trending-'+(s.trend_per_inspection>=0?'up" style="color:#2fb344':'down" style="color:#e5484d')+'"></i> '+esc((s.trend_per_inspection>0?'+':'')+s.trend_per_inspection)+' / inspection · next ~'+esc(String(s.forecast_next))+'%')+'</td><td>'+s.open_actions+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">No inspection submitted yet. Start one under Inspections - starter templates for data centres, branches, backups, endpoints, network closets and insurer controls (claims access, third parties, customer data) are ready.</div>')+'</div>'
      +'<div class="g2"><div class="card"><h2><i class="ti ti-chart-bar"></i>Average score by month</h2>'+(v.by_month.length?'<svg viewBox="0 0 '+Math.max(240,v.by_month.length*60)+' 150" width="100%" role="img" aria-label="average score by month">'+v.by_month.map(function(m,i){var h=Math.round(110*m.average/mx);return '<rect x="'+(i*60+14)+'" y="'+(125-h)+'" width="36" height="'+h+'" rx="4" fill="#3b82f6"><title>'+esc(m.month+': '+m.average+'% over '+m.inspections)+'</title></rect><text x="'+(i*60+32)+'" y="'+(120-h)+'" fill="#e8ecf3" font-size="11" text-anchor="middle">'+esc(String(Math.round(m.average)))+'</text><text x="'+(i*60+32)+'" y="142" fill="#8c95a8" font-size="10" text-anchor="middle">'+esc(m.month)+'</text>';}).join('')+'</svg>':'<div class="mu sm">Appears with the first submitted inspection.</div>')+'</div>'
      +'<div class="card"><h2><i class="ti ti-repeat"></i>Repeat failures &amp; most failed items</h2>'+(v.repeats.length?v.repeats.map(function(r){return '<div class="sm" style="padding:4px 0;border-bottom:1px solid #1a2130"><span class="pill p-fail">repeat</span> <b>'+esc(r.site)+'</b> · '+esc(r.text)+' <span class="mu">('+esc(r.template)+')</span></div>';}).join(''):'<div class="sm mu">No item failed twice in a row at the same site.</div>')
      +(v.top_failures.length?'<div class="sm mu" style="margin-top:10px">Most failed</div>'+v.top_failures.map(function(f){return '<div class="sm" style="padding:3px 0">'+esc(f.text)+' <span class="mu">· '+f.count+' time(s) at '+f.sites+' site(s)</span></div>';}).join(''):'')+'</div></div>';}
  /* ---- inspections list + start */
  function insList(){var v=V;if(!v.can_work){$('v-ins').innerHTML='<div class="empty">Inspections name people and site weaknesses - shown to operators and administrators.</div>';return;}
    var tp=(v.templates||[]).filter(function(t){return t.status==='active';});
    $('v-ins').innerHTML='<div class="card"><h2><i class="ti ti-player-play"></i>Start an inspection</h2><div class="frm"><label class="f">Checklist<select class="inp" id="n-tpl">'+tp.map(function(t){return '<option value="'+esc(t.id)+'">'+esc(t.name+' (v'+t.version+', '+t.items+' items)')+'</option>';}).join('')+'</select></label><label class="f">Site<input class="inp" id="n-site" list="n-sites" maxlength="80" placeholder="e.g. HQ data centre"><datalist id="n-sites">'+v.site_options.map(function(s){return '<option value="'+esc(s)+'">';}).join('')+'</datalist></label></div><div style="margin-top:10px"><button type="button" class="btn pri" id="n-go"><i class="ti ti-player-play"></i>Start</button></div></div>'
      +'<div class="card"><h2><i class="ti ti-list-check"></i>Inspections</h2>'+((v.inspections||[]).length?'<div class="tw"><table><thead><tr><th>Checklist</th><th>Site</th><th>Inspector</th><th>State</th><th>Score</th><th>Actions</th><th>Date</th><th></th></tr></thead><tbody>'+v.inspections.map(function(x){return '<tr><td>'+esc(x.template)+'</td><td>'+esc(x.site)+'</td><td>'+esc(x.inspector)+'</td><td>'+pill(x.state)+(x.reviewed_by?' <span class="sm mu">reviewed</span>':'')+'</td><td>'+(x.score==null?'—':esc(x.score+'%')+' '+pill(x.result)+(x.critical_failed?' <span class="pill p-critical">critical</span>':''))+'</td><td>'+x.open_actions+'</td><td class="sm">'+esc(String(x.submitted_at||x.started_at).slice(0,10))+'</td><td><button type="button" class="btn" data-open="'+esc(x.id)+'">Open</button></td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">No inspection yet.</div>')+'</div>';}
  /* ---- the runner / detail */
  function q(id){return lsGet('insp-q-'+id)||{};}
  function openIns(id){show('run');$('v-run').innerHTML='<div class="mu">Loading…</div>';req('GET','/inspect/inspections/'+encodeURIComponent(id)).then(function(x){CUR=x;
    var pend=q(id);Object.keys(pend).forEach(function(k){CUR.answers[k]=Object.assign({},CUR.answers[k]||{},pend[k]);});drawRun();},function(e){$('v-run').innerHTML='<div class="err">'+esc(e.message)+'</div>';});}
  function liveScore(){var x=CUR,w=0,g=0,fail=0,crit=false,todo=0;x.snapshot.forEach(function(s){s.items.forEach(function(it){var a=x.answers[it.id]||{};if(a.na)return;var v=a.value;
    if(v==null||v===''){todo++;return;}if(it.type==='text')return;var sc=it.type==='yesno'?(v==='yes'?1:0):it.type==='rating'?(Number(v)-1)/4:((it.min==null||Number(v)>=it.min)&&(it.max==null||Number(v)<=it.max)?1:0);var f=it.type==='yesno'?v==='no':it.type==='rating'?Number(v)<=2:sc===0;
    w+=it.weight;g+=it.weight*sc;if(f){fail++;if(it.critical)crit=true;}});});var p=w?Math.round(1000*g/w)/10:null;return {p:p,fail:fail,crit:crit,todo:todo,res:p==null?null:(crit||p<x.pass_mark?'fail':'pass')};}
  function itemFailed(it,a){if(!a||a.na||a.value==null||a.value==='')return false;if(it.type==='yesno')return a.value==='no';if(it.type==='rating')return Number(a.value)<=2;if(it.type==='number')return !((it.min==null||Number(a.value)>=it.min)&&(it.max==null||Number(a.value)<=it.max));return false;}
  function itemHtml(it,a,edit){a=a||{};var v=a.value,f=itemFailed(it,a),done=a.na||(v!=null&&v!=='');
    var ctl='';if(edit){if(it.type==='yesno')ctl=['yes','no'].map(function(o){return '<button type="button" class="ch '+(o==='yes'?'y':'n')+'" data-ans="'+esc(it.id)+'" data-v="'+o+'" aria-pressed="'+(!a.na&&v===o)+'">'+(o==='yes'?'Yes':'No')+'</button>';}).join('');
      else if(it.type==='rating')ctl=[1,2,3,4,5].map(function(o){return '<button type="button" class="ch" data-ans="'+esc(it.id)+'" data-v="'+o+'" aria-pressed="'+(!a.na&&Number(v)===o)+'">'+o+'</button>';}).join('');
      else if(it.type==='number')ctl='<input class="inp" type="number" step="any" data-num="'+esc(it.id)+'" value="'+(v==null?'':esc(String(v)))+'" aria-label="'+esc(it.text)+'" style="width:120px"><span class="sm mu">range '+(it.min==null?'…':esc(String(it.min)))+' – '+(it.max==null?'…':esc(String(it.max)))+'</span>';
      else ctl='<input class="inp" data-txt="'+esc(it.id)+'" value="'+(v==null?'':esc(String(v)))+'" maxlength="1000" aria-label="'+esc(it.text)+'" style="flex:1;min-width:200px">';
      ctl+='<button type="button" class="ch" data-ans="'+esc(it.id)+'" data-na aria-pressed="'+(!!a.na)+'">N/A</button><label class="btn" style="margin-left:auto"><i class="ti ti-camera"></i>Photo<input type="file" accept="image/*" capture="environment" data-photo="'+esc(it.id)+'" hidden></label>';}
    else ctl='<b>'+esc(a.na?'n/a':v==null?'—':String(v))+'</b>'+(f?' '+pill('fail'):'');
    var ev=(a.evidence||[]).map(function(sh){return '<img src="/api/itam/inspect/evidence/'+esc(sh)+'" alt="evidence photo" loading="lazy">';}).join('');
    var need=it.evidence==='required'?'photo required':it.evidence==='on_fail'?'photo if it fails':'';
    return '<div class="it'+(f?' fail':done?' done':'')+'"><div class="q">'+esc(it.text)+(it.critical?' <span class="pill p-critical">critical</span>':'')+(it.ref?' <span class="sm mu">'+esc(it.ref)+'</span>':'')+(need?' <span class="sm mu">· '+need+'</span>':'')+'</div>'+(it.text_ar?'<div class="ar" lang="ar">'+esc(it.text_ar)+'</div>':'')+(it.guidance?'<div class="sm mu">'+esc(it.guidance)+'</div>':'')
      +'<div class="ans">'+ctl+'</div>'+(edit?'<input class="inp" data-note="'+esc(it.id)+'" value="'+esc(a.note||'')+'" maxlength="1000" placeholder="Note (what you saw)" style="width:100%;margin-top:6px" aria-label="Note">':(a.note?'<div class="sm mu">'+esc(a.note)+'</div>':''))+(ev?'<div class="thumbs">'+ev+'</div>':'')+'</div>';}
  function headHtml(){var x=CUR,edit=x.state==='in_progress'&&x.inspector===ME,ls=liveScore(),pend=Object.keys(q(x.id)).length;
    return '<div class="score"><button type="button" class="btn" id="back"><i class="ti ti-arrow-left"></i></button><div><b>'+esc(x.template)+'</b> <span class="mu">v'+esc(String(x.template_version))+'</span><div class="sm mu">'+esc(x.site+' · '+x.inspector)+(x.location?' · located':'')+'</div></div><span class="sp"></span>'+pill(x.state)
      +(edit?'<div style="min-width:200px">'+scoreBar(ls.p,x.pass_mark)+'<div class="sm mu">'+ls.todo+' to answer · '+ls.fail+' failing'+(ls.crit?' · critical failed':'')+'</div></div>':'<div style="min-width:200px">'+scoreBar(x.score,x.pass_mark)+'</div>'+(x.result?pill(x.result):''))
      +(pend?'<span class="pill p-major">'+pend+' unsynced</span>':'')+'<button type="button" class="btn" id="rep"><i class="ti ti-file-text"></i>Report</button></div>';}
  function drawRun(){var x=CUR,edit=x.state==='in_progress'&&x.inspector===ME;
    var head=headHtml(),body=x.snapshot.map(function(s){return '<div class="sec">'+esc(s.title)+(s.title_ar?' <span class="mu" lang="ar" style="font-weight:400">· '+esc(s.title_ar)+'</span>':'')+'</div>'+s.items.map(function(it){return itemHtml(it,x.answers[it.id],edit);}).join('');}).join('');
    var tail='';
    if(edit){tail='<div class="card"><h2><i class="ti ti-signature"></i>Sign-off</h2><div class="note">Submitting needs every applicable item answered, the photos each item requires, your signature and the site representative\'s.</div><div class="g2"><div><div class="sm mu">Inspector ('+esc(ME)+')</div><canvas class="pad" id="pad-i" width="420" height="150" aria-label="inspector signature"></canvas><button type="button" class="btn" data-clear="pad-i">Clear</button></div>'
      +'<div><div class="frm"><label class="f">Site representative<input class="inp" id="a-name" maxlength="120"></label><label class="f">Role<input class="inp" id="a-role" maxlength="120"></label></div><canvas class="pad" id="pad-a" width="420" height="150" aria-label="site representative signature"></canvas><button type="button" class="btn" data-clear="pad-a">Clear</button></div></div>'

    if(g('data-run-sch')){start(g('data-tpl'),g('data-site'),g('data-run-sch'));return;}
    if(g('data-del-sch')){req('POST','/inspect/schedules/'+encodeURIComponent(g('data-del-sch'))+'/delete').then(function(){toast('Schedule removed');load();},function(e){toast(e.message);});return;}
    if(b.id==='b-new'){EDIT=null;builder(null);$('b-mode').textContent='new';return;}
    if(g('data-edit-tpl')){req('GET','/inspect/templates/'+encodeURIComponent(g('data-edit-tpl'))).then(function(t){EDIT=t.id;builder(t);$('b-mode').textContent='editing makes version '+(t.version+1);},function(e){toast(e.message);});return;}
    if(g('data-arch-tpl')){req('POST','/inspect/templates/'+encodeURIComponent(g('data-arch-tpl'))+'/archive').then(function(){toast('Archived');load();},function(e){toast(e.message);});return;}
    if(b.id==='b-addsec'){$('b-secs').insertAdjacentHTML('beforeend',secHtml(null));return;}
    if(b.hasAttribute('data-add-item')){b.closest('[data-sec]').querySelector('tbody').insertAdjacentHTML('beforeend',rowItem(null));return;}
    if(b.hasAttribute('data-rm-item')){b.closest('tr').remove();return;}if(b.hasAttribute('data-rm-sec')){b.closest('[data-sec]').remove();return;}
    if(b.id==='b-save'){var t=collect();(EDIT?req('PUT','/inspect/templates/'+encodeURIComponent(EDIT),t):req('POST','/inspect/templates',t)).then(function(){toast('Checklist saved');$('builder').hidden=true;load();},function(e){$('b-msg').textContent=e.message;});return;}
    if(b.id==='ai-go'){var rq=$('ai-req').value.trim();if(rq.length<10){$('ai-msg').textContent='Describe the scope in a sentence or two.';return;}b.disabled=true;$('ai-msg').textContent='The AI is drafting…';
      req('POST','/inspect/templates/ai-draft',{request:rq,arabic:$('ai-ar').checked}).then(function(r){EDIT=null;builder(r.draft);$('b-mode').textContent='AI draft ('+r.model+') - review every item, then save';$('ai-msg').textContent='Draft loaded into the builder below. Nothing is saved until you press Save.'+(r.injection_signals.length?' The request contained instruction-like text.':'');},function(e){$('ai-msg').textContent=e.message;}).then(function(){b.disabled=false;});return;}
  });
  document.addEventListener('change',function(ev){var t=ev.target;
    if(t.hasAttribute&&t.hasAttribute('data-num'))saveAns(t.getAttribute('data-num'),{na:false,value:t.value===''?null:Number(t.value)});
    if(t.hasAttribute&&t.hasAttribute('data-txt'))saveAns(t.getAttribute('data-txt'),{na:false,value:t.value});
    if(t.hasAttribute&&t.hasAttribute('data-note'))saveAns(t.getAttribute('data-note'),{note:t.value});
    if(t.hasAttribute&&t.hasAttribute('data-photo')&&t.files&&t.files[0]){var it=t.getAttribute('data-photo'),file=t.files[0];toast('Uploading photo…');
      Promise.all([shrink(file),where()]).then(function(r){var body={item:it,image:r[0],taken_at:new Date(file.lastModified||Date.now()).toISOString()};if(r[1]){body.lat=r[1].lat;body.lon=r[1].lon;}return req('POST','/inspect/inspections/'+encodeURIComponent(CUR.id)+'/evidence',body);})
        .then(function(r){CUR=r.inspection;drawRun();toast('Photo added (SHA-256 '+r.sha256.slice(0,10)+'…)');},function(e){toast(e.offline?'Offline - take the photo again when the connection is back':e.message);});}
  });
  var w=new XMLHttpRequest();w.open('GET','/dashboards/whoami.json');w.onload=function(){try{var j=JSON.parse(w.responseText),r=String(j.role||'').toLowerCase();if(RANK[r]!=null)ROLE=r;ME=String(j.user||'');}catch(e){/* not signed in: viewer */}load();};w.onerror=function(){load();};w.send();
})();
</script></body></html>
