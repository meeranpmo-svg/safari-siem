</style></head><body><main>
<div class="top"><div><div class="eb">Microsoft 365 &amp; Users</div><h1>Microsoft 365, Users &amp; Endpoints</h1><div class="sm mute">Identities, licences, the managed device estate and everything with an expiry date - from the tenant itself, with what to do first.</div></div><div class="sp"></div>
 <span class="sm mute" id="up"></span><a class="btn" href="m365.html"><i class="ti ti-settings"></i>Tenant &amp; sync</a><button class="btn" id="refresh" type="button"><i class="ti ti-refresh"></i>Refresh</button></div>

</div>
</main>
<script>
(function(){

  function req(m,u,b){return new Promise(function(ok,bad){var x=new XMLHttpRequest();x.open(m,u);x.withCredentials=true;x.timeout=180000;x.zybQuiet=true;if(b)x.setRequestHeader('Content-Type','application/json');
    x.onload=function(){var j=null;try{j=JSON.parse(x.responseText);}catch(e){j=null;/* not JSON: shown as the HTTP status */}if(x.status>=200&&x.status<300&&j)return ok(j);bad(Object.assign(new Error((j&&(j.error||(j.errors&&j.errors.join('; '))))||('HTTP '+x.status)),{status:x.status}));};

  function spark(key,label,col){var T=(A.trend||[]).filter(function(t){return t[key]!=null;});if(T.length<2)return '<div class="sm mute">'+esc(label)+': the trend starts after a few days of history ('+T.length+' so far)</div>';
    var vs=T.map(function(t){return t[key];}),mx=Math.max.apply(null,vs),mn=Math.min.apply(null,vs),w=260,h=44,pts=T.map(function(t,i){return (i/(T.length-1)*w).toFixed(1)+','+(h-((t[key]-mn)/((mx-mn)||1))*(h-6)-3).toFixed(1);}).join(' ');
    return '<div class="sm" style="margin:6px 0"><b>'+esc(label)+'</b> <span class="mute">'+esc(vs[0]+' → '+vs[vs.length-1]+' over '+T.length+' days')+'</span><br><svg width="'+w+'" height="'+h+'" role="img" aria-label="'+esc(label)+' trend"><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2"/></svg></div>';}
  function load(){$('err').hidden=true;return req('GET','/api/soc/m365/insights').then(function(a){A=a;$('main').hidden=false;draw();}).catch(function(e){$('main').hidden=true;$('err').hidden=false;$('err').innerHTML='<h2><i class="ti ti-alert-triangle"></i>Microsoft 365 insights are not available</h2>'+note(e.status===404?'Not installed in the SIEM - run the update (update-platform.ps1).':e.message);});}
  function draw(){
    if(!A.configured){$('kpis').innerHTML='';$('tabs').innerHTML='';$('warn').innerHTML='';$('view').innerHTML='<section class="card">'+note('Microsoft 365 is not connected yet ('+(A.reason||'no tenant')+'). Enter the tenant, application ID and secret under Tenant & sync; the figures here come from the tenant, never from samples.')+'</section>';return;}
    var k=A.kpis,sy=A.sync||{};$('up').textContent='Tenant read '+(A.updated?new Date(A.updated).toLocaleString():'—')+(sy.stale?' · STALE':'')+(sy.last_error?' · last sync failed: '+sy.last_error:'');

    function kp(v,l,s,tab,c){return '<button type="button" class="kpi" data-tab="'+tab+'"><div class="n" style="color:'+(c||'inherit')+'">'+esc(v)+'</div><div class="l">'+esc(l)+'</div><div class="s">'+esc(s||'')+'</div></button>';}
    $('kpis').innerHTML=kp(n(k.members),'active accounts',n(k.guests)+' guests · '+n(k.disabled)+' disabled','identities')+kp(n(k.mfa_pct,'%'),'MFA coverage',n(k.mfa_missing)+' without · '+n(k.admins_no_mfa)+' admins','identities',k.admins_no_mfa?'#ff7b80':'')

      +kp(n(k.reclaimable),'seats to reclaim',n(k.seats_used)+' of '+n(k.seats)+' used','licences',k.reclaimable?'#8db0ff':'')+kp(k.next_renewal?k.next_renewal.days+' d':'—','next renewal',k.next_renewal?k.next_renewal.sku:'','licences',k.next_renewal&&k.next_renewal.days<=30?'#f5b544':'');
    var T=[['overview','layout-dashboard','Overview'],['licences','certificate','Licences'],['identities','users','Identities'],['devices','devices','Devices'],['signins','login','Sign-ins'],['apps','key','Apps & secrets']];if(RANK[ROLE]>=1)T.push(['ai','robot','AI analyst']);T.splice(5,0,['guests','user-question','Guests']);
    $('tabs').innerHTML=T.map(function(t){return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(TAB===t[0])+'"><i class="ti ti-'+t[1]+'"></i>'+esc(t[2])+'</button>';}).join('');
    $('view').innerHTML=TAB==='overview'?overview()+mlRow():TAB==='licences'?licences():TAB==='identities'?identities():TAB==='devices'?devices():TAB==='signins'?signins()+patterns():TAB==='guests'?guests():TAB==='apps'?apps():aiView();}
  /* ---- added analysis, all from what the engine already returned: identity-risk drivers (points summed per reason across the
     tenant), when MFA and compliance reach target at the current pace (least squares over the daily trend, withheld below 5
     days), sign-in patterns (impossible travel, spraying addresses, hour-of-week in Riyadh time, failures per app), guests. */
  function lsq(key){var T=(A.trend||[]).filter(function(t){return t[key]!=null;});if(T.length<5)return null;var n=T.length,mx=(n-1)/2,my=T.reduce(function(a,t){return a+t[key];},0)/n,nu=0,de=0;T.forEach(function(t,i){nu+=(i-mx)*(t[key]-my);de+=(i-mx)*(i-mx);});return {slope:de?nu/de:0,last:T[n-1][key],n:n};}
  function reach(key,label,target){var f=lsq(key);if(!f)return '<div class="sm mute">'+esc(label)+': forecast after 5 days of history ('+((A.trend||[]).filter(function(t){return t[key]!=null;}).length)+' so far)</div>';
    if(f.last>=target)return '<div class="sm"><b>'+esc(label)+'</b> at '+esc(f.last+'%')+' - target '+target+'% met</div>';
    if(f.slope<=0.01)return '<div class="sm"><b>'+esc(label)+'</b> '+esc(f.last+'%')+' <span class="pill v-medium">not moving towards '+target+'%</span><div class="mute">'+esc((Math.round(f.slope*100)/100)+' points a day over '+f.n+' days - it needs an action, not time')+'</div></div>';
    var d=Math.ceil((target-f.last)/f.slope);return '<div class="sm"><b>'+esc(label)+'</b> '+esc(f.last+'% → '+target+'% in about '+d+' days')+'<div class="mute">'+esc('+'+(Math.round(f.slope*100)/100)+' points a day over '+f.n+' days')+'</div></div>';}
  function mlRow(){var I=A.identities,drv='';
    if(I&&I.hidden)drv=note(I.count+' people carry identity risk ('+I.high+' high) - the reasons are shown to analysts and above.');
    else if(I&&I.length){var by={},lv={high:0,medium:0,low:0};I.forEach(function(x){lv[x.level]=(lv[x.level]||0)+1;(x.why||[]).forEach(function(w){var raw=String(w.t||w.text||w),pm=/\(\+(\d+)\)\s*$/.exec(raw),t=raw.replace(/\s*\(\+\d+\)\s*$/,'').replace(/^\d+ /,'').replace(/ [\w.-]+ non-compliant$/,' non-compliant').replace(/ from .*$/,' from a new country').replace(/ \w+ to \w+ in \d+ min$/,'').replace(/[A-Z][a-z]+ ID risk \w+/,'Entra ID risk'),pts=pm?+pm[1]:0;var k=t.slice(0,60);by[k]=by[k]||{n:0,p:0};by[k].n++;by[k].p+=pts;});});
      var ks=Object.keys(by).sort(function(a,b){return (by[b].p||by[b].n)-(by[a].p||by[a].n);}).slice(0,6),mx=Math.max.apply(null,ks.map(function(k){return by[k].p||by[k].n;}).concat([1]));
      drv='<div class="sm" style="margin-bottom:6px">'+esc(lv.high+' high · '+lv.medium+' medium · '+lv.low+' low')+'</div>'+ks.map(function(k){var v=by[k].p||by[k].n;return '<div class="bar"><span style="min-width:190px">'+esc(k)+'</span><span class="b"><i style="width:'+(v/mx*100).toFixed(1)+'%;background:#e5484d"></i></span><span>'+esc(by[k].n+' people')+'</span></div>';}).join('')+'<div class="sm mute" style="margin-top:6px">Fix the top driver first: one control (for example MFA through conditional access) clears it for everyone at once.</div>';}
    else drv=note('No identity carries a risk point.');
    return '<div class="cols" style="margin-top:12px"><section class="card"><h2><i class="ti ti-chart-bar"></i>What drives identity risk <span class="c">points summed across the tenant</span></h2>'+drv+'</section>'
      +'<section class="card"><h2><i class="ti ti-target-arrow"></i>When we reach target <span class="c">least squares over the daily trend</span></h2>'+reach('mfa_pct','MFA coverage',100)+'<div style="height:8px"></div>'+reach('compliance_pct','Device compliance',95)+'<div style="height:8px"></div>'+reach('secure_pct','Secure Score',80)+'</section></div>';}
  function patterns(){var P=A.signin_patterns;if(!P)return '';var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],mx=1;(P.heat||[]).forEach(function(r){r.forEach(function(v){if(v>mx)mx=v;});});
    var heat='<div style="display:grid;grid-template-columns:36px repeat(24,1fr);gap:2px;font-size:10px;align-items:center">'+(P.heat||[]).map(function(r,d){return '<span class="mute">'+DOW[d]+'</span>'+r.map(function(v,h){var off=d===5||d===6||h<7||h>=18,a=v/mx;return '<i title="'+esc(DOW[d]+' '+h+':00 - '+v+' sign-in(s)'+(off?' · outside working hours':''))+'" style="display:block;height:14px;border-radius:2px;background:'+(v?(off?'rgba(245,181,68,'+(0.25+a*0.75).toFixed(2)+')':'rgba(91,141,239,'+(0.2+a*0.8).toFixed(2)+')'):'#1b2030')+'"></i>';}).join('');}).join('')+'<span></span>'+Array.from({length:24},function(_,h){return '<span class="mute" style="text-align:center">'+(h%3?'':h)+'</span>';}).join('')+'</div>';
    var who=function(x){return x.user||x.upn||'an account';};
    var tr=(P.impossible_travel||[]),sp=(P.spray||[]);
    return '<div class="cols" style="margin-top:12px"><section class="card"><h2><i class="ti ti-plane"></i>Impossible travel <span class="c">two countries less than 2 hours apart</span></h2>'+(tr.length?'<table><tbody>'+tr.slice(0,30).map(function(x){return '<tr><td>'+esc(who(x))+'</td><td>'+esc(x.from+' → '+x.to)+'</td><td>'+esc(x.minutes+' min')+'</td><td class="sm mute">'+esc(String(x.at||'').slice(0,16).replace('T',' '))+'</td></tr>';}).join('')+'</tbody></table><div class="sm mute">A VPN or a phone on roaming can explain it - confirm with the person, revoke sessions if it was not them.</div>':'<div class="sm mute">None in the window read.</div>')

      +'<section class="card"><h2><i class="ti ti-calendar-time"></i>When people sign in <span class="c">Riyadh time · amber = outside Sun-Thu 07-18</span></h2>'+heat+'<div class="sm" style="margin-top:6px">'+esc(n(P.off_hours_pct,'%')+' of successful sign-ins outside working hours ('+n(P.off_hours)+')')+'</div>'
      +'<h2 style="margin-top:12px"><i class="ti ti-apps"></i>Failures per app</h2>'+((P.apps||[]).length?(function(){var am=Math.max.apply(null,P.apps.map(function(a){return a.total;}).concat([1]));return P.apps.map(function(a){return '<div class="bar"><span style="min-width:150px">'+esc(a.app)+'</span><span class="b"><i style="width:'+((a.total-a.failed)/am*100).toFixed(1)+'%;background:#2fb344"></i><i style="width:'+(a.failed/am*100).toFixed(1)+'%;background:#e5484d"></i></span><span>'+esc(n(a.fail_pct,'%')+' failed')+'</span></div>';}).join('');})():'<div class="sm mute">No sign-in read.</div>')+'</section></div>';}
  function guests(){var G=A.guests;if(!G)return '<section class="card">'+note('Guest accounts are read with the user list - '+(A.blocks.users&&!A.blocks.users.ok?'the app needs '+A.blocks.users.perm+'.':'none read yet.'))+'</section>';
    var cnt=function(x){return typeof x==='number'?x:(x||[]).length;},list=function(L,cols,empty){if(typeof L==='number')return note(L+' - names are shown to analysts and above (personal data).');return L.length?'<table><tbody>'+L.slice(0,100).map(function(x){return '<tr>'+cols.map(function(c){return '<td'+(c==='upn'?' class="sm mute"':'')+'>'+esc(c==='last'||c==='created'?String(x[c]||'').slice(0,10):x[c]||'')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>':'<div class="sm mute">'+esc(empty)+'</div>';};
    return '<section class="card"><h2><i class="ti ti-user-question"></i>Guest accounts <span class="c">'+esc(G.total+' enabled guests · '+cnt(G.never)+' never signed in · '+cnt(G.stale)+' idle 90 days')+'</span></h2>'+(G.readable?'':note('Sign-in activity is not readable (needs AuditLog.Read.All / Entra ID P1), so never-used and idle guests cannot be told apart.'))
      +'<div class="cols"><div><h2>Never signed in</h2>'+list(G.never,['name','upn','created'],'None.')+'</div><div><h2>No sign-in for 90 days</h2>'+list(G.stale,['name','upn','last'],'None.')+'</div></div><div class="sm mute" style="margin-top:8px">A guest nobody uses still has access: remove it, or run an Entra ID access review for guests.</div></section>';}
  function overview(){var k=A.kpis,h='<div class="cols"><section class="card"><h2><i class="ti ti-list-check"></i>What to do first <span class="c">ordered by impact, from the tenant\'s own data</span></h2>';
    h+=A.actions.length?A.actions.map(function(a,i){var c=a.priority>=75?'p-hi':a.priority>=50?'p-md':'p-lo';return '<div class="act"><div class="p '+c+'">'+(i+1)+'</div><div class="b"><div class="t">'+esc(a.title)+'</div><div class="s">'+esc(a.detail)+'</div></div><a class="btn sm" href="'+esc(a.link)+'">Open</a></div>';}).join(''):note('Nothing to do - every check is clean.');
    h+='</section><div><section class="card"><h2><i class="ti ti-chart-donut"></i>Posture</h2><div class="three">'+donut(k.mfa_pct,'#5b8def','MFA coverage')+donut(k.compliance_pct,'#2fb344','Device compliance')+donut(k.secure_score?k.secure_score.pct:null,'#b877d9','Secure Score')+'</div>'
      +(k.secure_score?'<div class="sm mute" style="margin-top:6px">Secure Score '+esc(k.secure_score.current+' / '+k.secure_score.max)+'</div>':'')+'<div class="sm" style="margin-top:8px">'+esc('Risky users: '+n(k.risky_users)+' · Defender alerts open: '+n(k.defender_open)+' · service issues: '+n(k.health_issues)+' · app credentials expiring / expired: '+n(k.app_creds))+'</div></section>';
    h+='<section class="card"><h2><i class="ti ti-trending-up"></i>Trend <span class="c">one sample a day</span></h2>'+spark('mfa_pct','MFA coverage %','#5b8def')+spark('compliance_pct','Device compliance %','#2fb344')+spark('seats_used','Licence seats used','#f5b544')+(A.anomalies.length?'<div class="warnbox" style="margin-top:8px">'+A.anomalies.map(function(x){return esc(x.text);}).join('<br>')+'</div>':'')+'</section>';
    if(A.health&&(A.health.degraded.length||A.health.issues.length))h+='<section class="card"><h2><i class="ti ti-heartbeat"></i>Microsoft service health</h2>'+A.health.issues.map(function(i){return '<div class="sm"><b>'+esc(i.service)+'</b> '+esc(i.title||'')+'</div>';}).join('')+'</section>';
    return h+'</div></div>';}
  function licences(){if(!A.licences.length)return '<section class="card">'+note(A.blocks.licenses&&!A.blocks.licenses.ok?'Licences not read - the app needs '+A.blocks.licenses.perm+'.':'No paid licence in the tenant.')+'</section>';
    return '<section class="card"><h2><i class="ti ti-certificate"></i>Licences <span class="c">bar: used (reclaimable part hatched) · free</span></h2><table><thead><tr><th>Licence</th><th>Seats</th><th></th><th>On disabled</th><th>Idle 90 d</th><th>Reclaim</th><th>Renews</th><th>Forecast</th></tr></thead><tbody>'
      +A.licences.map(function(l){var u=l.total?(l.consumed-l.reclaimable)/l.total*100:0,r=l.total?l.reclaimable/l.total*100:0;
        return '<tr><td><b>'+esc(l.sku)+'</b></td><td>'+esc(l.consumed+' / '+l.total)+'<div class="sm mute">'+esc(l.free)+' free</div></td><td><div class="seat"><i style="width:'+Math.max(0,u).toFixed(1)+'%;background:#5b8def"></i><i style="width:'+r.toFixed(1)+'%;background:repeating-linear-gradient(45deg,#f5b544 0 4px,#8a6a2a 4px 8px)"></i></div></td><td>'+esc(l.on_disabled)+'</td><td>'+esc(n(l.idle_90d))+'</td><td>'+(l.reclaimable?'<span class="pill v-medium">'+esc(l.reclaimable)+'</span>':'0')+'</td><td>'+esc(l.renews?l.renews+' ('+l.days+' d)':'—')+'</td><td class="sm">'+esc(l.forecast.days_to_full!=null?'all seats used in ~'+l.forecast.days_to_full+' d':l.forecast.per_day!=null?(l.forecast.per_day>0?'+':'')+l.forecast.per_day+' seats/day':l.forecast.note)+'</td></tr>';}).join('')+'</tbody></table><div class="sm mute" style="margin-top:8px">Idle = no sign-in for 90 days (needs AuditLog.Read.All and Entra ID P1 for the last sign-in). Seats, not money: the platform does not invent prices.</div></section>';}
  function identities(){var h=hidden(A.identities,'people ranked by identity risk');if(h)return '<section class="card">'+h+'</section>';
    return '<section class="card"><h2><i class="ti ti-users"></i>Identity risk <span class="c">an explainable score - every point is listed</span></h2>'+(A.identities.length?'<table><thead><tr><th>Person</th><th>Score</th><th>Why</th></tr></thead><tbody>'+A.identities.map(function(x){return '<tr><td>'+esc(x.name)+'<div class="sm mute">'+esc(x.upn)+'</div></td><td><span class="pill v-'+esc(x.level)+'">'+esc(x.score)+'</span></td><td class="sm">'+x.why.map(esc).join('<br>')+'</td></tr>';}).join('')+'</tbody></table>':note('No identity risk found in what was read.'))+'<div class="sm mute" style="margin-top:8px">Indicators, not proof: confirm with the person before acting.</div></section>';}
  function devlist(L,cols){var h=hidden(L,'devices');if(h)return h;if(!L||!L.length)return '<div class="sm mute">None.</div>';return '<table><tbody>'+L.slice(0,100).map(function(x){return '<tr>'+cols.map(function(c){return '<td>'+esc(x[c]||'')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';}
  function devices(){var D=A.devices;if(!D||D.total==null)return '<section class="card">'+note(A.blocks.intune&&!A.blocks.intune.ok?'Intune devices not read - the app needs '+A.blocks.intune.perm+'.':'No managed device in Intune.')+'</section>';
    var mx=Math.max.apply(null,D.by_os.map(function(o){return o.count;}).concat([1]));
    return '<div class="cols"><section class="card"><h2><i class="ti ti-devices"></i>Fleet by OS <span class="c">the usual build is learned from the fleet</span></h2>'+D.by_os.map(function(o){return '<div class="bar"><span style="min-width:110px">'+esc(o.family)+'</span><span class="b"><i style="width:'+(o.compliant/mx*100).toFixed(1)+'%;background:#2fb344"></i><i style="width:'+(o.noncompliant/mx*100).toFixed(1)+'%;background:#e5484d"></i><i style="width:'+((o.count-o.compliant-o.noncompliant)/mx*100).toFixed(1)+'%;background:#5b6474"></i></span><span>'+esc(o.count)+'</span></div><div class="sm mute" style="margin:-2px 0 6px 118px">'+esc(o.common_build?'usual build '+o.common_build+' ('+o.common_share+'%)':'')+'</div>';}).join('')
      +'<h2 style="margin-top:12px">Non-compliant</h2>'+devlist(D.noncompliant_list,['name','user','os'])+'</section><section class="card"><h2><i class="ti ti-user-off"></i>Still assigned to a disabled account</h2>'+devlist(D.leavers,['name','user','serial'])
      +'<h2 style="margin-top:12px"><i class="ti ti-clock-pause"></i>Not synced for 30 days</h2>'+devlist(D.stale,['name','user','last_sync'])+'<h2 style="margin-top:12px"><i class="ti ti-arrow-down-right"></i>Behind the fleet\'s build</h2>'+devlist(D.behind,['name','user','os','fleet_build'])+'</section></div>';}
  function signins(){var S=A.signins;if(!S||S.total==null)return '<section class="card">'+note(A.blocks.signins&&!A.blocks.signins.ok?'Sign-ins not read - the app needs '+A.blocks.signins.perm+' (Entra ID P1).':'No sign-in read yet.')+'</section>';
    var b=hidden(S.bursts,'accounts with failure bursts'),c=hidden(S.new_country,'sign-ins from a new country');
    return '<div class="cols"><section class="card"><h2><i class="ti ti-login"></i>Recent sign-ins <span class="c">'+esc(S.total)+' read · '+esc(n(S.fail_pct,'%'))+' failed</span></h2><h2>Failure bursts (5 or more)</h2>'+(b||(S.bursts.length?'<table><thead><tr><th>Account</th><th>Failures</th><th>IPs</th></tr></thead><tbody>'+S.bursts.map(function(x){return '<tr><td>'+esc(x.user)+'<div class="sm mute">'+esc(x.upn)+'</div></td><td>'+esc(x.failures)+'</td><td class="sm">'+esc(x.ips.join(', '))+'</td></tr>';}).join('')+'</tbody></table>':'<div class="sm mute">None.</div>'))
      +'<h2 style="margin-top:12px">A country new for the account</h2>'+(c||(S.new_country.length?'<table><tbody>'+S.new_country.map(function(x){return '<tr><td>'+esc(x.user)+'</td><td>'+esc(x.country)+'</td><td class="sm mute">before: '+esc(x.before.join(', '))+'</td><td class="sm">'+esc(x.ip)+'</td></tr>';}).join('')+'</tbody></table>':'<div class="sm mute">None.</div>'))+'</section><section class="card"><h2><i class="ti ti-world"></i>Where sign-ins come from</h2>'
      +(S.countries.length?S.countries.map(function(x){var mx=S.countries[0].count;return '<div class="bar"><span style="min-width:60px">'+esc(x.country)+'</span><span class="b"><i style="width:'+(x.count/mx*100).toFixed(1)+'%;background:#5b8def"></i></span><span>'+esc(x.count)+'</span></div>';}).join(''):'<div class="sm mute">No location in the sign-ins read.</div>')+'</section></div>';}
  function apps(){var P=A.apps;if(!P||P.total==null)return '<section class="card">'+note(A.blocks.apps&&!A.blocks.apps.ok?'App registrations not read - the app needs '+A.blocks.apps.perm+'.':'No app registration read.')+'</section>';
    var row=function(c){return '<tr><td>'+esc(c.app)+'</td><td>'+esc(c.kind+' '+c.name)+'</td><td>'+(c.days<0?'<span class="pill v-high">expired '+esc(-c.days)+' d ago</span>':'<span class="pill v-medium">'+esc(c.days)+' d left</span>')+'</td><td class="sm">'+esc((c.owners||[]).join(', ')||'no owner')+'</td></tr>';};
    return '<section class="card"><h2><i class="ti ti-key"></i>App secrets &amp; certificates <span class="c">'+esc(P.total)+' app registrations · '+esc(P.no_owner)+' without an owner</span></h2>'+(P.expired.length||P.expiring.length?'<table><thead><tr><th>App</th><th>Credential</th><th>When</th><th>Owner</th></tr></thead><tbody>'+P.expired.concat(P.expiring).map(row).join('')+'</tbody></table>':note('No credential expired or ending within 30 days.'))+'<div class="sm mute" style="margin-top:8px">Graph never returns secret values - only names and dates are kept.</div></section>';}
  function aiView(){var a=A.ai||{};return '<section class="card"><h2><i class="ti ti-robot"></i>AI Microsoft 365 analyst <span class="c">explains and prioritises from the tenant data - it cannot change anything in Microsoft 365</span></h2>'+(a.enabled?'':note('Not available: '+(a.reason||'')))+'<div class="row"><textarea class="inp" id="q" maxlength="4000" style="min-height:60px;flex:1" aria-label="Question" placeholder="Which licences can we reclaim before the E3 renewal? Who is our riskiest identity and why?"></textarea><button class="btn ai" id="ask" type="button"'+(a.enabled?'':' disabled')+'>Ask</button></div>'+(ANS?'<div class="ans">'+esc(ANS)+'</div>':'')+'</section>';}
  document.addEventListener('click',function(ev){var el=ev.target.closest('[data-tab],button[id]');if(!el)return;
    if(el.dataset.tab){TAB=el.dataset.tab;draw();return;}
    if(el.id==='refresh'){load();return;}
    if(el.id==='ask'){var q=$('q').value.trim();if(q.length<3)return;el.disabled=true;ANS='Looking at the tenant…';draw();req('POST','/api/soc/m365/insights/ask',{question:q}).then(function(r){ANS=r.answer;draw();}).catch(function(e){ANS=e.message;draw();});}
  });
  req('GET','/dashboards/whoami.json').then(function(w){ROLE=(w&&w.role)||'viewer';}).catch(function(){ROLE='viewer';/* no identity: read-only */}).then(load);
})();
</script></body></html>
