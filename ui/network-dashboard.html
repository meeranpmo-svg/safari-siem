<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network Dashboard</title><script src="vendor/zyb-org.js"></script><script src="vendor/zyb-dash.js"></script><link rel="stylesheet" href="vendor/zyb-soc.css"><script src="vendor/zyb-soc.js"></script>
<!-- Copyright (c) 2026 Citynet Work and Zyberon Information Technology, Saudi Arabia. All rights reserved. Proprietary and confidential - see LICENSE. -->
<!-- Network Dashboard: one read-only landing page over the network data the AI Network Engineer already holds (devices, route
     map, branch connectivity, SD-WAN, NAC). Each card loads its own endpoint and degrades on its own - a dead feed says
     "not connected", it never blanks the page or invents a figure. Every number links to the page that owns it. -->
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start}
.k .t.on{outline:2px solid var(--accent,#5794f2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:5px}
.dot.up,.dot.ok{background:#2fb344}.dot.warning,.dot.degraded,.dot.backup{background:#f59f00}.dot.critical,.dot.down{background:#e5484d}.dot.unknown,.dot.unpolled,.dot.unmeasured{background:#6b7280}
.seg{display:flex;height:12px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.06);margin:8px 0}
.seg i{display:block;height:100%}.seg i.up{background:#2fb344}.seg i.warning{background:#f59f00}.seg i.critical{background:#e5484d}.seg i.unknown,.seg i.unpolled{background:#4b5263}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}.row:last-child{border-bottom:0}
.lk{color:inherit;text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.3)}.lk:hover{border-bottom-style:solid}
.big{font-size:30px;font-weight:800;line-height:1}
.mut{color:#8b93a4}.sm{font-size:12px}
a.card{display:block;color:inherit;text-decoration:none}a.card:hover{border-color:#3a4258}
</style></head><body><main>
<div class="top"><div><div class="eb">Network · live from the AI Network Engineer</div><h1>Network Dashboard</h1></div><span class="sp"></span><span class="mut sm" id="up"></span><button type="button" id="rf">⟳ Refresh</button></div>
<div class="k" id="kp"><div class="empty">Loading…</div></div>
<div class="grid" id="cards"></div>
<div class="card" id="wfcard" hidden style="margin-top:12px"><h2>Business requests to the network team <span class="mut sm">Workflow Automation - firewall rule reviews, configuration backups and changes the CISO office, audit, GRC and administration asked for</span> <a class="lk sm" href="workflow-automation.html#tab=queue" style="margin-left:auto">team queue →</a></h2><div class="k" id="wfk"></div><div id="wfl"></div></div>
</main>
<script>
(function () {
  'use strict';
  var S = window.zybSoc, esc = S.esc, $ = function (i) { return document.getElementById(i); };
  var D = { ov: null, npm: null, rm: null, br: null, sd: null, nac: null }, ERR = {};
  function get(k, p) { return S.req('GET', p).then(function (v) { D[k] = v; }).catch(function (e) { ERR[k] = e; }); }
  // Workflow Automation (GET /api/itam/workflow/attention): the network team's open / overdue / on-time record and what needs this person
  function tl(l, v, s, c) { return '<div class="t ' + (c || '') + '"><div class="l">' + esc(l) + '</div><div class="v">' + esc(String(v)) + '</div><div class="s">' + esc(s || '') + '</div></div>'; }
  function loadWf() {
    var w = new XMLHttpRequest(); w.open('GET', '/api/itam/workflow/attention'); w.withCredentials = true; w.zybQuiet = true; w.timeout = 60000;
    w.onload = function () {
      var j = null; try { j = JSON.parse(w.responseText); } catch (e) { j = null; /* not JSON: said below */ }
      if (w.status === 404) { $('wfcard').hidden = true; return; } $('wfcard').hidden = false;
      if (w.status !== 200 || !j || !j.summary) { $('wfk').innerHTML = ''; $('wfl').innerHTML = '<div class="empty">Workflow Automation could not be read' + (j && j.error ? ': ' + esc(j.error) : ' (HTTP ' + w.status + ')') + '.</div>'; return; }
      var s = j.summary, n = (s.teams || []).filter(function (t) { return t.team === 'network'; })[0] || { open: 0, overdue: 0, n: 0, on_time: 0 };
      var P = (j.priorities || []).map(function (p) { return { p: p, pts: p.why.reduce(function (a, q) { return a + q[1]; }, 0) }; }).sort(function (a, b) { return b.pts - a.pts; });
      $('wfk').innerHTML = tl('Network team · open', n.open, 'requests with the network team') + tl('Network team · overdue', n.overdue, 'past their due date', n.overdue ? 'bad' : 'ok')
        + tl('Network team · on time', n.n ? Math.round(n.on_time / n.n * 100) + '%' : '—', n.n ? n.on_time + ' of ' + n.n + ' fulfilled' : 'no history yet') + tl('Waiting for your approval', s.approvals, 'changes to approve', s.approvals ? 'warn' : '') + tl('Overdue across IT', s.all_overdue, 'every IT team', s.all_overdue ? 'warn' : '');
      $('wfl').innerHTML = P.length ? P.slice(0, 8).map(function (x) { return '<div class="row"><span><a class="lk" href="' + esc(x.p.page) + '">' + esc(x.p.ref) + '</a> ' + esc(x.p.text) + '<span class="mut sm" style="display:block">' + esc(x.p.kind) + ' · ' + esc(x.p.why.map(function (q) { return q[0] + ' +' + q[1]; }).join(', ')) + '</span></span><b style="color:' + (x.pts >= 45 ? '#e5484d' : '#f59f00') + '">' + esc(String(x.pts)) + '</b></div>'; }).join('')
        : '<div class="empty">Nothing waiting for you in Workflow Automation' + (s.queue_open || s.approvals ? '' : ' - list the network engineers under the Network team in its Settings to see the team queue') + '.</div>';
    };
    w.onerror = w.ontimeout = function () { $('wfcard').hidden = false; $('wfk').innerHTML = ''; $('wfl').innerHTML = '<div class="empty">Workflow Automation did not answer.</div>'; }; w.send();
  }
  function load() {
    loadWf();
    ERR = {};
    return Promise.all([get('ov', '/netops/overview'), get('npm', '/netops/npm'), get('rm', '/netops/routemap'),
      get('br', '/netops/branches'), get('sd', '/netops/sdwan'), get('nac', '/netops/nac')]).then(draw);
  }
  function card(id, title, href, body, foot) {
    var h = href ? '<a class="card" href="' + esc(href) + '">' : '<div class="card">';
    return h + '<h2>' + esc(title) + (href ? ' <span class="mut sm">open →</span>' : '') + '</h2>' + body + (foot ? '<div class="mut sm" style="margin-top:8px">' + esc(foot) + '</div>' : '') + (href ? '</a>' : '</div>');
  }
  function errBody(k, what) { var e = ERR[k]; return '<div class="empty">' + (e && e.status === 404 ? esc(what + ' is not on this SIEM yet - run the update.') : e ? esc((e.message || 'not reachable')) : 'Not connected.') + '</div>'; }
  function seg(parts) { var tot = parts.reduce(function (a, p) { return a + p[1]; }, 0) || 1; return '<div class="seg">' + parts.filter(function (p) { return p[1]; }).map(function (p) { return '<i class="' + p[0] + '" style="width:' + (p[1] / tot * 100) + '%" title="' + esc(p[0] + ': ' + p[1]) + '"></i>'; }).join('') + '</div>'; }
  function draw() {
    $('up').textContent = D.ov && D.ov.poller ? 'devices polled ' + (D.ov.poller.polled != null ? D.ov.poller.polled : '') : '';
    // ---- KPI strip (devices, sites, branches, incidents, NAC) ----
    var npm = D.npm, c = npm && npm.counts || {}, tot = npm ? (npm.nodes ? npm.nodes.length : Object.keys(c).reduce(function (a, k) { return a + c[k]; }, 0)) : null;
    var reachable = npm ? (c.up || 0) + (c.warning || 0) : null;
    var sites = D.ov && D.ov.sites || [], sdown = sites.filter(function (s) { return s.status === 'down'; }).length, sdeg = sites.filter(function (s) { return s.status === 'degraded'; }).length;
    var rm = D.rm && D.rm.summary || null, br = D.br && D.br.configured ? D.br.kpis : null, nac = D.nac && D.nac.connected ? D.nac : null;
    var inc = rm ? rm.incidents : null, critInc = rm ? rm.critical : null;
    var T = function (l, v, s, cls, href) { return '<a class="t ' + (cls || '') + '" href="' + esc(href) + '" style="text-decoration:none"><div class="l">' + esc(l) + '</div><div class="v">' + esc(String(v)) + '</div><div class="s">' + esc(s || '') + '</div></a>'; };
    $('kp').innerHTML = (npm ? T('Devices up', (c.up || 0) + '/' + (tot || 0), (c.critical || 0) + ' down · ' + (c.warning || 0) + ' warning', (c.critical ? 'bad' : c.warning ? 'warn' : 'ok'), 'network-engineer.html')
        : '<div class="t"><div class="l">Devices</div><div class="v">–</div><div class="s">AI Network Engineer not reachable</div></div>')
      + (sites.length ? T('Sites', sites.length, sdown + ' down · ' + sdeg + ' degraded', sdown ? 'bad' : sdeg ? 'warn' : 'ok', 'network-route-map.html') : '')
      + (br ? T('Branches reach DC', (br.sites - br.down) + '/' + br.sites, br.down + ' cannot · ' + br.backup + ' on backup', br.down ? 'bad' : br.backup ? 'warn' : 'ok', 'branch-connectivity.html') : '')
      + (rm ? T('Open incidents', inc, critInc + ' critical · ' + rm.links_down + ' links down', critInc ? 'bad' : inc ? 'warn' : 'ok', 'network-route-map.html') : '')
      + (nac ? T('NAC enforcement', (nac.enforcement_pct != null ? nac.enforcement_pct + ' %' : '–'), (nac.counts && nac.counts.unauthorized || 0) + ' unauthorised', (nac.counts && nac.counts.unauthorized ? 'warn' : 'ok'), 'network-access.html') : '');

    var cards = [];
    // ---- Open network incidents (route map) ----
    if (D.rm && D.rm.summary) {
      var open = (D.rm.incidents || []).filter(function (x) { return !x.covered_by; });
      cards.push(card('rm', 'Open network incidents', 'network-route-map.html', open.length
        ? open.slice(0, 7).map(function (x) { return '<div class="row"><span>' + S.sev(x.severity) + ' ' + esc(x.title) + '</span><span class="mut sm">' + esc(x.site || '') + '</span></div>'; }).join('') + (open.length > 7 ? '<div class="mut sm" style="margin-top:6px">+' + (open.length - 7) + ' more</div>' : '')
        : '<div class="empty">No open incident — every mapped node and link is up.</div>', 'Root cause only; what is cut off behind a failure is folded into its incident.'));
    } else cards.push(card('rm', 'Open network incidents', 'network-route-map.html', errBody('rm', 'The WAN / LAN route map')));

    // ---- Device status by vendor (NPM) ----
    if (D.npm && D.npm.vendors) {
      cards.push(card('npm', 'Devices by vendor', 'network-engineer.html',
        seg([['up', c.up || 0], ['warning', c.warning || 0], ['critical', c.critical || 0], ['unknown', (c.unknown || 0) + (c.unpolled || 0)]])
        + D.npm.vendors.map(function (v) { var dn = v.nodes.filter(function (n) { return n.state === 'critical'; }).length; return '<div class="row"><span>' + esc(v.vendor) + '</span><span>' + v.count + (dn ? ' <span style="color:#ff8a8e">· ' + dn + ' down</span>' : '') + '</span></div>'; }).join(''),
        reachable + ' of ' + tot + ' reachable now.'));
    } else cards.push(card('npm', 'Devices by vendor', 'network-engineer.html', errBody('npm', 'The network device monitor')));

    // ---- Site health (overview) ----
    if (D.ov && D.ov.sites) {
      cards.push(card('ov', 'Site health', 'network-route-map.html', sites.length
        ? sites.slice(0, 8).map(function (s) { return '<div class="row"><span><span class="dot ' + esc(s.status) + '"></span>' + esc(s.site || '(no site)') + '</span><span class="mut sm">' + s.reachable + '/' + s.polled + ' up' + (s.rtt_avg_ms != null ? ' · ' + s.rtt_avg_ms + ' ms' : '') + '</span></div>'; }).join('')
        : '<div class="empty">No site has devices with polling on yet.</div>'));
    } else cards.push(card('ov', 'Site health', null, errBody('ov', 'The AI Network Engineer')));

    // ---- Branch connectivity ----
    if (D.br && D.br.configured) {
      var b = D.br.kpis, acts = (D.br.actions || [])[0];
      cards.push(card('br', 'Branch connectivity', 'branch-connectivity.html',
        '<div style="display:flex;gap:16px;align-items:baseline"><div class="big" style="color:' + (b.down ? '#ff8a8e' : b.backup ? '#f5b942' : '#4cd964') + '">' + b.ok + '</div><div class="mut sm">of ' + b.sites + ' sites healthy<br>' + b.down + ' cannot reach DC · ' + b.backup + ' on fewer paths · ' + b.partial + ' no DR path</div></div>'
        + (b.availability != null ? '<div class="row"><span>Availability to the DC (7 days)</span><span>' + esc(b.availability) + ' %</span></div>' : '')
        + (b.isp_below_sla ? '<div class="row"><span>ISPs below target</span><span style="color:#f5b942">' + b.isp_below_sla + '</span></div>' : ''),
        acts ? 'Next: ' + acts.title : null));
    } else cards.push(card('br', 'Branch connectivity', 'branch-connectivity.html', errBody('br', 'Branch Connectivity')));

    // ---- SD-WAN ----
    if (D.sd && (D.sd.inventory || D.sd.edges)) {
      var sh = D.sd.siteHealth || {}, hl = D.sd.health || {}, edges = D.sd.edges || [];
      cards.push(card('sd', 'SD-WAN (Silver Peak)', 'sdwan.html', edges.length
        ? seg([['up', hl.normal || 0], ['warning', hl.warning || 0], ['critical', hl.error || 0], ['unknown', hl.unknown || 0]])
          + '<div class="row"><span>Appliances</span><span>' + edges.length + ' · ' + (hl.normal || 0) + ' normal</span></div>'
          + '<div class="row"><span>Sites full path / partial / none</span><span>' + (sh.full || 0) + ' / ' + (sh.partial || 0) + ' / ' + (sh.none || 0) + '</span></div>'
        : '<div class="empty">No SD-WAN appliance is polled yet.</div>',
        D.sd.polled ? null : 'No appliance has reported yet.'));
    } else cards.push(card('sd', 'SD-WAN (Silver Peak)', 'sdwan.html', errBody('sd', 'SD-WAN')));

    // ---- NAC ----
    if (D.nac && D.nac.connected) {
      var nc = D.nac.counts || {};
      cards.push(card('nac', 'Network Access Control', 'network-access.html',
        '<div class="row"><span>Endpoints seen</span><span>' + (nc.total != null ? nc.total : (D.nac.endpoints || 0)) + '</span></div>'
        + '<div class="row"><span>Unauthorised</span><span style="color:' + (nc.unauthorized ? '#ff8a8e' : 'inherit') + '">' + (nc.unauthorized || 0) + '</span></div>'
        + '<div class="row"><span>Quarantined</span><span>' + (nc.quarantined || 0) + '</span></div>'
        + '<div class="row"><span>Enforcement</span><span>' + (D.nac.enforcement_pct != null ? D.nac.enforcement_pct + ' %' : '–') + '</span></div>',
        (D.nac.bypass_count ? D.nac.bypass_count + ' bypass exceptions on record.' : null)));
    } else cards.push(card('nac', 'Network Access Control', 'network-access.html', D.nac && !D.nac.connected ? '<div class="empty">No Genian NAC is polled yet — add it in Network Onboarding.</div>' : errBody('nac', 'Network Access Control')));

    // ---- Open findings (overview) ----
    if (D.ov && D.ov.findings) {
      var f = D.ov.findings || [];
      cards.push(card('fnd', 'Top network findings', 'network-engineer.html', f.length
        ? f.slice(0, 6).map(function (x) { return '<div class="row"><span>' + S.sev(x.severity) + ' ' + esc(x.title) + '</span><span class="mut sm">' + esc(x.site || x.device || '') + '</span></div>'; }).join('')
        : '<div class="empty">No open finding from the engineer’s own checks.</div>'));
    }

    // ---- Quick links ----
    cards.push(card('nav', 'Go to', null, [['network-route-map.html', '🗺 WAN & LAN Route Map'], ['branch-connectivity.html', '🔗 Branch Connectivity'], ['switch-port-map.html', '🔌 Switch Port Map'], ['network-access.html', '🛡 Network Access Control'], ['ncm.html', '📑 Config Management'], ['ipam.html', '🧮 IP Address Management'], ['network-engineer.html', '🤖 AI Network Engineer']].map(function (l) { return '<div class="row"><a class="lk" href="' + l[0] + '">' + esc(l[1]) + '</a></div>'; }).join('')));

    $('cards').innerHTML = cards.join('');
  }
  $('rf').addEventListener('click', load);
  S.ready(load); setInterval(function () { if (!document.hidden) load(); }, 60000);
})();
</script></body></html>
