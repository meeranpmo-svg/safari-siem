<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITAM Inventory</title><script src="vendor/zyb-org.js"></script><script src="vendor/zyb-dash.js"></script><script src="vendor/zyb-xlsx.js"></script>

<!-- ITAM Inventory over /api/itam/inventory (read) and the asset routes (POST /assets, /assets/:id, /assets/:id/<action>; validated and
     audited there): the whole register with facets, search, sortable columns you choose, saved views, CSV export and bulk changes;
     data quality per asset with the missing fields, duplicates, spec outliers per model, stale and ghost assets; a drawer to see the
     record (with which source set each field), edit it (a conflicting change is refused), move it through its lifecycle with a
     reason, and its history. Viewers read; operators change. -->
<style>
:root{--d-bg:#0b0d12;--d-panel:#12151c;--d-raise:#181c25;--d-line:#232837;--d-ink:#e7eaf0;--d-mute:#8b93a4;--bad:#ff7b80;--warn:#f5b544;--ok:#5fd27a;--info:#8db0ff;--acc:#5b8def}
[hidden]{display:none!important}*{box-sizing:border-box}
body{margin:0;background:var(--d-bg);color:var(--d-ink);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
main{max-width:1680px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}.top h1{margin:0;font-size:24px}.eb{font:600 11px ui-monospace,Consolas,monospace;letter-spacing:.09em;color:var(--d-mute);text-transform:uppercase}
.sp{flex:1}.mut{color:var(--d-mute)}.sm{font-size:12px}
.btn{font:600 13px Inter,system-ui,sans-serif;background:var(--d-raise);color:var(--d-ink);border:1px solid var(--d-line);border-radius:9px;padding:5px 11px;cursor:pointer}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn:disabled{opacity:.5}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.t{background:var(--d-panel);border:1px solid var(--d-line);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit}.t.on{outline:2px solid var(--acc)}.t .l{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--d-mute)}.t .v{font-size:22px;font-weight:800}.t .s{font-size:11px;color:var(--d-mute)}.t.bad .v{color:var(--bad)}.t.warn .v{color:var(--warn)}
.lay{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px}@media(max-width:1000px){.lay{grid-template-columns:1fr}}
.card{background:var(--d-panel);border:1px solid var(--d-line);border-radius:12px;padding:12px;margin-bottom:12px}.card h2{margin:0 0 8px;font-size:14px}
.fac h3{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--d-mute);margin:10px 0 4px}.fac label{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:2px 0;cursor:pointer}.fac label span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fac label b{color:var(--d-mute);font-weight:500}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.inp{background:var(--d-raise);color:var(--d-ink);border:1px solid var(--d-line);border-radius:8px;padding:6px 9px;font:inherit}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--d-line);font-size:12.5px;vertical-align:top;white-space:nowrap}th{color:var(--d-mute);font-weight:600;font-size:11px;text-transform:uppercase;cursor:pointer;user-select:none}th.s::after{content:' ▾'}th.s.asc::after{content:' ▴'}
tr.rw{cursor:pointer}tr.rw:hover{background:rgba(255,255,255,.03)}.tw{overflow:auto}
.pill{display:inline-block;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(141,176,255,.16);color:var(--info);margin-right:3px}.pill.bad{background:rgba(255,123,128,.16);color:var(--bad)}.pill.warn{background:rgba(245,181,68,.16);color:var(--warn)}.pill.ok{background:rgba(95,210,122,.16);color:var(--ok)}
.q{display:inline-block;width:34px;text-align:center;border-radius:6px;font-weight:800;font-size:11.5px;padding:1px 0}
.empty{color:var(--d-mute);padding:14px;text-align:center}.err{color:var(--bad);font-size:13px;margin-top:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2030;border:1px solid var(--d-line);border-radius:10px;padding:10px 16px;z-index:60}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--d-panel);border-left:1px solid var(--d-line);padding:16px;overflow:auto;z-index:50;box-shadow:-10px 0 30px rgba(0,0,0,.4)}
.dt{display:flex;gap:6px;margin:10px 0}.dt button{font:600 12.5px Inter,system-ui,sans-serif;background:transparent;color:var(--d-mute);border:1px solid var(--d-line);border-radius:8px;padding:5px 10px;cursor:pointer}.dt button.on{color:var(--d-ink);background:var(--d-raise)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:13px}.kv div:nth-child(odd){color:var(--d-mute)}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.f label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--d-mute)}.f .inp{width:100%}
.colpick{position:absolute;background:var(--d-panel);border:1px solid var(--d-line);border-radius:10px;padding:8px;z-index:40;columns:2}.colpick label{display:block;font-size:12.5px;padding:2px 4px}
</style></head><body><main>
<div class="top"><div><div class="eb">IT assets · the register</div><h1>Inventory</h1></div><span class="sp"></span><span class="mut sm" id="up"></span><button type="button" class="btn pri" id="b-add">＋ Add asset</button><button type="button" class="btn" id="rf">⟳</button></div>
<div class="k" id="kp"><div class="empty">Loading…</div></div>
<div class="lay"><aside class="card fac" id="fac"></aside>
<section><div class="card"><div class="bar"><input class="inp" id="q" placeholder="Search name, tag, serial, MAC, IP, model, owner…" aria-label="Search" style="min-width:300px;flex:1">
  <label class="sm mut"><input type="checkbox" id="all"> include retired</label><span style="position:relative"><button type="button" class="btn" id="b-cols">Columns</button><div class="colpick" id="cols" hidden></div></span>
  <select class="inp" id="views" aria-label="Saved views"><option value="">Saved views…</option></select><button type="button" class="btn" id="b-savev">Save view</button><button type="button" class="btn pri" id="b-xlsx">Export Excel</button><button type="button" class="btn" id="b-csv">Export CSV</button><button type="button" class="btn" id="b-imp">Import CSV</button><input type="file" id="imp-file" accept=".csv,text/csv" hidden></div>
  <div class="card" id="imp" hidden></div>
  <div class="bar" id="bulk" hidden><b id="bulkn"></b><select class="inp" id="bk-f"><option value="site">Set site</option><option value="department">Set department</option><option value="owner">Set owner</option><option value="custodian">Set custodian</option></select><input class="inp" id="bk-v" placeholder="value"><button type="button" class="btn pri" id="bk-go">Apply to selected</button><button type="button" class="btn" id="bk-x">Clear selection</button></div>
  <div class="tw" id="tbl"></div><div class="bar" style="margin-top:8px"><span class="sm mut" id="pg"></span><span class="sp"></span><button type="button" class="btn" id="prev">‹</button><button type="button" class="btn" id="next">›</button></div></div>
  <div class="card"><h2>Data quality</h2><div id="qual"></div></div><div class="card"><h2>Possible duplicates</h2><div id="dups"></div></div></section></div>
<aside class="drw" id="drw" hidden></aside>
</main>
<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); }, V = null, F = {}, ISSUE = '', SORT = { k: 'quality', asc: true }, PAGE = 0, PS = 100, SEL = {}, D = null, DT = 'rec';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var COLS = [['quality', 'Quality'], ['name', 'Name'], ['asset_tag', 'Tag'], ['type', 'Type'], ['status', 'Status'], ['site', 'Site'], ['department', 'Department'], ['owner', 'Owner'], ['vendor', 'Vendor'], ['model', 'Model'], ['serial', 'Serial'], ['mac', 'MAC'], ['ip', 'IP'], ['os', 'OS'], ['warranty_end', 'Warranty end'], ['support_end', 'Support end'], ['eol', 'End of life'], ['classification', 'Classification'], ['seen_days', 'Seen'], ['issues', 'Issues']];
  var SHOW = ['quality', 'name', 'type', 'status', 'site', 'owner', 'model', 'serial', 'mac', 'ip', 'warranty_end', 'eol', 'seen_days', 'issues'];
  try { var sv = JSON.parse(localStorage.getItem('zyb-inv-cols') || 'null'); if (Array.isArray(sv) && sv.length) SHOW = sv; } catch (e) { /* storage blocked: default columns */ }
  var ISS = { stale: ['warn', 'not seen'], ghost: ['bad', 'retired but seen'], duplicate: ['bad', 'duplicate?'], outlier: ['warn', 'spec outlier'], incomplete: ['warn', 'incomplete'] };
  var ACTIONS = [['activate', 'In use'], ['restock', 'Back to stock'], ['repair', 'To repair'], ['lost', 'Lost'], ['found', 'Found'], ['retire', 'Retire'], ['dispose', 'Dispose']];
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3500); }
  function req(m, u, b) { return new Promise(function (ok, bad) { var x = new XMLHttpRequest(); x.open(m, '/api/itam' + u); x.withCredentials = true; x.timeout = 120000; x.zybQuiet = true; if (b !== undefined) x.setRequestHeader('Content-Type', 'application/json');
    x.onload = function () { var j = null; try { j = JSON.parse(x.responseText); } catch (e) { /* not JSON */ } if (x.status >= 200 && x.status < 300 && j) ok(j); else bad(Object.assign(new Error((j && j.error) || 'HTTP ' + x.status), { status: x.status })); };
    x.onerror = x.ontimeout = function () { bad(Object.assign(new Error('not reachable'), { status: 0 })); }; x.send(b !== undefined ? JSON.stringify(b) : null); }); }
  var why = function (e) { return e.status === 403 ? 'Operators and administrators change assets.' : e.message; };
  var qc = function (q) { return q >= 80 ? 'background:rgba(95,210,122,.16);color:var(--ok)' : q >= 60 ? 'background:rgba(245,181,68,.16);color:var(--warn)' : 'background:rgba(255,123,128,.16);color:var(--bad)'; };
  function load() { return req('GET', '/inventory' + ($('all').checked ? '?all=1' : '')).then(function (v) { V = v; draw(); if (!$('drw').hidden && D) openAsset(D.asset.id); }).catch(function (e) { $('kp').innerHTML = '<div class="card" style="grid-column:1/-1"><div class="empty">' + esc(e.status === 404 ? 'The Inventory is not on this platform yet - run the update.' : 'Not reachable: ' + e.message) + '</div></div>'; }); }
  function tile(id, l, v, s, c) { return '<button type="button" class="t ' + (c || '') + (ISSUE === id ? ' on' : '') + '" data-iss="' + id + '"><div class="l">' + esc(l) + '</div><div class="v">' + esc(v) + '</div><div class="s">' + esc(s) + '</div></button>'; }
  function draw() {
    var I = {}; V.facets.issue.forEach(function (f) { I[f.value] = f.count; });
    $('up').textContent = V.total + ' assets · read ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    $('kp').innerHTML = tile('', 'Assets', V.total, 'in the register') + tile('quality', 'Data quality', V.quality.avg == null ? '–' : V.quality.avg + ' %', 'average completeness', V.quality.avg != null && V.quality.avg < 70 ? 'warn' : '') + tile('incomplete', 'Incomplete', I.incomplete || 0, 'under 60 % filled', I.incomplete ? 'warn' : '')
      + tile('duplicate', 'Possible duplicates', I.duplicate || 0, 'same serial / MAC / name', I.duplicate ? 'bad' : '') + tile('stale', 'Not seen', I.stale || 0, 'over ' + V.not_seen_days + ' days', I.stale ? 'warn' : '') + tile('outlier', 'Spec outliers', I.outlier || 0, 'vs the same model', '') + tile('ghost', 'Retired but seen', I.ghost || 0, 'include retired to see', I.ghost ? 'bad' : '');
    var fac = function (k, label) { var L = V.facets[k] || []; if (!L.length) return ''; return '<h3>' + label + '</h3>' + L.slice(0, 12).map(function (f) { var on = (F[k] || []).indexOf(f.value) >= 0; return '<label><input type="checkbox" data-fk="' + k + '" data-fv="' + esc(f.value) + '"' + (on ? ' checked' : '') + '><span title="' + esc(f.value) + '">' + esc(f.value) + '</span><b>' + f.count + '</b></label>'; }).join(''); };
    $('fac').innerHTML = '<div style="display:flex"><b class="sm">Filters</b><span class="sp"></span><button type="button" class="btn" id="fclear" style="padding:2px 8px">Clear</button></div>' + fac('type', 'Type') + fac('status', 'Status') + fac('site', 'Site') + fac('department', 'Department') + fac('vendor', 'Vendor');
    $('cols').innerHTML = COLS.map(function (c) { return '<label><input type="checkbox" data-col="' + c[0] + '"' + (SHOW.indexOf(c[0]) >= 0 ? ' checked' : '') + '> ' + esc(c[1]) + '</label>'; }).join('');
    var views = {}; try { views = JSON.parse(localStorage.getItem('zyb-inv-views') || '{}'); } catch (e) { /* storage blocked: no saved views */ }
    $('views').innerHTML = '<option value="">Saved views…</option>' + Object.keys(views).map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
    $('qual').innerHTML = '<div class="sm mut" style="margin-bottom:6px">Share of assets that have each field (only where the field matters for the type).</div>' + V.quality.by_field.map(function (f) { return '<div style="display:flex;gap:8px;align-items:center;font-size:12.5px;margin:3px 0"><span style="width:110px">' + esc(f.field) + '</span><span style="flex:1;height:8px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:' + (f.pct || 0) + '%;background:' + ((f.pct || 0) >= 80 ? '#2fb344' : (f.pct || 0) >= 50 ? '#f59f00' : '#e5484d') + '"></i></span><b style="width:70px;text-align:right">' + (f.pct == null ? '–' : f.pct + ' %') + '</b><span class="mut" style="width:70px">' + f.have + '/' + f.need + '</span></div>'; }).join('')
      + (V.quality.by_site.length ? '<div class="sm" style="margin-top:8px">Weakest sites: ' + V.quality.by_site.slice(0, 4).map(function (s) { return esc(s.site) + ' ' + s.avg + ' % (' + s.assets + ')'; }).join(' · ') + '</div>' : '');
    $('dups').innerHTML = V.duplicates.length ? '<table><thead><tr><th>Asset</th><th>Looks like</th><th>Matched on</th></tr></thead><tbody>' + V.duplicates.slice(0, 50).map(function (d) { return '<tr><td><a href="#" data-open="' + esc(d.a) + '" style="color:var(--info)">' + esc(d.a_name) + '</a></td><td><a href="#" data-open="' + esc(d.b) + '" style="color:var(--info)">' + esc(d.b_name) + '</a></td><td><span class="pill ' + (d.strength === 'strong' ? 'bad' : '') + '">' + esc(d.by.join(' + ')) + '</span></td></tr>'; }).join('') + '</tbody></table><div class="sm mut">Strong (serial / MAC): the same device recorded twice - retire one. Weak (name only): check.</div>' : '<div class="empty">No duplicate found.</div>';
    drawTable();
  }
  function rows() {
    var q = $('q').value.trim().toLowerCase();
    var L = V.rows.filter(function (r) {
      for (var k in F) if (F[k].length && F[k].indexOf(r[k] || '(none)') < 0) return false;
      if (ISSUE && ISSUE !== 'quality' && r.issues.indexOf(ISSUE) < 0) return false;
      if (q && [r.name, r.asset_tag, r.serial, r.mac, r.ip, r.model, r.vendor, r.owner, r.os, r.site].join(' ').toLowerCase().indexOf(q) < 0) return false; return true; });
    var k = ISSUE === 'quality' ? 'quality' : SORT.k, asc = ISSUE === 'quality' ? true : SORT.asc;
    L.sort(function (a, b) { var x = k === 'issues' ? a.issues.length : a[k], y = k === 'issues' ? b.issues.length : b[k]; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * (asc ? 1 : -1); });
    return L;
  }
  function cell(r, k) {
    if (k === 'quality') return '<span class="q" style="' + qc(r.quality) + '" title="missing: ' + esc(r.missing.join(', ') || 'nothing') + '">' + r.quality + '</span>';
    if (k === 'issues') return r.issues.map(function (i) { var c = ISS[i] || ['', i]; return '<span class="pill ' + c[0] + '">' + esc(c[1]) + '</span>'; }).join('');
    if (k === 'seen_days') return r.seen_days == null ? '<span class="mut">never</span>' : r.seen_days === 0 ? 'today' : r.seen_days + ' d';
    if (k === 'name') return '<b>' + esc(r.name || r.id) + '</b>';
    var v = r[k]; return v == null || v === '' ? '<span class="mut">–</span>' : esc(v);
  }
  function drawTable() {
    var L = rows(), n = L.length, pages = Math.max(1, Math.ceil(n / PS)); if (PAGE >= pages) PAGE = pages - 1;
    var cols = COLS.filter(function (c) { return SHOW.indexOf(c[0]) >= 0; });
    $('tbl').innerHTML = n ? '<table><thead><tr><th><input type="checkbox" id="selall" aria-label="Select page"></th>' + cols.map(function (c) { return '<th data-sort="' + c[0] + '" class="' + (SORT.k === c[0] ? 's' + (SORT.asc ? ' asc' : '') : '') + '">' + esc(c[1]) + '</th>'; }).join('') + '</tr></thead><tbody>'
      + L.slice(PAGE * PS, PAGE * PS + PS).map(function (r) { return '<tr class="rw" data-id="' + esc(r.id) + '"><td><input type="checkbox" data-sel="' + esc(r.id) + '"' + (SEL[r.id] ? ' checked' : '') + ' aria-label="Select"></td>' + cols.map(function (c) { return '<td>' + cell(r, c[0]) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>'
      : '<div class="empty">' + (V.rows.length ? 'Nothing matches the filters.' : 'The register is empty - add an asset, run Asset Discovery or import an export (ITAM Settings).') + '</div>';
    $('pg').textContent = n ? (PAGE * PS + 1) + '–' + Math.min(n, PAGE * PS + PS) + ' of ' + n : '';
    var ns = Object.keys(SEL).length; $('bulk').hidden = !ns; $('bulkn').textContent = ns + ' selected';
  }
  function openAsset(id) { req('GET', '/assets/' + encodeURIComponent(id)).then(function (d) { D = d; drawDrawer(); }, function (e) { toast(e.message); }); }
  function drawDrawer() {
    var a = D.asset, r = V.rows.filter(function (x) { return x.id === a.id; })[0] || { quality: null, missing: [], issues: [], outlier: [], duplicate_of: [] }, pv = a.prov || {};
    var kv = function (l, v, f) { return '<div>' + esc(l) + '</div><div>' + (v == null || v === '' ? '<span class="mut">–</span>' : esc(v)) + (f && pv[f] ? ' <span class="pill" title="who set it">' + esc(pv[f]) + '</span>' : '') + '</div>'; };
    var body = '';
    if (DT === 'rec') body = '<div class="kv">' + kv('Type', a.type, 'type') + kv('Status', a.status) + kv('Asset tag', a.asset_tag, 'asset_tag') + kv('Serial', a.serial, 'serial') + kv('MAC', a.mac, 'mac') + kv('IP', a.mgmt_ip, 'mgmt_ip') + kv('Vendor / model', [a.vendor, a.model].filter(Boolean).join(' '), 'model') + kv('OS', a.os, 'os')
      + kv('CPU / memory / disk', [a.cpu, a.mem_gb ? a.mem_gb + ' GB' : '', a.disk_gb ? a.disk_gb + ' GB disk' : ''].filter(Boolean).join(' · '), 'mem_gb') + kv('Site', a.site, 'site') + kv('Department', a.department, 'department') + kv('Owner / custodian', [a.owner, a.custodian].filter(Boolean).join(' / '), 'owner')
      + kv('Purchase', a.purchase ? [String(a.purchase.date || '').slice(0, 10), a.purchase.po, a.purchase.supplier].filter(Boolean).join(' · ') : null, 'purchase') + kv('Warranty', a.warranty ? String(a.warranty.start || '?').slice(0, 10) + ' → ' + String(a.warranty.end || '?').slice(0, 10) : null, 'warranty')
      + kv('Support', a.support ? [a.support.provider, a.support.contract, a.support.end ? 'until ' + String(a.support.end).slice(0, 10) : ''].filter(Boolean).join(' · ') : null, 'support') + kv('End of life', a.eol ? String(a.eol).slice(0, 10) : null, 'eol') + kv('Classification', a.classification, 'classification') + kv('CIA', a.cia ? 'C ' + (a.cia.c || '–') + ' · I ' + (a.cia.i || '–') + ' · A ' + (a.cia.a || '–') : null, 'cia')
      + kv('Sources', (a.sources || []).map(function (s) { return (s.source || s) + (s.last_seen ? ' (' + String(s.last_seen).slice(0, 10) + ')' : ''); }).join(', ')) + kv('Last seen', a.last_seen ? String(a.last_seen).slice(0, 16).replace('T', ' ') : 'never') + '</div>'
      + (r.missing.length ? '<div class="card" style="margin-top:10px"><b class="sm">Missing (' + r.quality + ' % complete):</b> <span class="sm">' + esc(r.missing.join(', ')) + '</span> · <a href="asset-autofill.html" style="color:var(--info)" class="sm">Asset Data Autopilot can fill some of these</a></div>' : '')
      + (r.outlier.length ? '<div class="card"><b class="sm">Spec outlier:</b> <span class="sm">' + esc(r.outlier.join(' · ')) + '</span></div>' : '') + (r.duplicate_of.length ? '<div class="card"><b class="sm" style="color:var(--bad)">Possible duplicate of:</b> ' + r.duplicate_of.map(function (id) { var o = V.rows.filter(function (x) { return x.id === id; })[0]; return '<a href="#" data-open="' + esc(id) + '" style="color:var(--info)">' + esc(o ? o.name : id) + '</a>'; }).join(', ') + '</div>' : '');

      req('POST', '/assets', b).then(function (r) { toast('Added'); var id = (r.asset || r).id; load().then(function () { DT = 'rec'; openAsset(id); }); }, function (er) { $('n-err').textContent = why(er); }); }); });
  $('q').addEventListener('input', function () { PAGE = 0; drawTable(); }); $('all').addEventListener('change', load);
  $('prev').addEventListener('click', function () { if (PAGE > 0) { PAGE--; drawTable(); } }); $('next').addEventListener('click', function () { PAGE++; drawTable(); });
  $('dups').addEventListener('click', function (e) { var o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); DT = 'rec'; openAsset(o.dataset.open); } });
  $('rf').addEventListener('click', load);
  load().then(function () { var m = /[#&]asset=([^&]+)/.exec(location.hash); if (m) openAsset(decodeURIComponent(m[1]));
    // from Scanned Assets: #q=<host> searches the register for it, #add=<host> opens Add asset with the name filled in
    var hv = function (k) { var x = new RegExp('[#&]' + k + '=([^&]+)').exec(location.hash); if (!x) return ''; try { return decodeURIComponent(x[1]).slice(0, 120); } catch (e) { return ''; /* a malformed link is ignored */ } };
    var q = hv('q'), add = hv('add'); if (q) { $('q').value = q; PAGE = 0; drawTable(); } if (add) { $('b-add').click(); $('n-name').value = add; } });
})();
