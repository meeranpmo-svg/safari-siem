<script>
(function(){
  'use strict';
  var Z=window.zybDetail, esc=Z.esc, $=function(id){return document.getElementById(id);};
  var TYPES=[['workstation','PC / desktop'],['laptop','Laptop'],['mobile','Mobile / tablet'],['printer','Printer'],['phone','IP phone'],['peripheral','Peripheral']];
  var TL={}; TYPES.forEach(function(t){TL[t[0]]=t[1];});
  var ST={discovered:['Not in inventory yet','warn'],in_use:['In use','ok'],in_stock:['In stock','info'],in_repair:['In repair','warn'],lost:['Lost','bad'],retired:['Retired',''],disposed:['Disposed','']};
  var NOW=Date.now(), DAY=86400000, STALE=30, ALL=[], F={};   // F: active filters {key: value}
  var ACTIVE=function(a){return a.status!=='retired'&&a.status!=='disposed';};

  /* ---- facts per device ---- */
  function osInfo(os){
    var s=String(os||'').trim(), l=s.toLowerCase();
    if(!s) return {fam:'Unknown',label:'Unknown',unsup:false};
    if(/windows/.test(l)){
      if(/\b(xp|vista)\b|windows 7\b|windows 8(\.1)?\b/.test(l)) return {fam:'Windows (unsupported)',label:s,unsup:true,why:'Microsoft no longer supports this Windows version'};
      if(/windows 10\b/.test(l)) return {fam:'Windows 10',label:s,unsup:true,why:'Windows 10 support ended on 14 Oct 2025 (only paid ESU updates)'};
      if(/windows 11\b/.test(l)) return {fam:'Windows 11',label:s,unsup:false};
      if(/server/.test(l)) return {fam:'Windows Server',label:s,unsup:false};
      return {fam:'Windows (other)',label:s,unsup:false};
    }
    if(/mac ?os|os x|darwin/.test(l)){var m=/(?:mac ?os|os x)\D*(\d+)/.exec(l),v=m?+m[1]:0;var old=v&&v<13&&v!==0;return {fam:'macOS',label:s,unsup:!!old,why:old?'This macOS version no longer gets security updates':''};}
    if(/ios|ipados/.test(l)) return {fam:'iOS / iPadOS',label:s,unsup:false};
    if(/android/.test(l)) return {fam:'Android',label:s,unsup:false};
    if(/ubuntu|linux|debian|red hat|rhel|centos|fedora/.test(l)) return {fam:'Linux',label:s,unsup:/centos/.test(l),why:/centos/.test(l)?'CentOS is end of life':''};

  }
  function ts(v){var t=Date.parse(v||'');return isFinite(t)?t:null;}
  function facts(a){
    var o=osInfo(a.os), last=ts(a.last_seen), wEnd=ts(a.warranty&&a.warranty.end), pDate=ts(a.purchase&&a.purchase.date);
    var srcs=(a.sources||[]).map(function(s){return s.source;}).concat(a._seen||[]).filter(function(x,i,l){return l.indexOf(x)===i;});
    var repairSince=null; if(a.status==='in_repair'){(a.lifecycle||[]).forEach(function(e){if(e.event==='repair')repairSince=ts(e.at);});}
    var f={os:o, user:a.owner||a.custodian||'', dept:a.department||'', site:a.site||'',
      days:last?Math.floor((NOW-last)/DAY):null, wDays:wEnd?Math.floor((wEnd-NOW)/DAY):null,
      year:pDate?new Date(pDate).getFullYear():null, agent:srcs.indexOf('agent')>=0||!!a._ec||srcs.indexOf('endpointcentral')>=0, srcs:srcs,
      repairDays:repairSince?Math.floor((NOW-repairSince)/DAY):null, sw:(a.software||[]).length};
    f.flags=[];
    if(ACTIVE(a)){
      if(a._only) f.flags.push('notinv');
      if(/noncompliant/i.test(a._compliance||'')) f.flags.push('noncomp');
      if(a._ec){ if(a._ec.live==='down') f.flags.push('ecdown'); if(a._ec.critical>=1) f.flags.push('ecpatch'); if(a._ec.health==='highly vulnerable') f.flags.push('ecvuln'); }
      if(a.status==='in_use'&&f.days!=null&&f.days>STALE) f.flags.push('stale');
      if(o.unsup) f.flags.push('os');
      if(f.wDays!=null&&f.wDays<0) f.flags.push('wexp'); else if(f.wDays!=null&&f.wDays<=90) f.flags.push('wsoon');
      if(a.status==='in_use'&&!f.user) f.flags.push('noowner');
      if(a.status==='in_use'&&!f.agent&&(a.type==='workstation'||a.type==='laptop')) f.flags.push('noagent');
      if(f.repairDays!=null&&f.repairDays>14) f.flags.push('repair');
      if(a.status==='lost') f.flags.push('lost');

  }
  var FLAGS={notinv:['Not in the inventory yet','warn','Found automatically (Asset Discovery / Active Directory, Endpoint Central or Microsoft Intune) but not registered in IT Asset Management. Open it and press "Add to inventory".'],

    ecvuln:['Highly vulnerable','bad','Endpoint Central rates this computer highly vulnerable. Review its missing patches and vulnerable software.'],
    ecdown:['Endpoint Central agent down','warn','The Endpoint Central agent is not reporting: check the machine is on the network and the agent service runs.'],
    noncomp:['Intune: not compliant','bad','Microsoft Intune reports this device as non-compliant (encryption, updates, antivirus or password policy). Check it in Intune.'],
    stale:['Not seen for '+STALE+'+ days','bad','In use, but no source has reported it for over '+STALE+' days. Confirm it is still with the user, or mark it lost.'],

    wexp:['Warranty expired','warn','Hardware faults are no longer covered.'],
    wsoon:['Warranty ends within 90 days','warn','Plan renewal or replacement.'],
    noowner:['No user assigned','warn','In use but nobody is recorded as owner or custodian (accountability, SAMA asset ownership).'],
    noagent:['No inventory agent','info','No software, patch or hardware details: install the ITAM agent.'],
    repair:['In repair for 14+ days','warn','Follow up with the vendor or issue a replacement.'],
    lost:['Lost','bad','Make sure accounts and disk encryption keys are revoked.'],
    old:['Older than 5 years','info','Candidate for the hardware refresh plan.']};

  /* ---- load ---- */
  function get(url){return new Promise(function(ok,bad){var x=new XMLHttpRequest();x.open('GET',url);x.withCredentials=true;x.timeout=30000;x.onload=function(){if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText));}catch(e){bad(new Error('bad response'));}}else bad(Object.assign(new Error('HTTP '+x.status),{status:x.status}));};x.onerror=x.ontimeout=function(){bad(new Error('IT Asset Management is not reachable'));};x.send();});}
  /* devices found automatically elsewhere: Asset Discovery (incl. Active Directory computers) and Microsoft Intune.
     Matched to inventory assets by name / serial; the rest are listed as "not in the inventory yet". */
  function short(n){return String(n||'').trim().toLowerCase().split('.')[0];}
  function typeOf(name,os,t){var n=String(name||'').toLowerCase(),o=String(os||'').toLowerCase();if(t==='printer'||t==='phone')return t;if(/ios|ipados|android/.test(o))return 'mobile';if(/(^|[-_])(lt|lap|nb|laptop|ntb)([-_\d]|$)/.test(n)||/macbook/.test(n))return 'laptop';return 'workstation';}
  function extras(inv,disc,intune,ecs){
    var byName={},bySer={},byId={};inv.forEach(function(a){var k=short(a.name);if(k)byName[k]=a;if(a.serial)bySer[String(a.serial).toLowerCase()]=a;byId[a.id]=a;});
    var out=[],seen={};
    var attach=function(a,src,info){a._seen=(a._seen||[]).concat(src);Object.keys(info).forEach(function(k){if(info[k]!=null&&info[k]!==''&&(a[k]==null||a[k]===''))a[k]=info[k];});};
    (disc||[]).forEach(function(d){if(d.asset_id||d.status!=='new')return;var t=d.type==='printer'?'printer':d.type==='phone'?'phone':d.type==='workstation'?'workstation':null;if(!t)return;
      var k=short(d.hostname||''),hit=(k&&byName[k])||null;var info={os:d.os,mgmt_ip:d.ip,mac:d.mac||(d.macs||[])[0],last_seen:d.last_seen,site:d.site,vendor:d.vendor};
      if(hit){attach(hit,'discovery',info);return;}
      var key=k||d.ip;if(!key||seen[key])return;seen[key]=1;
      out.push(Object.assign({id:'disc:'+d.id,_disc:d.id,_only:'discovery',_seen:['discovery'],name:d.hostname||d.ip,type:typeOf(d.hostname,d.os,t),status:'discovered',serial:d.serial||''},info));});
    (intune||[]).forEach(function(m){var k=short(m.name),ser=String(m.serial||'').toLowerCase(),hit=(ser&&bySer[ser])||(k&&byName[k])||null;
      var info={os:m.os,serial:m.serial,owner:m.user,last_seen:m.lastSync};
      if(hit){attach(hit,'intune',info);hit._compliance=m.compliance;return;}
      var dup=out.filter(function(x){return short(x.name)===k&&k;})[0];if(dup){attach(dup,'intune',info);dup._compliance=m.compliance;dup._intune=m;return;}
      out.push(Object.assign({id:'intune:'+(ser||k),_intune:m,_only:'intune',_seen:['intune'],_compliance:m.compliance,name:m.name,type:typeOf(m.name,m.os),status:'discovered'},info));});
    /* Endpoint Central: the computer it manages (linked asset first, else by name) gets the agent's logged-on user,
       last contact, live status and patch health - the same records the AI Desktop Support Engineer patrols */
    (ecs||[]).forEach(function(c){if(/server/i.test(c.os||''))return;var k=short(c.name),hit=(c.asset_id&&byId[c.asset_id])||(k&&byName[k])||null;
      var info={os:c.os,mgmt_ip:c.ip,owner:c.user,last_seen:c.last_contact?new Date(c.last_contact).toISOString():null,site:c.branch};
      if(hit){attach(hit,'endpointcentral',info);hit._ec=c;return;}
      var dup=out.filter(function(x){return short(x.name)===k&&k;})[0];if(dup){attach(dup,'endpointcentral',info);dup._ec=c;return;}
      out.push(Object.assign({id:'ec:'+c.resource_id,_ec:c,_only:'endpointcentral',_seen:['endpointcentral'],name:c.name,type:typeOf(c.name,c.os),status:'discovered'},info));});
    return out;
  }
  var DISC_N=0,INT_N=0,INT_OK=null,EC_N=null;
  function load(){
    $('msg').innerHTML='';
    var opt=function(u){return get(u).catch(function(){return null;});};
    Promise.all([Promise.all(TYPES.map(function(t){return get('/api/itam/assets?type='+t[0]+'&limit=5000').then(function(j){return j.assets||[];});})),
      opt('/api/itam/discovery/results?status=new&type=workstation&limit=5000'),opt('/api/itam/discovery/results?status=new&type=printer&limit=2000'),opt('/api/itam/discovery/results?status=new&type=phone&limit=2000'),opt('/api/soc/m365/graph'),opt('/api/itam/me/ec/computers')]).then(function(R){
      var lists=R[0],inv=[].concat.apply([],lists);
      var disc=[].concat(((R[1]||{}).devices)||[],((R[2]||{}).devices)||[],((R[3]||{}).devices)||[]),g=R[4]||{},intune=g.intuneOk?g.intune||[]:[];
      DISC_N=disc.length;INT_N=intune.length;INT_OK=g.configured?!!g.intuneOk:null;
      var ecs=R[5]&&R[5].computers?R[5].computers:null;EC_N=ecs?ecs.length:null;
      ALL=inv.concat(extras(inv,disc,intune,ecs||[])); NOW=Date.now(); ALL.forEach(function(a){a._f=facts(a);});
      $('up').textContent='synced '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' · inventory + Asset Discovery'+(EC_N?' + Endpoint Central ('+EC_N+')':'')+(INT_OK?' + Intune':'')+' · every 2 min';
      var miss=ALL.filter(function(a){return a._only;}).length;
      $('msg').innerHTML=(miss?'<div class="card" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-color:rgba(227,179,65,.5)"><b>'+miss+' devices found automatically are not in the inventory yet</b><span class="muted">(Asset Discovery / Active Directory'+(EC_N?', Endpoint Central':'')+(INT_OK?', Microsoft Intune':'')+')</span><span style="flex:1"></span><button type="button" data-k="flag" data-v="notinv">Show them</button>'+(ADMIN?' <button type="button" class="pri" id="addall">Add all to inventory</button>':'')+'</div>':'')+(INT_OK===false?'<div class="card muted" style="margin-bottom:12px">Microsoft Intune devices are not included yet: grant <b>DeviceManagementManagedDevices.Read.All</b> on the Microsoft 365 page.</div>':'');
      if(!ALL.length) $('msg').innerHTML+='<div class="card empty" style="margin-bottom:12px">No PCs, laptops or related devices in IT Asset Management yet. Add them there (category <b>End-user devices</b>), or let discovery / the ITAM agent find them.</div>';

    }).catch(function(e){$('msg').innerHTML='<div class="card err" style="margin-bottom:12px">'+(e.status===401||e.status===403?'You need to be signed in to the portal to see IT Asset Management data.':'Cannot load devices from IT Asset Management ('+esc(e.message)+').')+'</div>';$('tbl').innerHTML='';});
  }

  /* ---- filters ---- */
  function match(a,skip){
    var f=a._f;
    for(var k in F){ if(k===skip) continue; var v=F[k];
      if(k==='type'&&a.type!==v) return false;

      if(k==='site'&&(f.site||'(none)')!==v) return false;
      if(k==='year'&&String(f.year||'Unknown')!==v) return false;
      if(k==='flag'&&f.flags.indexOf(v)<0) return false;
      if(k==='status'&&a.status!==v) return false;

    }
    var q=$('q').value.trim().toLowerCase(); if(q&&(a.name+' '+(a.asset_tag||'')+' '+(a.serial||'')+' '+(a.model||'')+' '+(a.vendor||'')+' '+f.user+' '+(a.mgmt_ip||'')).toLowerCase().indexOf(q)<0) return false;
    var s=$('fs').value; if(s&&a.status!==s) return false;

  }
  function setF(k,v){ if(F[k]===v) delete F[k]; else F[k]=v; draw(); var t=$('tbl'); if(t&&t.scrollIntoView&&k!=='scope') t.closest('.card').scrollIntoView({behavior:'smooth',block:'start'}); }
  var FL={type:'Type',os:'OS',dept:'Department',site:'Site',year:'Purchased',flag:'Attention',status:'Status',scope:'Showing'};
  function fv(k,v){return k==='type'?TL[v]||v:k==='flag'?FLAGS[v][0]:k==='status'?(ST[v]||[v])[0]:k==='scope'?(v==='active'?'active devices':'with agent'):v;}

  /* ---- draw ---- */
  function bars(id,key,pairs,label){
    var max=Math.max.apply(null,[1].concat(pairs.map(function(p){return p[1];})));
    $(id).innerHTML=pairs.length?pairs.map(function(p){return '<button type="button" class="br'+(F[key]===p[0]?' on':'')+'" data-k="'+key+'" data-v="'+esc(p[0])+'" title="Show '+esc(label?label(p[0]):p[0])+'"><span class="n">'+esc(label?label(p[0]):p[0])+'</span><span class="b"><i style="width:'+Math.max(2,Math.round(p[1]/max*100))+'%"></i></span><span class="x">'+p[1]+'</span></button>';}).join(''):'<div class="empty">No data</div>';
  }
  function count(list,fn){var m={};list.forEach(function(a){var k=fn(a);m[k]=(m[k]||0)+1;});return Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(x,y){return y[1]-x[1];});}
  function draw(){
    var act=ALL.filter(ACTIVE), n=function(fn){return act.filter(fn).length;};
