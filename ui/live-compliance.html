    zybXlsx.download('live-compliance-'+new Date().toISOString().slice(0,10)+'.xlsx',sheets,{title:'Live Compliance - SAMA CSF, IA, NCA ECC, PDPL',filter:'period '+$('days').value+' days',by:(ZYB_ORG.short + ' — IT Operations and Cyber Security Automation Platform')});});
  function reqItam(p){return new Promise(function(ok,bad){var x=new XMLHttpRequest();x.open('GET','/api/itam'+p);x.withCredentials=true;x.timeout=60000;x.onload=function(){var j=null;try{j=JSON.parse(x.responseText);}catch(e){ /* not JSON: treated as no data */ }if(x.status>=200&&x.status<300&&j)ok(j);else bad(Object.assign(new Error((j&&j.error)||('HTTP '+x.status)),{status:x.status}));};x.onerror=x.ontimeout=function(){bad(new Error('ITAM is not reachable'));};x.send();});}
  function loadPol(){reqItam('/grc/csf-coverage').then(function(r){POL=r;PERR='';draw();}).catch(function(e){POL=null;PERR=e.status===404?'the policy view is not installed in ITAM yet — run the ITAM update':e.message;draw();});}
  function load(force){$('up').textContent='Loading…';loadPol();
    req('/compliance/sama?days='+encodeURIComponent($('days').value)+(force?'&refresh=1':'')).then(function(r){V=r;ERR='';LIVE={};(r.controls||[]).forEach(function(c){LIVE[c.id]=c;});draw();})
      .catch(function(e){V=null;LIVE={};ERR=e.status===404?'The SIEM does not have the SAMA compliance module yet — run the engine update.':e.status===401||e.status===403?'You are not signed in to the SIEM.':e.message;draw();});}
  $('refresh').addEventListener('click',function(){load(true);});
  $('days').addEventListener('change',function(){load(false);});
  if(!N.length||!F.sama){$('map').innerHTML='<p class="err">The framework registry (vendor/zyb-nav.js) did not load — refresh, or run the dashboards install.</p>';return;}
  draw();load(false);setInterval(function(){if(!document.hidden)load(false);},300000);   // live: re-read every 5 minutes while the page is open
})();
</script>
<script>
(function(){
  'use strict';
  var $=function(i){return document.getElementById(i);},E=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  function rq(m,p,b){return new Promise(function(ok,bad){var x=new XMLHttpRequest();x.open(m,'/api/soc'+p);x.withCredentials=true;x.zybQuiet=true;x.timeout=120000;if(b)x.setRequestHeader('Content-Type','application/json');
    x.onload=function(){var j=null;try{j=JSON.parse(x.responseText);}catch(e){j=null;/* not JSON: reported by status below */}if(x.status>=200&&x.status<300&&j)ok(j);else bad(Object.assign(new Error((j&&j.error)||'HTTP '+x.status),{status:x.status}));};
    x.onerror=x.ontimeout=function(){bad(new Error('the SIEM is not reachable'));};x.send(b?JSON.stringify(b):null);});}
  function spark(T){var p=(T||[]).filter(function(x){return x.pct!=null;});if(p.length<2)return '<div class="muted" style="font-size:12px">The trend line appears after the second daily snapshot.</div>';var w=300,h=60,mn=Math.min.apply(null,p.map(function(x){return x.pct;})),mx=Math.max.apply(null,p.map(function(x){return x.pct;})),rg=(mx-mn)||1;
    var d=p.map(function(x,i){return (i?'L':'M')+(i*(w-4)/(p.length-1)+2).toFixed(1)+' '+(h-4-(x.pct-mn)/rg*(h-8)).toFixed(1);}).join(' ');
    return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:60px" role="img" aria-label="SIEM coverage per day"><path d="'+d+' L'+(w-2)+' '+h+' L2 '+h+' Z" fill="rgba(121,184,255,.12)"/><path d="'+d+'" fill="none" stroke="#79b8ff" stroke-width="2"/></svg><div class="muted" style="font-size:11px">'+E(p[0].date)+' → '+E(p[p.length-1].date)+' · '+E(mn)+'–'+E(mx)+' %</div>';}
  function draw(v){var b=$('li-body');if(!v.installed){b.innerHTML='<span class="muted">'+E(v.note||'The SAMA coverage module is not installed in the SIEM.')+'</span>';return;}
    var k=v.kpis,L=v.learning||{},F=L.forecast||{},per=(v.per||[]).slice().sort(function(a,c){return a.reliability-c.reliability;}).slice(0,10);
    var acc=function(c){return ' style="--a:'+c+'"';},gm=Math.max.apply(null,[1].concat((v.leverage||[]).concat(v.quick_wins||[]).map(function(g){return +g.gain_pts||0;})));
    var gbar=function(g){return '<div class="g">+'+E(g.gain_pts)+'<span class="gb" title="'+E('+'+g.gain_pts+' coverage points')+'"><i style="width:'+((+g.gain_pts||0)/gm*100).toFixed(1)+'%"></i></span></div>';};
    var h='<div class="li-k"><button type="button" data-jump="ctitle"'+acc(k.coverage_pct>=80?'#3fb950':k.coverage_pct>=50?'#e3b341':'#f85149')+'><b>'+E(k.coverage_pct)+'%</b><span>SIEM coverage</span></button><button type="button" data-jump="li-trend"'+acc(k.change_7d==null?'#3a4258':k.change_7d>=0?'#3fb950':'#f85149')+'><b>'+(k.change_7d==null?'—':(k.change_7d>=0?'+':'')+E(k.change_7d))+'</b><span>pts in 7 days</span></button><button type="button" data-jump="li-watch"'+acc(k.regressions?'#f85149':'#3fb950')+'><b style="color:'+(k.regressions?'var(--bad)':'var(--ok)')+'">'+E(k.regressions)+'</b><span>regressions</span></button><button type="button" data-jump="li-watch"'+acc(k.flapping?'#e3b341':'#3fb950')+'><b style="color:'+(k.flapping?'var(--warn)':'var(--ok)')+'">'+E(k.flapping)+'</b><span>flapping</span></button><button type="button" data-jump="li-qw"'+acc('#79b8ff')+'><b>'+E(k.quick_wins)+'</b><span>quick wins</span></button><button type="button" data-jump="li-trend"'+acc('#3a4258')+'><b>'+E(L.snapshots||0)+'</b><span>daily snapshots</span></button></div>';
    h+='<div class="li-g"><div><h3 style="margin-top:0" id="li-trend">Coverage trend and forecast</h3>'+spark(L.trend)+'<p class="muted" style="font-size:12px;margin:6px 0 0">'+E(F.reached?'At or above the target.':F.why||'')+(F.target?' · '+E(F.target.why):'')+'</p>'
      +((v.regressions||[]).length||(v.flapping||[]).length?'<h3 id="li-watch">Watch</h3>'+(v.regressions||[]).map(function(r){return '<span class="chip bad" title="'+E('covered on '+r.regression.last_covered+', now '+r.regression.now+': '+(r.regression.why||[]).join('; '))+'">'+E(r.id)+' regressed</span>';}).join('')+(v.flapping||[]).map(function(r){return '<span class="chip warn" title="'+E(r.changes_14+' status changes in 14 days')+'">'+E(r.id)+' flapping</span>';}).join(''):'')+'</div>';
    h+='<div><h3 style="margin-top:0">Fix once, move many <span class="muted" style="font-weight:400">(leverage)</span></h3>'+((v.leverage||[]).length?(v.leverage||[]).slice(0,6).map(function(g){return '<div class="lv"><div><b>'+E(g.title||g.check)+'</b><small>'+E(g.controls.length)+' control(s): '+E(g.controls.join(', '))+(g.actions&&g.actions[0]?' · '+E(g.actions[0]):'')+'</small></div>'+gbar(g)+'</div>';}).join(''):'<div class="muted">No open check.</div>')
      +'<h3 id="li-qw">Quick wins <span class="muted" style="font-weight:400">(one check from covered)</span></h3>'+((v.quick_wins||[]).length?v.quick_wins.slice(0,5).map(function(q){return '<div class="lv"><div><b>'+E(q.id)+' '+E(q.title)+'</b><small>'+E(q.check_title)+(q.reason?' · '+E(q.reason):'')+'</small></div>'+gbar(q)+'</div>';}).join(''):'<div class="muted">No control is one check away.</div>')+'</div>';
    h+='<div><h3 style="margin-top:0">Least reliable controls <span class="muted" style="font-weight:400">(share of days covered, Beta(1,1))</span></h3>'+(per.length?per.map(function(r){var c=r.reliability>=80?'var(--ok)':r.reliability>=50?'var(--warn)':'var(--bad)';return '<div class="rl" title="'+E(r.title+' - '+r.days+' day(s) of history')+'"><b>'+E(r.id)+'</b><div class="tr"><i style="width:'+E(r.reliability)+'%;background:'+c+'"></i></div><span>'+E(r.reliability)+'%</span></div>';}).join('')+'<div class="muted" style="font-size:11px;margin-top:4px">50 % with no history - an honest prior, not a measurement.</div>':'<div class="muted">No SIEM-evidenced control yet.</div>')
      +'<h3>Compliance advisor (AI)</h3>'+(v.ai&&v.ai.enabled?'<button type="button" class="btn" id="li-ask">Ask for the next priorities</button><div id="li-ans" hidden></div>':'<div class="muted" style="font-size:12px">Not available: '+E((v.ai&&v.ai.reason)||'not configured')+'</div>')+'</div></div>';
    b.innerHTML=h;}
  function load(){var d=$('days')?$('days').value:'30';rq('GET','/compliance/sama-intel?days='+encodeURIComponent(d)).then(draw).catch(function(e){$('li-body').innerHTML='<span class="muted">'+E(e.status===404?'The SIEM learning layer is not installed yet - run the SIEM update.':e.status===403?'Your role cannot read the SIEM coverage.':'Could not read the SIEM learning layer: '+e.message)+'</span>';});}
  document.addEventListener('click',function(ev){if(ev.target.id!=='li-ask')return;var o=$('li-ans');o.hidden=false;o.textContent='Thinking…';
    rq('POST','/compliance/sama-intel/ask',{question:'What should we fix next to raise SAMA coverage?'}).then(function(r){o.innerHTML='<b>'+E(r.summary)+'</b>'+(r.priorities||[]).map(function(p){return '\n• '+E(p.ref)+' - '+E(p.action)+' ('+E(p.why)+')';}).join('')+(r.note?'\n\n'+E(r.note):'');}).catch(function(e){o.textContent=e.message;});});
  var dsel=$('days');if(dsel)dsel.addEventListener('change',load);var rf=$('refresh');if(rf)rf.addEventListener('click',load);
  load();
})();
</script>
