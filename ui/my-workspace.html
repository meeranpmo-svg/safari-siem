<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Workspace</title><script src="vendor/zyb-org.js"></script><script src="vendor/zyb-dash.js"></script><link rel="stylesheet" href="vendor/tabler/tabler-icons.min.css">
<style>
:root{--d-bg:#0b0d12;--d-panel:#12151c;--d-raise:#181c25;--d-line:#232837;--d-ink:#e7eaf0;--d-mute:#8b93a4;--d-ok:#2fb344;--d-warn:#f59f00;--d-bad:#e5484d;--d-acc:#5b8def}
[hidden]{display:none!important}*{box-sizing:border-box}
body{margin:0;background:var(--d-bg);color:var(--d-ink);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
main{max-width:1560px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}.top h1{margin:0;font-size:24px}.eb{font:600 11px ui-monospace,Consolas,monospace;letter-spacing:.09em;color:var(--d-mute);text-transform:uppercase}
.sp{flex:1}.mute{color:var(--d-mute)}.sm{font-size:12px}
.btn{font:600 13px Inter,"Segoe UI",system-ui,sans-serif;background:var(--d-raise);color:var(--d-ink);border:1px solid var(--d-line);border-radius:9px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn:hover{border-color:#3a4258}.btn.pri{background:var(--d-acc);border-color:var(--d-acc);color:#fff}.btn.bad{border-color:#5a2a2d;color:#ff8a8e}.btn.sm{padding:3px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--d-panel);border:1px solid var(--d-line);border-radius:16px;padding:16px;margin-bottom:14px;min-width:0}
.card h2{margin:0 0 12px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card h2 .c{color:var(--d-mute);font-weight:400;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.kpi{background:var(--d-raise);border:1px solid var(--d-line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;color:inherit;font:inherit}.kpi:hover{border-color:#3a4258}.kpi .n{font-size:26px;font-weight:800}.kpi .l{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--d-mute)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:transparent;border:1px solid var(--d-line);color:var(--d-mute);border-radius:999px;padding:6px 14px;font:600 13px Inter,"Segoe UI",system-ui,sans-serif;cursor:pointer;display:inline-flex;gap:6px;align-items:center}.tabs button[aria-selected="true"]{color:#fff;border-color:var(--d-acc);background:rgba(91,141,239,.2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips .btn.on{box-shadow:0 0 0 1px var(--d-acc) inset;border-color:var(--d-acc)}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-bottom:1px solid #1b2030;cursor:pointer;border-radius:8px}.li:hover{background:#151924}.li.sel{background:#172036}.li .b{flex:1;min-width:0}.li .t{font-weight:600;overflow-wrap:anywhere}.li .s{font-size:12px;color:var(--d-mute);overflow-wrap:anywhere}
.li.unread .t::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--d-acc);margin-right:6px;vertical-align:middle}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.p-urgent,.p-bad{background:rgba(229,72,77,.22);color:#ff8a8e}.p-high,.p-warn{background:rgba(245,159,0,.18);color:#f5b544}.p-normal,.p-info{background:rgba(91,141,239,.18);color:#8db0ff}.p-low,.p-mute{background:rgba(139,147,164,.16);color:#aab2c2}.p-ok{background:rgba(47,179,68,.15);color:#56d364}
.note{color:var(--d-mute);font-size:12.5px;padding:10px;border:1px dashed var(--d-line);border-radius:10px}
.inp,select.inp,textarea.inp{background:#0b0d12;color:var(--d-ink);border:1px solid var(--d-line);border-radius:8px;padding:6px 9px;font:13px Inter,"Segoe UI",system-ui,sans-serif;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:10px}.form label{font-size:11.5px;color:var(--d-mute);display:flex;flex-direction:column;gap:3px}.form .w{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--d-raise);border:1px solid var(--d-line);border-radius:12px;padding:12px;font-size:13px;max-height:420px;overflow:auto}
.day{font:600 11px ui-monospace,Consolas,monospace;letter-spacing:.08em;color:var(--d-mute);text-transform:uppercase;margin:12px 0 4px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.steps span{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--d-line);color:var(--d-mute)}.steps span.done{color:#56d364;border-color:#245c32}.steps span.cur{color:#fff;border-color:var(--d-acc);background:rgba(91,141,239,.2)}
.tl{border-left:2px solid var(--d-line);margin-left:6px;padding-left:12px}.tl div{position:relative;margin:6px 0;font-size:12.8px}.tl div::before{content:"";position:absolute;left:-17px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--d-acc)}
.dept{border:1px solid var(--d-line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--d-raise)}.tree{list-style:none;margin:6px 0 0 0;padding-left:14px;border-left:1px dashed #2e3546}.tree li{margin:6px 0}.tree .nm{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.8px}th{text-align:left;color:var(--d-mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--d-line)}td{padding:7px 8px;border-bottom:1px solid #1b2030;vertical-align:top}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2430;border:1px solid #2e3747;border-radius:10px;padding:10px 16px;z-index:9999;max-width:90vw}
@media(max-width:1100px){.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main>
<div class="top"><div><div class="eb">Start here</div><h1 id="hi">My Workspace</h1><div class="sm mute" id="sub">Your mail, meetings, Teams chats and tasks in one place.</div></div><div class="sp"></div>
 <label class="sm mute" style="display:inline-flex;gap:5px;align-items:center"><input type="checkbox" id="landing">Open when I sign in</label><span class="sm mute" id="acct"></span><button class="btn" id="connect" type="button" hidden><i class="ti ti-brand-office"></i>Connect my Microsoft 365</button><button class="btn" id="refresh" type="button"><i class="ti ti-refresh"></i>Refresh</button></div>
<div id="err" class="card" hidden></div>
<div id="main" hidden>
 <section class="card"><div class="kpis" id="kpis"></div></section>
 <div class="tabs" id="tabs" role="tablist"></div>
 <div id="view"></div>
</div>
</main>
<script>
(function(){
  'use strict';
  var esc=window.zybDetail.esc, $=function(id){return document.getElementById(id);};
  var RISK=false, RB=null, RERR='', ROLEB={}, ROLEK=[], ME=null, ORG=null, MAIL=null, CAL=null, CHATS=null, TASKS=null, SET=null, TAB='overview', TS='mine', LASTT=null, SELM='', SELC='', SELT='', OT='chart', ERRS={};
  var ADMIN=false;
  function toast(t){var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},5000);}
  function req(m,u,b){return new Promise(function(ok,bad){var x=new XMLHttpRequest();x.open(m,'/api/itam'+u);x.withCredentials=true;x.timeout=60000;x.zybQuiet=true;if(b)x.setRequestHeader('Content-Type','application/json');
    x.onload=function(){var j=null;try{j=JSON.parse(x.responseText);}catch(e){j=null;/* not JSON: shown as the HTTP status */}if(x.status>=200&&x.status<300&&j)return ok(j);bad(Object.assign(new Error((j&&j.error)||('HTTP '+x.status)),{status:x.status}));};
    x.onerror=x.ontimeout=function(){bad(Object.assign(new Error('IT Asset Management is not reachable'),{status:0}));};x.send(b?JSON.stringify(b):null);});}
  function when(t){return t?new Date(t).toLocaleString([], {weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';}
  function hm(t){return t?new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'';}
  function pname(id){var p=ORG&&ORG.people.find(function(x){return x.id===id;});return p?p.name:id;}
  function note(t){return '<div class="note">'+esc(t)+'</div>';}
  var STATUS={assigned:['Assigned','p-info'],in_progress:['In progress','p-info'],in_review:['In review','p-warn'],returned:['Returned','p-bad'],done:['Done','p-ok'],cancelled:['Cancelled','p-mute']};
  function stPill(s){var x=STATUS[s]||[s,'p-mute'];return '<span class="pill '+x[1]+'">'+esc(x[0])+'</span>';}
  // ---------- Microsoft sign-in return: the code comes back to this page, the engine exchanges it
  function finishSignIn(){var q=new URLSearchParams(location.search);if(!q.get('state')||!(q.get('code')||q.get('error')))return Promise.resolve();
    var code=q.get('code'), state=q.get('state'), er=q.get('error_description')||q.get('error');history.replaceState(null,'',location.pathname+location.hash);
    if(!code){toast('Microsoft sign-in was not completed: '+String(er||'cancelled').slice(0,160));return Promise.resolve();}
    return req('POST','/workspace/m365/callback',{code:code,state:state}).then(function(r){toast('Connected '+r.account);}).catch(function(e){toast('Not connected: '+e.message);});}
  function load(){
    $('err').hidden=true;
    return Promise.all([req('GET','/workspace/me'),req('GET','/workspace/org')]).then(function(R){ME=R[0];ORG=R[1];ADMIN=!!ORG.can_edit;
      $('main').hidden=false;drawHead();var m=ME.m365||{};
      var jobs=[];ERRS={};MAIL=CAL=CHATS=null;
      if(m.connected){if(m.features.mail)jobs.push(req('GET','/workspace/mail').then(function(j){MAIL=j;}).catch(function(e){ERRS.mail=e.message;}));
        if(m.features.calendar)jobs.push(req('GET','/workspace/calendar?days=7').then(function(j){CAL=j;}).catch(function(e){ERRS.cal=e.message;}));
        if(m.features.teams)jobs.push(req('GET','/workspace/chats').then(function(j){CHATS=j;}).catch(function(e){ERRS.chats=e.message;}));}
      if(ADMIN)jobs.push(req('GET','/workspace/m365/settings').then(function(j){SET=j;}).catch(function(e){ERRS.set=e.message;}));
      jobs.push(loadTasks());
      // the Head of Risk & Compliance (or anyone who manages risk) gets a Risk & Compliance tab with their brief
      // the CISO gets a Security tab, the IT / Infrastructure Manager an IT Operations tab (engine/role-brief.js): the job title on the
      // profile or the role in Roles & Functions decides
      var jt=ME.profile&&ME.profile.role,roleKinds=function(ro){var k=[];if(jt==='ciso'||(ro&&ro.id==='ciso'))k.push('ciso');if(jt==='infra-manager'||jt==='infra-assoc-manager'||(ro&&ro.id==='infra-manager'))k.push('itm');return k;};
      var loadRole=function(k){ROLEK=k;return Promise.all(k.map(function(x){return req('GET','/role-brief/'+x).then(function(j){ROLEB[x]=j;}).catch(function(e){ROLEB[x]={error:e.message};});}));};
      jobs.push(req('GET','/roles/me').then(function(r){var ro=r&&r.role;RISK=!!((ME.profile&&ME.profile.role==='head-risk-compliance')||(ro&&(ro.id==='risk-head'||(ro.functions||{}).risk==='manage')));
        return Promise.all([loadRole(roleKinds(ro)),RISK?req('GET','/risk-command/my').then(function(j){RB=j;RERR='';}).catch(function(e){RB=null;RERR=e.message;}):null]);}).catch(function(){RISK=!!(ME.profile&&ME.profile.role==='head-risk-compliance');/* roles not installed: the job title decides */
        return Promise.all([loadRole(roleKinds(null)),RISK?req('GET','/risk-command/my').then(function(j){RB=j;}).catch(function(e){RERR=e.message;}):null]);}));
      return Promise.all(jobs).then(function(){if(!load.done){if(ROLEK.length)TAB=ROLEK[0];else if(RISK)TAB='risk';}load.done=true;drawHead();draw();});
    }).catch(function(e){$('main').hidden=true;$('err').hidden=false;$('err').innerHTML='<h2><i class="ti ti-alert-triangle"></i>Team Workspace is not available</h2><div class="note">'+esc(e.status===404?'Team Workspace is not installed on the server - run the update (update-platform.ps1).':e.message)+'</div>';});
  }
  function loadTasks(){return req('GET','/workspace/tasks?scope='+encodeURIComponent(TS)).then(function(j){TASKS=j.tasks;}).catch(function(e){TASKS=[];ERRS.tasks=e.message;});}
  function drawHead(){
    var p=ME.profile, m=ME.m365||{};
    $('hi').textContent=p?('Good '+(new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening')+', '+p.name.split(' ')[0]):'My Workspace';
    $('sub').textContent=p?[p.role_name,p.department_name,ME.managers&&ME.managers[0]?'reports to '+ME.managers[0].name:null].filter(Boolean).join(' · '):(ME.note||'');
    $('connect').hidden=!(p&&m.configured&&!m.connected);
    $('acct').textContent=m.connected?'Microsoft 365: '+m.account:m.configured?'':'Microsoft 365 not set up'+(ADMIN?' - see Settings':'');
    var T=ME.tasks||{mine:[],review:[],team:{}};
    function k(n,l,tab,c){return '<button type="button" class="kpi" data-tab="'+tab+'"><div class="n" style="color:'+(c||'inherit')+'">'+esc(n)+'</div><div class="l">'+esc(l)+'</div></button>';}
    var nx=CAL&&CAL.next;
    $('kpis').innerHTML=k(MAIL?MAIL.unread:'—','unread mail','mail')+k(MAIL?MAIL.needs_you:'—','mail that needs you','mail',MAIL&&MAIL.needs_you?'#f5b544':'')+k(CAL?CAL.today:'—','meetings today','meetings')
      +k(nx?hm(nx.start):'—',nx?'next: '+nx.subject.slice(0,26):'next meeting','meetings')+k(T.mine.length,'my open tasks','tasks',T.mine.some(function(t){return t.overdue;})?'#ff7b80':'')+k(T.review.length,'waiting for my review','tasks',T.review.length?'#f5b544':'');
    var tabs=[['overview','layout-dashboard','Overview']].concat(ROLEK.indexOf('ciso')>=0?[['ciso','shield-lock','Security']]:[]).concat(ROLEK.indexOf('itm')>=0?[['itm','server-cog','IT Operations']]:[]).concat(RISK?[['risk','shield-check','Risk & Compliance']]:[]).concat([['mail','mail','Mail'],['meetings','calendar','Meetings'],['teams','brand-teams','Teams'],['tasks','checklist','Tasks'],['org','sitemap','Organisation']]);if(ADMIN)tabs.push(['settings','settings','Settings']);
    $('tabs').innerHTML=tabs.map(function(t){return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(TAB===t[0])+'"><i class="ti ti-'+t[1]+'"></i>'+esc(t[2])+'</button>';}).join('');
  }
  function needConnect(what){var m=ME.m365||{};if(!ME.profile)return note('Your sign-in has no profile yet - an administrator adds you under Organisation, then your '+what+' appears here.');
    if(!m.configured)return note('Microsoft 365 is not set up for Team Workspace yet.'+(ADMIN?' Complete it under Settings.':' An administrator completes it.'));
    if(!m.connected)return note('Connect your Microsoft 365 account (button at the top) to see your '+what+'. You sign in to Microsoft yourself; the platform reaches only your own mailbox, calendar and chats.');return '';}
  function draw(){var v=$('view');
    if(TAB==='ciso'||TAB==='itm')v.innerHTML=roleView(TAB);else if(TAB==='risk')v.innerHTML=riskView();else if(TAB==='overview')v.innerHTML=overview();else if(TAB==='mail')v.innerHTML=mailView();else if(TAB==='meetings')v.innerHTML=meetView();else if(TAB==='teams')v.innerHTML=teamsView();else if(TAB==='tasks')v.innerHTML=tasksView();else if(TAB==='org')v.innerHTML=orgView();else v.innerHTML=settingsView();
    if(TAB==='mail'&&SELM)openMail(SELM);if(TAB==='teams'&&SELC)openChat(SELC);}
  // ---------- overview
  function mailRows(L){return L.map(function(m){return '<div class="li'+(m.unread?' unread':'')+(SELM===m.id?' sel':'')+'" data-mail="'+esc(m.id)+'"><div class="b"><div class="t">'+esc(m.subject)+'</div><div class="s">'+esc(m.from?(m.from.name||m.from.address):'')+' · '+esc(when(m.received))+(m.attachments?' · attachment':'')+'</div><div class="s">'+esc(m.preview)+'</div></div><div>'+(m.tag?'<span class="pill p-warn">'+esc(m.tag)+'</span> ':'')+(m.important?'<span class="pill p-bad">important</span> ':'')+(m.flagged?'<span class="pill p-info">flagged</span>':'')+'</div></div>';}).join('');}
  function taskRows(L){return L.length?L.map(function(t){return '<div class="li'+(SELT===t.id?' sel':'')+'" data-task="'+esc(t.id)+'"><div class="b"><div class="t">'+esc(t.title)+'</div><div class="s">'+esc(t.assignee_card?t.assignee_card.name:'')+' · from '+esc(t.created_by_name||t.created_by)+(t.due?' · due '+esc(t.due):'')+(t.reviewer?' · reviewer '+esc(t.reviewer.name):'')+'</div></div><div><span class="pill p-'+esc(t.priority)+'">'+esc(t.priority)+'</span> '+stPill(t.status)+(t.overdue?' <span class="pill p-bad">overdue</span>':'')+'</div></div>';}).join(''):note('Nothing here.');}
  function meetRows(L){return L.map(function(e){var j=e.join&&/^https:\/\/([a-z0-9-]+\.)*teams\.(microsoft\.com|live\.com)\//.test(e.join)?e.join:null;
    return '<div class="li"><div class="b"><div class="t">'+esc(e.subject)+'</div><div class="s">'+(e.all_day?'all day':esc(hm(e.start)+' – '+hm(e.end)))+(e.location?' · '+esc(e.location):'')+(e.organizer?' · '+esc(e.organizer.name||e.organizer.address):'')+(e.response&&e.response!=='organizer'&&e.response!=='none'?' · '+esc(e.response):'')+'</div></div><div>'+(j?'<a class="btn sm pri" href="'+esc(j)+'" target="_blank" rel="noopener noreferrer"><i class="ti ti-video"></i>Join</a>':'')+'</div></div>';}).join('');}
  // ---------- Risk & Compliance (the Head of Risk & Compliance): the brief, ranked priorities, my risks and actions, compliance,
  // and mail / meetings ranked by a keyword classifier (every match is shown as the reason) - nothing is sent or changed from here
  var RW=[[/\b(risk|risks|appetite|heat ?map|kri)\b/i,3,'risk'],[/\b(compliance|compliant|non-?compliance)\b/i,3,'compliance'],[/\b(audit|auditor|finding|findings)\b/i,3,'audit'],[/\b(sama|insurance authority|nca|ecc|sdaia|ndmo|pdpl|iso ?27001|regulator|regulatory)\b/i,4,'regulator'],
    [/\b(committee|board|executive committee|exco)\b/i,2,'committee'],[/\b(breach|incident|fraud|aml)\b/i,3,'incident'],[/\b(polic(y|ies)|control|controls|exception)\b/i,2,'policy & controls'],[/\b(deadline|due|overdue|penalt\w*)\b/i,2,'deadline']];
  function rclass(text){var why=[],sc=0;RW.forEach(function(w){if(w[0].test(text)){sc+=w[1];why.push(w[2]);}});return {score:sc,why:why};}
  function words(t){return String(t||'').toLowerCase().replace(/\(synthetic\)/g,'').split(/[^a-z0-9؀-ۿ]+/).filter(function(w){return w.length>3;});}
  function related(text){if(!RB)return [];var A=words(text);if(!A.length)return [];return RB.my_risks.concat(RB.priorities.map(function(p){return {id:p.ref,title:p.text};})).filter(function(r){var B=words(r.title);return B.some(function(w){return A.indexOf(w)>=0;});}).slice(0,3);}
  function pr(n,c){return '<span class="pill '+c+'">'+esc(n)+'</span>';}
  // ---------- Security (CISO) and IT Operations (IT Manager): the rule-written brief, KPIs, ranked priorities, where to go next
  var RK={ciso:[['posture','security posture'],['security_risks','critical / high security risks'],['critical_alerts','critical alerts open'],['sla_breaching','SOC cases breaching SLA'],['decisions','decisions waiting'],['sama_coverage','SAMA evidence coverage %'],['my_overdue','my overdue actions'],['appetite_outside','IT / cyber appetite outside'],['wf_attention','requests needing me']],
    itm:[['servers','servers'],['backup_pct','servers backed up %'],['patch_pct','computers fully patched %'],['eol','past end of support'],['storage_pct','storage used %'],['contracts_due','contracts expired / expiring'],['my_overdue','my overdue actions'],['appetite_outside','IT appetite outside'],['ad_waiting','AD changes for me'],['wf_attention','requests needing me']]};
  function roleView(kind){var b=ROLEB[kind];if(!b)return note('Loading the brief…');if(b.error)return note('The brief could not be read: '+b.error);var h='';
    h+='<section class="card" id="'+kind+'brief"><h2><i class="ti ti-sparkles"></i>Your brief <span class="c">written by rules from the platform, '+esc(when(b.generated_at))+'</span></h2><ul style="margin:0;padding-left:18px">'+b.brief.map(function(l){return '<li style="margin:3px 0">'+esc(l)+'</li>';}).join('')+'</ul>'

    if(OT==='roles'){var tmiss=ADMIN&&ORG.template?ORG.template.departments.filter(function(d){return !ORG.departments.some(function(x){return x.id===d.id;});}).concat(ORG.template.roles.filter(function(r){return !ORG.roles.some(function(x){return x.id===r.id;});})):[];
      if(tmiss.length)h+='<section class="card"><h2><i class="ti ti-template"></i>Standard departments and job titles not added yet</h2><div class="sm mute">'+tmiss.map(function(x){return esc(x.name);}).join(', ')+'</div><div style="margin-top:8px"><button class="btn pri" type="button" id="tpl"><i class="ti ti-template"></i>Add what is missing</button> <span class="sm mute">Only the missing ones are added - what you have already changed stays as it is, and everything added can be edited or deleted.</span></div></section>';
      h+='<section class="card"><h2><i class="ti ti-building"></i>Departments</h2><table><thead><tr><th>Department</th><th>Head (role)</th><th>People</th>'+(ADMIN?'<th></th>':'')+'</tr></thead><tbody>'+ORG.departments.map(function(d){var r=ORG.roles.find(function(x){return x.id===d.head_role;});return '<tr><td>'+esc(d.name)+'<div class="sm mute">'+esc(d.description||'')+'</div></td><td>'+esc(r?r.name:'—')+(d.head?' <span class="mute">('+esc(d.head.name)+')</span>':'')+'</td><td>'+esc(d.people)+'</td>'+(ADMIN?'<td><button class="btn sm bad" type="button" data-del="departments:'+esc(d.id)+'">Remove</button></td>':'')+'</tr>';}).join('')+'</tbody></table>'
      +(ADMIN?'<div class="form" style="margin-top:10px"><label>New department<input class="inp" id="dd-name" maxlength="80"></label><label>Head role'+rsel('dd-head','')+'</label><label class="w">Description<input class="inp" id="dd-desc" maxlength="300"></label></div><button class="btn" type="button" id="dd-go">Add department</button>':'')+'</section>';
      h+='<section class="card"><h2><i class="ti ti-id-badge-2"></i>Job roles <span class="c">a job title and its reporting line - access levels stay in Roles &amp; Functions</span></h2><table><thead><tr><th>Role</th><th>Department</th><th>Reports to</th><th>Held by</th>'+(ADMIN?'<th></th>':'')+'</tr></thead><tbody>'+ORG.roles.map(function(r){var d=ORG.departments.find(function(x){return x.id===r.department;}), up=ORG.roles.find(function(x){return x.id===r.reports_to_role;});return '<tr><td>'+esc(r.name)+'</td><td>'+esc(d?d.name:r.department)+'</td><td>'+esc(up?up.name:'—')+'</td><td>'+(r.holders.length?esc(r.holders.join(', ')):'<span class="pill p-warn">vacant</span>')+'</td>'+(ADMIN?'<td><button class="btn sm bad" type="button" data-del="roles:'+esc(r.id)+'">Remove</button></td>':'')+'</tr>';}).join('')+'</tbody></table>'

    h+='<section class="card"><h2><i class="ti ti-route"></i>Workflows <span class="c">who reviews a task, step by step</span></h2><table><thead><tr><th>Workflow</th><th>Steps</th>'+(ADMIN?'<th></th>':'')+'</tr></thead><tbody>'+ORG.workflows.map(function(w){return '<tr><td>'+esc(w.name)+'<div class="sm mute">'+esc(w.description||'')+'</div></td><td>'+w.steps.map(function(s,i){return esc((i+1)+'. '+s.name+' ('+s.to+')');}).join('<br>')+'</td>'+(ADMIN&&!w.builtin?'<td><button class="btn sm bad" type="button" data-del="workflows:'+esc(w.id)+'">Remove</button></td>':ADMIN?'<td></td>':'')+'</tr>';}).join('')+'</tbody></table>'

  // ---------- settings
  function settingsView(){if(ERRS.set)return note(ERRS.set);var s=SET||{};var f=s.features||{};

  // ---------- actions
  function val(id){var e=$(id);return e?e.value.trim():'';}
  function act(p,b,ok){return req('POST',p,b).then(function(r){toast(ok);return load().then(function(){return r;});}).catch(function(e){toast(e.message);});}
  document.addEventListener('click',function(ev){var el=ev.target.closest('[data-tab],[data-mail],[data-chat],[data-task],[data-ts],[data-ot],[data-ta],[data-reply],[data-csend],[data-del],[data-edit-p],button[id]');if(!el)return;

    if(el.dataset.editP){window._wsEditP=el.dataset.editP;draw();return;}

    if(el.dataset.reply){var t=val('rtext');if(!t){toast('Write a reply first');return;}el.disabled=true;req('POST','/workspace/mail/'+encodeURIComponent(SELM)+'/reply',{comment:t,all:el.dataset.reply==='1'}).then(function(){toast('Reply sent');$('rtext').value='';}).catch(function(e){toast(e.message);}).then(function(){el.disabled=false;});return;}
    if(el.dataset.csend){var c=val('ctext');if(!c)return;el.disabled=true;req('POST','/workspace/chats/'+encodeURIComponent(SELC)+'/send',{text:c}).then(function(){toast('Sent');openChat(SELC);}).catch(function(e){toast(e.message);el.disabled=false;});return;}
    if(el.dataset.del){var k=el.dataset.del.split(':');if(!confirm('Remove this entry?'))return;act('/workspace/'+k[0]+'/'+encodeURIComponent(k[1])+'/delete',{},'Removed');return;}
    var id=el.id;

    if(id==='dd-go'){var d={name:val('dd-name'),description:val('dd-desc')};if(val('dd-head'))d.head_role=val('dd-head');act('/workspace/departments',d,'Department added');return;}

    if(id==='ww-go'){var steps=val('ww-steps').split('\n').filter(Boolean).map(function(l){var x=l.split('|');return {name:(x[0]||'').trim(),to:(x[1]||'').trim()};});act('/workspace/workflows',{name:val('ww-name'),steps:steps},'Workflow added');return;}
    if(id==='ms-go'){var m={tenant_id:val('ms-ten'),client_id:val('ms-cli'),redirect_uri:val('ms-red'),enabled:val('ms-en')==='1'};['mail','reply','calendar','teams'].forEach(function(k){m[k]=val('ms-'+k)==='1';});if(val('ms-sec'))m.client_secret=val('ms-sec');Object.keys(m).forEach(function(k){if(m[k]==='')delete m[k];});act('/workspace/m365/settings',m,'Saved');return;}

  });
  (function(){var c=$('landing');try{c.checked=localStorage.getItem('zyb_ws_landing')!=='0';}catch(e){c.disabled=true;/* storage blocked: the home page stays the start */}
    c.addEventListener('change',function(){try{localStorage.setItem('zyb_ws_landing',c.checked?'1':'0');}catch(e){/* storage blocked: nothing to remember */}toast(c.checked?'This page opens when you sign in':'The home page opens when you sign in');});})();
  finishSignIn().then(load);
})();
