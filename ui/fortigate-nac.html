<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FortiGate NAC</title><script src="vendor/zyb-org.js"></script><script src="vendor/zyb-dash.js"></script><link rel="stylesheet" href="vendor/zyb-soc.css"><script src="vendor/zyb-soc.js"></script>
<!-- Copyright (c) 2026 Zyberon Information Technology. All rights reserved. Proprietary and confidential - see LICENSE. -->
<!-- Network Access Control over /api/soc/nac: every endpoint the FortiGates detect (through FortiManager), one per MAC across the sites,
     with an explainable risk (new, identity change, two sites at once, rare at its site, never authorised) and four-eyes decisions:
     authorise a device, or quarantine it - carried out in FortiManager by a person and marked done. Analysts and above. -->
<style>
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:12px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.act{border-left:3px solid #4299e1;padding:6px 10px;margin:6px 0;border-radius:4px;background:rgba(255,255,255,.02)}.act.warn{border-color:#f59f00}.act.bad{border-color:#e5484d}
.mut{color:#8b93a4}.sm{font-size:12px}.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
</style></head><body><main>
<div class="top"><div><div class="eb">Network · access · FortiGate device detection</div><h1>Network Access Control</h1></div><span class="sp"></span><span class="muted" id="up"></span><a class="btn" href="fortigate-fleet.html">FortiGate Fleet</a><button type="button" id="rf">⟳ Refresh</button></div>
<div class="k" id="kp"><div class="empty">Loading…</div></div>
<div id="body"></div>
</main>
<script>
(function () {
  'use strict';
  var S = window.zybSoc, esc = S.esc, $ = function (i) { return document.getElementById(i); }, V = null, Q = '', MIN = 0;
  function load() {
    S.req('GET', '/nac/endpoints').then(function (v) { V = v; $('up').textContent = v.total + ' endpoint(s)'; draw(); })
      .catch(function (e) { $('kp').innerHTML = ''; $('body').innerHTML = '<div class="card">' + (e.status === 404 ? '<div class="empty">Network Access Control is not on this SIEM yet - run the platform update.</div>' : e.status === 403 ? '<div class="empty">This page names devices and users: an analyst or above opens it.</div>' : S.errHtml(e, 'Network Access Control')) + '</div>'; });
  }
  function draw() {
    var v = V;
    if (!v.total) { $('kp').innerHTML = ''; $('body').innerHTML = '<div class="card"><div class="empty">' + (v.connected ? 'No endpoint detected yet. Switch on Device detection on the FortiGates\' LAN interfaces (Network → Interfaces → Device detection); FortiManager then reports what each FortiGate sees.' : 'Connect FortiManager in the Integration Hub first: the endpoints come from the FortiGates\' device detection.') + '</div></div>'; return; }
    var E = v.endpoints, risky = E.filter(function (e) { return e.risk >= 30; });
    $('kp').innerHTML = S.tile('Endpoints', v.total, v.sites.length + ' site(s)', '') + S.tile('At risk', risky.length, '30 or more', risky.length ? 'bad' : 'ok')
      + S.tile('Two sites at once', E.filter(function (e) { return e.reasons.some(function (r) { return r.code === 'two-sites'; }); }).length, 'cloned MAC?', '') + S.tile('Identity changed', E.filter(function (e) { return e.reasons.some(function (r) { return r.code === 'identity'; }); }).length, 'OS under one MAC', '')
      + S.tile('Waiting for approval', v.decisions.filter(function (d) { return d.status === 'proposed'; }).length, 'authorise / quarantine', '') + (v.learning ? S.tile('Learning', 'until ' + v.learning_until, 'new devices are not judged yet', 'warn') : '');
    var L = E.filter(function (e) { var q = Q.toLowerCase(); return e.risk >= MIN && (!q || (e.mac + ' ' + e.ip + ' ' + e.host + ' ' + e.user + ' ' + e.site + ' ' + e.os).toLowerCase().indexOf(q) >= 0); });
    var tbl = '<div class="flt"><input id="q" type="search" placeholder="MAC, IP, host, user, site" value="' + esc(Q) + '" aria-label="Search endpoints"><select id="min" aria-label="Minimum risk"><option value="0">Any risk</option><option value="10"' + (MIN === 10 ? ' selected' : '') + '>10+</option><option value="30"' + (MIN === 30 ? ' selected' : '') + '>30+</option></select></div>'
      + (L.length ? '<div class="tw"><table><thead><tr><th>Endpoint</th><th>Seen</th><th>Risk</th><th>Why</th><th></th></tr></thead><tbody>' + L.slice(0, 500).map(function (e) {
        return '<tr><td><b>' + esc(e.host || e.mac) + '</b><div class="mut sm">' + esc([e.mac, e.ip, e.os, e.hw, e.user].filter(Boolean).join(' · ')) + '</div>' + (e.authorised ? S.pill('authorised', 'ok') : '') + (e.quarantine ? S.pill('quarantine ' + e.quarantine, 'bad') : '') + '</td><td class="sm">' + esc(e.site) + '<div class="mut">' + esc(e.fortigate) + ' · ' + esc(S.ago(e.last_seen)) + '</div></td><td>' + esc(e.risk) + '</td>'
          + '<td class="sm">' + (e.reasons.length ? e.reasons.map(function (r) { return esc('+' + r.points + ' ' + r.why); }).join('<br>') : '<span class="mut">–</span>') + (e.notes.length ? '<div class="mut">' + esc(e.notes.join('; ')) + '</div>' : '') + '</td>'
          + '<td class="text-nowrap">' + (S.can('operator') ? (e.authorised ? '' : '<button type="button" class="btn" data-auth="' + esc(e.mac) + '">Authorise…</button> ') + (e.quarantine ? '' : '<button type="button" class="btn" data-quar="' + esc(e.mac) + '">Quarantine…</button>') : '') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">No endpoint matches.</div>');
    var sites = v.sites.map(function (s) { return '<div class="sm" style="padding:3px 0">' + esc(s.site) + ' <span class="mut">' + esc(s.endpoints) + ' endpoints · ' + esc(s.risky) + ' at risk</span> ' + S.pill(s.exposure + ' %', s.exposure >= 10 ? 'warn' : 'ok') + '</div>'; }).join('');
    var dec = v.decisions.length ? v.decisions.slice(0, 30).map(function (d) { var b = '';
      if (d.status === 'proposed' && S.user() !== d.proposed_by) b = ' <button type="button" class="btn" data-dec="approved" data-id="' + esc(d.id) + '">Approve</button> <button type="button" class="btn" data-dec="rejected" data-id="' + esc(d.id) + '">Reject</button>';
      if (d.status === 'approved' && d.action === 'quarantine' && S.can('operator')) b = ' <button type="button" class="btn" data-done="' + esc(d.id) + '">Mark carried out</button>';
      return '<div class="act ' + (d.action === 'quarantine' ? 'bad' : '') + '"><b>' + esc(d.id) + '</b> ' + esc(d.action) + ' ' + esc(d.mac) + ' ' + S.pill(d.status, d.status === 'done' || d.status === 'approved' ? 'ok' : d.status === 'rejected' ? 'bad' : 'warn') + '<div class="mut sm">' + esc(d.reason) + (d.owner ? ' · owner ' + esc(d.owner) : '') + ' · by ' + esc(d.proposed_by) + '</div>' + b + '</div>'; }).join('') : '<div class="empty">No decision yet.</div>';
    $('body').innerHTML = '<div class="grid2"><div class="card"><h2>💻 Endpoints <span class="c">ranked by an itemised risk</span></h2>' + tbl + '</div><div><div class="card"><h2>📍 Sites</h2>' + sites + '</div><div class="card"><h2>🤝 Decisions <span class="c">four-eyes</span></h2>' + dec + '</div></div></div>'
      + '<p class="mut sm">From the FortiGates\' device detection through FortiManager. A quarantine is carried out in FortiManager (the quarantine address group or NAC policy) by a person, then marked here.</p>';
  }
  function post(u, b, ok) { S.req('POST', u, b).then(function (x) { S.toast(ok(x)); load(); }).catch(function (e) { S.toast(e.message); }); }
  document.addEventListener('click', function (ev) {
    var t = ev.target, a;
    if (t.id === 'rf') return load();
    if ((a = t.closest('[data-auth]'))) { var o = prompt('Whose device is it (owner / department)?'); if (!o) return; var w = prompt('What is it for?'); if (!w) return; post('/nac/decisions', { mac: a.getAttribute('data-auth'), action: 'authorise', owner: o, reason: w }, function (d) { return d.id + ' proposed - waiting for approval'; }); return; }
    if ((a = t.closest('[data-quar]'))) { var r = prompt('Why quarantine it?'); if (!r) return; post('/nac/decisions', { mac: a.getAttribute('data-quar'), action: 'quarantine', reason: r }, function (d) { return d.id + ' proposed - waiting for approval'; }); return; }
    if ((a = t.closest('[data-dec]'))) { var dd = a.getAttribute('data-dec'), cm = dd === 'rejected' ? prompt('Why is it rejected?') : ''; if (dd === 'rejected' && !cm) return; post('/nac/decisions/' + encodeURIComponent(a.getAttribute('data-id')) + '/decide', { decision: dd, comment: cm || undefined }, function (d) { return d.id + ' ' + d.status; }); return; }
    if ((a = t.closest('[data-done]'))) { var nt = prompt('What was done in FortiManager?'); if (!nt) return; post('/nac/decisions/' + encodeURIComponent(a.getAttribute('data-done')) + '/done', { note: nt }, function (d) { return d.id + ' done'; }); }
  });
  document.addEventListener('input', function (ev) { if (ev.target.id === 'q') { Q = ev.target.value; var pos = ev.target.selectionStart; draw(); var q = $('q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } } });
  document.addEventListener('change', function (ev) { if (ev.target.id === 'min') { MIN = Number(ev.target.value); draw(); } });
  S.ready(load);
})();
</script></body></html>
