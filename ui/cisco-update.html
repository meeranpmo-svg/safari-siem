<!-- Cisco Update Manager (/api/itam/cisco-update): which Cisco switches, routers and ASAs need a software update, why and by when,
     and the plan that does it. Overview · Devices · Advisories · Plans · Policy · Connections (#view=<tab>). A plan changes nothing
     on a device: the AI Network Engineer runs the staged upgrade (copy + verify MD5 + set boot, then a scheduled reload) with its
     own approval, and a plan completes only when every device reports the target version. -->
<style>

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--d-line);margin-bottom:14px;flex-wrap:wrap}.tabs button{background:none;border:0;color:var(--d-mute);font:600 13px Inter,system-ui,sans-serif;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent}.tabs button.on{color:var(--d-ink);border-bottom-color:var(--acc)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.t{background:var(--d-panel);border:1px solid var(--d-line);border-radius:12px;padding:12px 14px;text-align:left;color:inherit;cursor:pointer}.t .l{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--d-mute)}.t .v{font-size:28px;font-weight:800;line-height:1.1}.t .s{font-size:11.5px;color:var(--d-mute)}

.devlist{max-height:180px;overflow:auto;border:1px solid var(--d-line);border-radius:8px;padding:6px}.devlist label{display:flex;gap:8px;align-items:center;margin:2px 0;color:var(--d-ink);font-size:13px}.devlist input{width:auto}
.empty{color:var(--d-mute);padding:14px;text-align:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2030;border:1px solid var(--d-line);border-radius:10px;padding:10px 16px;z-index:60}
a.lk{color:var(--info);text-decoration:none}a.lk:hover{text-decoration:underline}

</style></head><body><main>
<div class="top"><div><div class="eb">Network · Cisco software updates · PSIRT advisories</div><h1>Cisco Updates</h1></div><span class="sp"></span><span class="mut sm" id="up"></span><button type="button" class="btn" id="rf">⟳ Refresh</button></div>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="banner"></div>
<div id="body"><div class="card"><div class="empty">Loading…</div></div></div>
</main>
<script>
(function () {
  'use strict';
  var API = '/api/itam', ROLE = 'viewer', USER = '', V = null, TAB = 'overview', F = '', Q = '';
  var TABS = [['overview', 'Overview'], ['devices', 'Devices'], ['advisories', 'Advisories'], ['plans', 'Update plans'], ['policy', 'Policy'], ['connections', 'Connections']];
  var ST = { 'on-target': 'on target', behind: 'behind', 'below-minimum': 'below minimum', 'no-policy': 'no target set', unknown: 'version unknown' };
  var $ = function (i) { return document.getElementById(i); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var Z = window.zybDetail;
  function can(r) { var R = { viewer: 0, operator: 1, admin: 2 }; return (R[ROLE] || 0) >= (R[r] || 0); }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 4500); }
  function req(m, u, b) { return new Promise(function (ok, bad) { var x = new XMLHttpRequest(); x.open(m, /^\/dashboards\//.test(u) ? u : API + u); x.withCredentials = true; x.timeout = 120000; x.zybQuiet = true; if (b !== undefined) x.setRequestHeader('Content-Type', 'application/json'); x.onload = function () { var j = null; try { j = JSON.parse(x.responseText); } catch (e) { /* not JSON */ } if (x.status >= 200 && x.status < 300) ok(j || {}); else bad(Object.assign(new Error((j && (j.error || (j.errors && j.errors.join('; ')))) || ('HTTP ' + x.status)), { status: x.status })); }; x.onerror = x.ontimeout = function () { bad(Object.assign(new Error('the platform is not reachable'), { status: 0 })); }; x.send(b !== undefined ? JSON.stringify(b) : null); }); }
  function pill(t, cls) { return '<span class="pill ' + esc(cls || t) + '">' + esc(t) + '</span>'; }
  function dt(v) { return v ? new Date(v).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '–'; }
  function ciscoUrl(u) { return /^https:\/\/(sec\.cloudapps|tools|www)\.cisco\.com\//.test(String(u || '')) ? u : ''; }
  function hashTab() { var m = /view=([a-z]+)/.exec(location.hash); return m && TABS.some(function (t) { return t[0] === m[1]; }) ? m[1] : 'overview'; }
  function load() {
    return req('GET', '/cisco-update').then(function (v) { V = v; $('up').textContent = 'read ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); draw(); })
      .catch(function (e) { $('body').innerHTML = '<div class="card"><div class="empty">' + (e.status === 404 ? 'The Cisco Update Manager is not on this platform yet — run the update.' : esc(e.message)) + '</div></div>'; });
  }
  function tabsHtml() { $('tabs').innerHTML = TABS.map(function (t) { return '<button type="button" role="tab" data-tab="' + t[0] + '" class="' + (TAB === t[0] ? 'on' : '') + '">' + esc(t[1]) + (t[0] === 'plans' && V ? ' (' + V.plans.filter(function (p) { return ['draft', 'submitted', 'approved'].indexOf(p.status) >= 0; }).length + ')' : '') + '</button>'; }).join(''); }
  function draw() {
    tabsHtml();
    $('banner').innerHTML = !V.connected ? '<div class="card"><div class="empty">' + esc(V.reason) + '</div></div>'
      : (V.api && !(V.api.enabled && V.api.secret_set)) ? '<div class="card"><div class="empty">The Cisco API is not set up, so no PSIRT advisories have been read. An administrator adds the Cisco API client (with “Cisco PSIRT openVuln API” ticked) on <a class="lk" href="support-contracts.html">Support Contracts → Cisco API</a>; then use Connections → Check advisories now.</div></div>' : '';
    ({ overview: drawOverview, devices: drawDevices, advisories: drawAdvisories, plans: drawPlans, policy: drawPolicy, connections: drawConnections }[TAB])();
  }
  function drawOverview() {
    var k = V.kpis, T = function (f, l, v, s, cls) { return '<button type="button" class="t ' + (cls || '') + '" data-go="' + f + '"><div class="l">' + esc(l) + '</div><div class="v">' + esc(v) + '</div><div class="s">' + esc(s) + '</div></button>'; };
    var h = '<div class="k">' + T('', 'Cisco devices', k.devices, k.on_target + ' on target', 'ok')
      + T('critical', 'Critical advisory', k.critical, 'devices on an affected release', k.critical ? 'bad' : 'ok')
      + T('overdue', 'Past deadline', k.overdue, 'advisory older than its days', k.overdue ? 'bad' : 'ok')
      + T('below-minimum', 'Below minimum', k.below_minimum, 'must be upgraded', k.below_minimum ? 'bad' : 'ok')
      + T('behind', 'Behind target', k.behind, 'newer release approved', k.behind ? 'warn' : 'ok')
      + T('no-support', 'No support contract', k.no_support, 'image cannot be downloaded', k.no_support ? 'warn' : 'ok')
      + T('unplanned', 'Needs a plan', k.unplanned, 'affected or behind, no plan', k.unplanned ? 'warn' : 'ok') + '</div>';
    h += '<div class="card"><h2>🧭 What to do first</h2>' + (V.actions.length ? V.actions.map(function (a) { return '<div class="act ' + (a.priority >= 80 ? 'bad' : a.priority >= 50 ? 'warn' : '') + '" data-go="' + esc(a.filter) + '"><b>' + esc(a.title) + '</b><div class="mut sm">' + esc(a.detail) + '</div></div>'; }).join('') : '<div class="empty">Nothing to do: every Cisco device is on its target release with no open advisory.</div>') + '</div>';
    var top = V.devices.filter(function (d) { return d.score > 0; }).slice(0, 8);
    h += '<div class="card"><h2>⚠ Highest priority devices <span class="c">every point named — open a device for the detail</span></h2>' + (top.length ? devTable(top) : '<div class="empty">No device has an open advisory or a pending upgrade.</div>') + '</div>';
    h += '<p class="mut sm">' + esc(V.note) + '</p>';
    $('body').innerHTML = h;
  }
  function devTable(L) {
    return '<table><thead><tr><th>Device</th><th>Running</th><th>Target</th><th>Status</th><th>Advisories</th><th>Deadline</th><th>Support</th><th>Priority</th><th>Plan</th></tr></thead><tbody>'
      + L.map(function (d) {
        var nd = d.advisories.filter(function (a) { return a.due; }).sort(function (a, b) { return a.due < b.due ? -1 : 1; })[0];
        return '<tr class="dv" data-dev="' + esc(d.id) + '" tabindex="0"><td><b>' + esc(d.name) + '</b><div class="mut sm">' + esc(d.ostype || d.vendor) + (d.model ? ' · ' + esc(d.model) : '') + '</div></td>'
          + '<td>' + esc(d.version || '–') + '</td><td>' + esc(d.target || '–') + '</td><td>' + pill(ST[d.status] || d.status, d.status) + '</td>'
          + '<td>' + (d.advisories.length ? pill(d.worst, d.worst) + ' <span class="mut sm">' + d.advisories.length + '</span>' : '<span class="mut">none</span>') + '</td>'
          + '<td>' + (nd ? (nd.overdue ? '<span style="color:var(--bad);font-weight:700">' + Math.abs(nd.days_left) + ' d overdue</span>' : nd.days_left + ' d') : '–') + '</td>'
          + '<td>' + pill(d.support, d.support === 'unknown' ? 'mute' : d.support) + '</td><td title="' + esc(d.points.map(function (p) { return '+' + p.points + ' ' + p.text; }).join('\n')) + '">' + (d.score ? pill(d.score + ' ' + d.level, d.level === 'high' ? 'bad' : d.level === 'medium' ? 'warn' : 'mute') : '<span class="mut">–</span>') + '</td>'
          + '<td>' + (d.plan ? pill(d.plan.status, d.plan.status) : (can('operator') && (d.status === 'behind' || d.status === 'below-minimum' || d.advisories.length) && d.target ? '<button type="button" class="btn sm" data-plan="' + esc(d.id) + '">Plan</button>' : '')) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }
  function match(d) {
    if (Q && (d.name + ' ' + (d.version || '') + ' ' + (d.model || '') + ' ' + d.advisories.map(function (a) { return a.id + ' ' + a.cves.join(' '); }).join(' ')).toLowerCase().indexOf(Q) < 0) return false;
    if (!F) return true;
    if (F === 'critical') return d.worst === 'Critical'; if (F === 'overdue') return d.overdue > 0; if (F === 'no-support') return ['expired', 'not-covered', 'not-assigned'].indexOf(d.support) >= 0;
    if (F === 'unplanned') return (d.status === 'behind' || d.status === 'below-minimum' || d.advisories.length) && !d.plan;
    return d.status === F;
  }
  function drawDevices() {
    var L = V.devices.filter(match);
    var chips = [['', 'All'], ['critical', 'Critical'], ['overdue', 'Past deadline'], ['below-minimum', 'Below minimum'], ['behind', 'Behind'], ['no-support', 'No support'], ['unplanned', 'Needs a plan'], ['no-policy', 'No target'], ['unknown', 'Unknown version'], ['on-target', 'On target']];
    $('body').innerHTML = '<div class="card"><h2>Cisco devices <span class="c">' + L.length + ' of ' + V.devices.length + ' · model, serial and support per device: <a class="lk" id="cnlink" href="cisco-network.html">Cisco Network Inventory →</a></span></h2><div class="fil"><input type="search" id="q" placeholder="Search device, version, model, advisory, CVE…" value="' + esc(Q) + '"> '
      + chips.map(function (c) { return '<button type="button" class="chip' + (F === c[0] ? ' on' : '') + '" data-f="' + c[0] + '">' + esc(c[1]) + '</button>'; }).join(' ') + '</div>'
      + (L.length ? devTable(L) : '<div class="empty">' + (V.devices.length ? 'No device matches this filter.' : 'No Cisco device yet. Add the switches, routers and ASAs to the AI Network Engineer (Network Onboarding); their software is read from there.') + '</div>') + '</div>';
  }
  function drawAdvisories() {
    var L = V.versions;
    $('body').innerHTML = '<div class="card"><h2>Advisories per software release <span class="c">Cisco PSIRT openVuln · last check ' + esc(V.last_check ? dt(V.last_check) : 'never') + '</span></h2>'
      + (L.length ? L.map(function (v) {
        var dev = V.devices.find(function (d) { return d.version === v.version && d.ostype === v.ostype; }) || {};
        return '<div class="card" style="background:var(--d-raise)"><h2>' + esc(v.ostype) + ' ' + esc(v.version) + ' ' + (v.worst ? pill(v.worst, v.worst) : pill('no advisory', 'ok')) + ' <span class="c">' + esc((v.devices || []).join(', ')) + '</span></h2>'
          + (v.error ? '<div class="mut sm">Cisco answered: ' + esc(v.error) + '</div>' : '')
          + ((dev.advisories || []).length ? '<table><thead><tr><th>Advisory</th><th>Severity</th><th>CVSS</th><th>CVEs</th><th>First fixed</th><th>Target fixes it?</th></tr></thead><tbody>' + dev.advisories.map(function (a) {
            var u = ciscoUrl(a.url);
            return '<tr><td>' + (u ? '<a class="lk" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(a.title) + ' ↗</a>' : esc(a.title)) + '<div class="mut sm">' + esc(a.id) + '</div></td><td>' + pill(a.sir, a.sir) + '</td><td>' + esc(a.cvss == null ? '–' : a.cvss) + '</td><td class="sm">' + esc(a.cves.join(', ') || '–') + '</td><td class="sm">' + esc(a.first_fixed.join(', ') || '–') + '</td><td>' + (a.fixed_by_target === true ? pill('yes', 'ok') : a.fixed_by_target === false ? pill('no — pick a later release', 'bad') : pill('check', 'mute')) + '</td></tr>';
          }).join('') + '</tbody></table>' : '<div class="mut sm">No advisory for this release.</div>') + '</div>';
      }).join('') + '<p class="mut sm">A device is exposed only if the affected feature is in use — read the advisory. “Target fixes it?” is answered only when Cisco names a fixed release of the same train; otherwise check the advisory.</p>'
      : '<div class="empty">No advisory has been read yet. Set up the Cisco API, then Connections → Check advisories now.</div>') + '</div>';
  }
  function drawPlans() {
    var L = V.plans;
    var h = '<div class="card"><h2>Update plans <span class="c">a plan changes nothing on a device — the AI Network Engineer runs the staged upgrade, with its own approval</span><span class="sp"></span>' + (can('operator') ? '<button type="button" class="btn pri" id="np">➕ New plan</button>' : '') + '</h2>';
    h += L.length ? L.map(function (p) {
      var mine = p.created_by === USER, b = [];
      if (p.status === 'draft' && (mine || can('admin'))) b.push('<button type="button" class="btn sm" data-pa="submit" data-id="' + esc(p.id) + '">Submit for approval</button>');
      if (p.status === 'submitted' && !mine && can('operator')) { b.push('<button type="button" class="btn sm pri" data-pa="approve" data-id="' + esc(p.id) + '">Approve</button>'); b.push('<button type="button" class="btn sm" data-pa="reject" data-id="' + esc(p.id) + '">Reject</button>'); }
      if (p.status === 'approved' && can('operator')) b.push('<button type="button" class="btn sm pri" data-pa="complete" data-id="' + esc(p.id) + '">Verify &amp; complete</button>');
      if (['draft', 'submitted', 'approved'].indexOf(p.status) >= 0 && (mine || can('admin'))) b.push('<button type="button" class="btn sm" data-pa="cancel" data-id="' + esc(p.id) + '">Cancel</button>');
      var ver = p.verification ? '<div class="mut sm">Last verification ' + esc(dt(p.verification.at)) + ': ' + p.verification.devices.map(function (d) { return esc(d.name) + ' ' + (d.done ? '✔ ' : '✖ ') + esc(d.version || 'unknown'); }).join(' · ') + '</div>' : '';
      var params = p.status === 'approved' ? '<div class="mut sm" style="margin-top:6px">Run it in the <a class="lk" href="network-engineer.html">AI Network Engineer</a> → each device → Tasks: <b>ios-stage</b> then a scheduled <b>ios-reload</b>.</div><pre class="par">' + esc('ios-stage  image=' + (p.image || '<image file>') + '  md5=' + (p.md5 || '<md5 from Cisco>') + '\nios-reload minutes=<5-1440, in the window ' + (p.window || 'agreed') + '>\ndevices: ' + p.devices.map(function (d) { return d.name; }).join(', ')) + '</pre>' : '';
      return '<div class="card" style="background:var(--d-raise)"><h2>' + esc(p.name) + ' ' + pill(p.status, p.status) + ' <span class="c">' + esc(p.ostype || '') + ' → ' + esc(p.target) + (p.window ? ' · window ' + esc(p.window) : '') + '</span></h2>'
        + '<div class="sm">' + p.devices.map(function (d) { return esc(d.name) + ' <span class="mut">(' + esc(d.from || '?') + ')</span>'; }).join(' · ') + '</div>'
        + '<div class="mut sm">Raised by ' + esc(p.created_by) + ' · ' + esc(dt(p.created_at)) + (p.approved_by ? ' · approved by ' + esc(p.approved_by) : '') + (p.reason ? ' · ' + esc(p.reason) : '') + '</div>'
        + ver + params + (b.length ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' + b.join('') + '</div>' : '') + '</div>';
    }).join('') : '<div class="empty">No update plan yet. Pick devices on Devices (Plan) or use “New plan”.</div>';
    $('body').innerHTML = h + '</div>';
  }
  function drawPolicy() {
    var P = V.policy, admin = can('admin'), rules = (P.rules || []).slice();
    var h = '<div class="card"><h2>Target releases <span class="c">' + (admin ? 'the most specific rule wins (a model / name prefix beats the platform-wide rule)' : 'set by an administrator') + '</span></h2>';
    h += '<table class="pol"><thead><tr><th>Platform</th><th>Model / name starts with</th><th>Target release</th><th>Minimum</th><th>Note</th>' + (admin ? '<th></th>' : '') + '</tr></thead><tbody id="rules">'
      + rules.map(function (r, i) { return admin ? ruleRow(r, i) : '<tr><td>' + esc(r.ostype) + '</td><td>' + esc(r.match || 'all') + '</td><td>' + esc(r.target) + '</td><td>' + esc(r.minimum || '–') + '</td><td>' + esc(r.note || '') + '</td></tr>'; }).join('') + '</tbody></table>';
    if (!rules.length && !admin) h += '<div class="empty">No target release set yet.</div>';
    if (admin) h += '<div style="margin-top:8px"><button type="button" class="btn sm" id="addr">➕ Add rule</button></div>';
    h += '<h2 style="margin-top:16px">Deadlines <span class="c">days from the first time an advisory is seen on a device</span></h2><div style="display:flex;gap:12px;flex-wrap:wrap" class="pol">'
      + V.sirs.map(function (k) { return '<label class="sm" style="width:130px">' + esc(k) + '<input type="number" min="1" max="730" data-sla="' + k + '" value="' + esc(P.sla[k]) + '"' + (admin ? '' : ' disabled') + '></label>'; }).join('') + '</div>';
    if (admin) h += '<div style="margin-top:12px"><button type="button" class="btn pri" id="savep">Save policy</button> <span class="mut sm">' + (P.updated_by ? 'last saved by ' + esc(P.updated_by) + ' · ' + esc(dt(P.updated_at)) : '') + '</span></div>';
    $('body').innerHTML = h + '</div>';
  }
  function ruleRow(r, i) {
    return '<tr data-r="' + i + '"><td><select data-k="ostype">' + V.ostypes.map(function (o) { return '<option' + (r.ostype === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></td>'
      + '<td><input data-k="match" value="' + esc(r.match || '') + '" placeholder="all"></td><td><input data-k="target" value="' + esc(r.target || '') + '" placeholder="17.9.4a"></td>'
      + '<td><input data-k="minimum" value="' + esc(r.minimum || '') + '"></td><td><input data-k="note" value="' + esc(r.note || '') + '"></td><td><button type="button" class="btn sm" data-delr="' + i + '">✕</button></td></tr>';
  }
  function readRules() { return [].map.call(document.querySelectorAll('#rules tr[data-r]'), function (tr) { var o = {}; [].forEach.call(tr.querySelectorAll('[data-k]'), function (f) { var v = f.value.trim(); if (v) o[f.getAttribute('data-k')] = v; }); return o; }); }
  function savePolicy() {
    var sla = {}; [].forEach.call(document.querySelectorAll('[data-sla]'), function (f) { sla[f.getAttribute('data-sla')] = Number(f.value); });
    req('POST', '/cisco-update/policy', { rules: readRules(), sla: sla }).then(function () { toast('Policy saved'); load(); }).catch(function (e) { toast(e.message); });
  }
  function drawConnections() {
    var api = V.api || {}, ok = api.enabled && api.secret_set;
    var row = function (l, v, st) { return '<tr><td>' + esc(l) + '</td><td>' + v + '</td><td>' + st + '</td></tr>'; };
    $('body').innerHTML = '<div class="card"><h2>Where the data comes from</h2><table><tbody>'
      + row('Cisco devices and running software', V.connected ? V.devices.length + ' device(s) from the <a class="lk" href="network-engineer.html">AI Network Engineer</a>' : esc(V.reason || 'not connected'), pill(V.connected ? 'connected' : 'not connected', V.connected ? 'ok' : 'bad'))
      + row('Cisco PSIRT openVuln (advisories)', ok ? 'last check ' + esc(V.last_check ? dt(V.last_check) : 'never') + (V.last_error ? ' · <span style="color:var(--bad)">' + esc(V.last_error) + '</span>' : '') : 'the Cisco API client is set on <a class="lk" href="support-contracts.html">Support Contracts → Cisco API</a>', pill(ok ? 'set up' : 'not set up', ok ? 'ok' : 'warn'))
      + row('Smart Net coverage', '<a class="lk" href="support-contracts.html">Support Contracts</a> — matched to devices by name', pill(V.devices.some(function (d) { return d.support !== 'unknown'; }) ? 'matched' : 'none matched', 'mute'))
      + '</tbody></table>' + (can('operator') ? '<div style="margin-top:10px"><button type="button" class="btn pri" id="chk"' + (ok ? '' : ' disabled') + '>Check advisories now</button> <span class="mut sm">only software version strings are sent to Cisco</span></div>' : '') + '</div>';
  }
  function dialog(title, inner, onok, okLabel) {
    var o = document.createElement('div'); o.className = 'ov'; o.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><h2>' + esc(title) + '</h2>' + inner + '<div class="actb"><button type="button" class="btn" data-x>Cancel</button><button type="button" class="btn pri" data-ok>' + esc(okLabel || 'Save') + '</button></div></div>';
    document.body.appendChild(o); o.addEventListener('click', function (e) { if (e.target === o || e.target.hasAttribute('data-x')) o.remove(); });
    o.querySelector('[data-ok]').addEventListener('click', function () { onok(o, function () { o.remove(); }); }); var f = o.querySelector('input,textarea,select'); if (f) f.focus();
  }
  function newPlan(preId) {
    var pre = V.devices.find(function (d) { return d.id === preId; }), os = pre ? pre.ostype : null;
    var cand = V.devices.filter(function (d) { return d.version && !d.plan && (!os || d.ostype === os); });
    dialog('New update plan', '<label>Name</label><input id="p-name" maxlength="120" value="' + esc(pre ? pre.name + ' to ' + (pre.target || '') : '') + '">'
      + '<label>Devices (one platform per plan)</label><div class="devlist">' + (cand.length ? cand.map(function (d) { return '<label><input type="checkbox" value="' + esc(d.id) + '"' + (pre && d.id === pre.id ? ' checked' : '') + '> ' + esc(d.name) + ' <span class="mut sm">' + esc(d.ostype) + ' ' + esc(d.version) + (d.worst ? ' · ' + esc(d.worst) : '') + '</span></label>'; }).join('') : '<div class="mut sm">No device without a plan.</div>') + '</div>'
      + '<div class="row2"><div><label>Target release</label><input id="p-target" maxlength="40" value="' + esc(pre && pre.target || '') + '"></div><div><label>Maintenance window</label><input id="p-win" type="date"></div></div>'
      + '<div class="row2"><div><label>Image file (optional)</label><input id="p-img" maxlength="120" placeholder="cat9k_iosxe.17.09.04a.SPA.bin"></div><div><label>MD5 (from Cisco, with the image)</label><input id="p-md5" maxlength="32"></div></div>'
      + '<label>Reason</label><textarea id="p-why" rows="2" maxlength="1000" placeholder="e.g. Critical PSIRT advisory cisco-sa-…"></textarea><p class="mut sm">Saved as a draft. You submit it; a different person with the network approval approves it.</p>',
      function (o, close) {
        var ids = [].map.call(o.querySelectorAll('.devlist input:checked'), function (c) { return c.value; });
        var b = { name: o.querySelector('#p-name').value.trim(), device_ids: ids, target: o.querySelector('#p-target').value.trim(), reason: o.querySelector('#p-why').value.trim() };
        var img = o.querySelector('#p-img').value.trim(), md5 = o.querySelector('#p-md5').value.trim(), win = o.querySelector('#p-win').value;
        if (img) b.image = img; if (md5) b.md5 = md5; if (win) b.window = win;
        if (!ids.length) { toast('Pick at least one device'); return; }
        req('POST', '/cisco-update/plans', b).then(function () { close(); toast('Plan saved as a draft'); TAB = 'plans'; location.hash = 'view=plans'; load(); }).catch(function (e) { toast(e.message); });
      }, 'Save draft');
  }
  function planAction(a, id) {
    var run = function (body) { req('POST', '/cisco-update/plans/' + encodeURIComponent(id) + '/' + a, body).then(function (r) { toast(a === 'complete' ? (r.completed ? 'Verified on every device — plan completed' : (r.pending || []).length + ' device(s) not yet on the target — plan stays approved') : 'Plan ' + (a === 'submit' ? 'submitted' : a + 'ed')); load(); }).catch(function (e) { toast(e.message); }); };
    if (a === 'reject' || a === 'cancel') return dialog(a === 'reject' ? 'Reject plan' : 'Cancel plan', '<label>Reason</label><textarea id="r-why" rows="3" maxlength="500"></textarea>', function (o, close) { var r = o.querySelector('#r-why').value.trim(); if (r.length < 5) { toast('Give a reason (5 characters or more)'); return; } close(); run({ reason: r }); }, a === 'reject' ? 'Reject' : 'Cancel plan');
    run({});
  }
  function devDetail(id) {
    var d = V.devices.find(function (x) { return x.id === id; }); if (!d || !Z) return;
    Z.open('Cisco device', d.name, Z.kv([['Platform', esc(d.ostype || d.vendor) + (d.model ? ' · ' + esc(d.model) : '')], ['Running', esc(d.version || 'unknown')], ['Target', esc(d.target || 'no rule') + (d.rule ? ' <span class="mut sm">(rule ' + esc(d.rule) + ')</span>' : '')], ['Status', esc(d.why)], ['Support', esc(d.support) + (d.support_end ? ' · ends ' + esc(d.support_end) : '')], ['Plan', d.plan ? esc(d.plan.name + ' (' + d.plan.status + ')') : 'none']])
      + '<h3>Priority ' + esc(d.score) + '</h3>' + (d.points.length ? d.points.map(function (p) { return '<div class="sm">+' + esc(p.points) + ' ' + esc(p.text) + '</div>'; }).join('') : '<div class="sm">Nothing to do.</div>')
      + '<h3>Advisories on ' + esc(d.version || '?') + '</h3>' + (d.advisories.length ? d.advisories.map(function (a) { return '<div class="sm" style="margin:4px 0">' + esc(a.sir) + ' · <b>' + esc(a.title) + '</b> <span class="mut">' + esc(a.id) + '</span><br><span class="mut">first seen ' + esc(dt(a.first_seen)) + ' · due ' + esc(dt(a.due)) + (a.overdue ? ' · OVERDUE' : '') + ' · fixed in ' + esc(a.first_fixed.join(', ') || '?') + '</span></div>'; }).join('') : '<div class="sm">None listed by Cisco PSIRT.</div>'));
  }
  document.addEventListener('click', function (ev) {
    var b, x = ev.target;
    if ((b = x.closest('[data-tab]'))) { TAB = b.getAttribute('data-tab'); location.hash = 'view=' + TAB; draw(); return; }
    if ((b = x.closest('[data-go]'))) { F = b.getAttribute('data-go'); TAB = F === 'no-policy' ? 'policy' : 'devices'; location.hash = 'view=' + TAB; draw(); return; }
    if ((b = x.closest('[data-f]'))) { F = b.getAttribute('data-f'); draw(); return; }
    if ((b = x.closest('[data-plan]'))) { ev.stopPropagation(); newPlan(b.getAttribute('data-plan')); return; }
    if ((b = x.closest('[data-pa]'))) { planAction(b.getAttribute('data-pa'), b.getAttribute('data-id')); return; }
    if (x.closest('#np')) { newPlan(null); return; }
    if (x.closest('#addr')) { var rs = readRules(); rs.push({ ostype: 'iosxe' }); V.policy.rules = rs; drawPolicy(); return; }
    if ((b = x.closest('[data-delr]'))) { var rs2 = readRules(); rs2.splice(Number(b.getAttribute('data-delr')), 1); V.policy.rules = rs2; drawPolicy(); return; }
    if (x.closest('#savep')) { savePolicy(); return; }
    if (x.closest('#chk')) { var c = x.closest('#chk'); c.disabled = true; req('POST', '/cisco-support/psirt/check').then(function (r) { toast('Advisories read: ' + ((r.check && r.check.advisories) || 0) + ' across ' + ((r.check && r.check.versions) || 0) + ' release(s)'); load(); }).catch(function (e) { c.disabled = false; toast(e.message); }); return; }
    if ((b = x.closest('tr.dv'))) { devDetail(b.getAttribute('data-dev')); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.closest && e.target.closest('tr.dv')) devDetail(e.target.closest('tr.dv').getAttribute('data-dev')); });
  document.addEventListener('input', function (e) { if (e.target.id !== 'q') return; Q = e.target.value.trim().toLowerCase(); var p = e.target.selectionStart; drawDevices(); var q = $('q'); if (q) { q.focus(); try { q.setSelectionRange(p, p); } catch (er) { /* not a text field */ } } });
  window.addEventListener('hashchange', function () { var t = hashTab(); if (t !== TAB && V) { TAB = t; draw(); } });
  $('rf').addEventListener('click', load);
  TAB = hashTab();
  var w = new XMLHttpRequest(); w.open('GET', '/dashboards/whoami.json'); w.onload = function () { try { var j = JSON.parse(w.responseText); ROLE = String(j.role || '').toLowerCase() || 'viewer'; USER = j.user || ''; } catch (e) { /* viewer */ } load(); }; w.onerror = function () { load(); }; w.send();
})();
