# Sentra ITAM - nginx location blocks. Include INSIDE the portal's HTTPS server { } block:
#     include /opt/sentra-itam/install/nginx-itam.conf;
# Requires the portal's existing internal location /auth/verify (2xx for a valid session, returning X-Auth-User /
# X-Auth-Role) and the rate-limit zone "sentra_api". Service: 127.0.0.1:9150 (config.json api.port) - never exposed.
#
# TWO locations:
#   /api/itam/   portal UI/API    -> session-authenticated (auth_request), identity injected from the auth response.
#   /agent/      endpoint-agent   -> NOT session-authenticated; agents present a per-agent bearer key the service
#                                    verifies itself. Only the proxy secret is added here. Keep this location open to
#                                    the agent network (LAN/VPN) and rate-limited; it carries no portal cookies.

# Remote console tunnel (engine/remote-console.js): the same session check and identity as /api/itam/, plus the WebSocket
# upgrade and long timeouts. The one-time ticket in the URL is valid 60 s and used once. Order does not matter: nginx
# picks an exact-match location (=) before the /api/itam/ prefix.
location = /api/itam/console/tunnel {
    auth_request     /auth/verify;
    auth_request_set $sentra_itam_user $upstream_http_x_auth_user;
    auth_request_set $sentra_itam_role $upstream_http_x_auth_role;
    limit_req        zone=sentra_api burst=20 nodelay;
    proxy_pass         http://127.0.0.1:9150;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Auth-User $sentra_itam_user;
    proxy_set_header   X-Auth-Role $sentra_itam_role;
    include            /etc/nginx/sentra-itam-proxy-secret.conf;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_buffering    off;
    proxy_read_timeout 8h;
    proxy_send_timeout 8h;
}

location /api/itam/ {
    auth_request     /auth/verify;
    auth_request_set $sentra_itam_user $upstream_http_x_auth_user;
    auth_request_set $sentra_itam_role $upstream_http_x_auth_role;

    limit_req        zone=sentra_api burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 8m;                       # CSV/CMDB imports

    proxy_pass         http://127.0.0.1:9150;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    # identity comes ONLY from the auth response; client-sent X-Auth-* are overwritten here
    proxy_set_header   X-Auth-User $sentra_itam_user;
    proxy_set_header   X-Auth-Role $sentra_itam_role;
    include            /etc/nginx/sentra-itam-proxy-secret.conf;   # X-Sentra-Proxy-Secret (root-only, written by install.sh)
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Endpoint-agent gateway: no auth_request (agents are not portal sessions). The service authenticates the per-agent
# bearer key and enforces replay protection. Larger body for software inventory reports.
location /agent/ {
    limit_req        zone=sentra_api burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 8m;

    proxy_pass         http://127.0.0.1:9150;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    # strip any client-sent identity headers on this path (defence in depth; the service ignores them for /agent anyway)
    proxy_set_header   X-Auth-User "";
    proxy_set_header   X-Auth-Role "";
    include            /etc/nginx/sentra-itam-proxy-secret.conf;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
