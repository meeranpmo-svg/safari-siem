# Sentra SIEM - nginx http{}-level definitions used by nginx-soc.conf.
# Install once:  sudo cp /opt/sentra-siem/install/nginx-soc-http.conf /etc/nginx/conf.d/sentra-siem-http.conf
# (files in conf.d are included inside http {} by the stock Ubuntu nginx.conf)

# Agent ingest: per client IP. A Windows agent POSTs a few times per minute; replaying a backlog is faster, hence the
# burst in nginx-soc.conf. Raise the rate if many agents sit behind one NAT address or a WEC server forwards for many.
limit_req_zone  $binary_remote_addr zone=sentra_ingest:10m rate=20r/s;
# SOC API for analysts' browsers (search, alerts, cases ...)
limit_req_zone  $binary_remote_addr zone=sentra_api:10m    rate=30r/s;
# live tail (Server-Sent Events): concurrent streams per client IP
limit_conn_zone $binary_remote_addr zone=sentra_tail:10m;
