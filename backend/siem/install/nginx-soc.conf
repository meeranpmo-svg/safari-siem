# Sentra SIEM - nginx location blocks. Include INSIDE the portal's HTTPS server { } block:
#     include /opt/sentra-siem/install/nginx-soc.conf;
# Requires: nginx-soc-http.conf in http {} (rate-limit zones), and the portal's existing internal location
# /auth/verify (answers 2xx for a valid session, 401/403 otherwise, and returns the headers X-Auth-User / X-Auth-Role).
# Engine API: 127.0.0.1:9120 (config.json api.port) - never exposed directly.

# ---- SOC API: portal session required ---------------------------------------------------------------------------
location /api/soc/ {
    auth_request     /auth/verify;
    auth_request_set $sentra_auth_user $upstream_http_x_auth_user;
    auth_request_set $sentra_auth_role $upstream_http_x_auth_role;

    limit_req        zone=sentra_api burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 5m;                       # Sigma imports, bulk alert actions (engine: api.max_body_mb)

    proxy_pass         http://127.0.0.1:9120;      # no URI part: /api/soc/... is passed unchanged
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    # identity comes ONLY from the auth response; client-sent X-Auth-* headers are overwritten here
    # (an empty value means nginx does not send the header at all -> the engine answers 401)
    proxy_set_header   X-Auth-User $sentra_auth_user;
    proxy_set_header   X-Auth-Role $sentra_auth_role;
    include            /etc/nginx/sentra-siem-proxy-secret.conf;   # X-Sentra-Proxy-Secret (root-only file written by install.sh)
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;                       # searches are capped at 60 s in ClickHouse
    proxy_send_timeout 60s;
}

# ---- live tail: Server-Sent Events (long-lived, must not be buffered) ----------------------------------------------
location = /api/soc/tail {
    auth_request     /auth/verify;
    auth_request_set $sentra_auth_user $upstream_http_x_auth_user;
    auth_request_set $sentra_auth_role $upstream_http_x_auth_role;

    limit_conn       sentra_tail 4;
    limit_conn_status 429;

    proxy_pass         http://127.0.0.1:9120;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Auth-User $sentra_auth_user;
    proxy_set_header   X-Auth-Role $sentra_auth_role;
    include            /etc/nginx/sentra-siem-proxy-secret.conf;   # X-Sentra-Proxy-Secret (root-only file written by install.sh)
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_buffering    off;                        # deliver each event immediately
    proxy_cache        off;
    gzip               off;
    chunked_transfer_encoding on;
    proxy_read_timeout 1h;                         # idle streams are closed after 1 h; the UI reconnects (EventSource)
    proxy_send_timeout 1h;
}

# ---- agent / HTTPS ingest: NO session auth - the engine checks X-Sentra-Token per source (HMAC compare) --------------
location /ingest/ {
    limit_except POST { deny all; }
    limit_req        zone=sentra_ingest burst=200 nodelay;
    limit_req_status 429;                          # agents treat 429 as "retry later" and keep the batch queued

    client_max_body_size    6m;                    # agent batches are <= 1 MB uncompressed (gzip); engine ingest.max_mb = 5
    client_body_buffer_size 1m;                    # keep typical batches in memory
    client_body_timeout     30s;

    proxy_pass         http://127.0.0.1:9120;      # engine route /ingest/<src_id>
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    # never let an ingest client pose as a portal user
    proxy_set_header   X-Auth-User "";
    proxy_set_header   X-Auth-Role "";
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_request_buffering on;
    proxy_read_timeout 60s;
    # X-Sentra-Token is a request header: nginx's default access log format does not record it - keep it that way
    # (do not add $http_x_sentra_token to any log_format).
}
