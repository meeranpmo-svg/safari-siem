# Sentra SIEM - rsyslog forwarding over TLS (RFC 5425: RFC 5424 + octet-counted framing, gtls driver)
# Installed as /etc/rsyslog.d/60-sentra-siem.conf by install-rsyslog-forwarder.sh --tls, which replaces
# @@COLLECTOR@@ / @@PORT@@ / @@CAFILE@@ / @@PEER@@.
# Requires the rsyslog-gnutls package and rsyslog >= 8.2108 for the per-action CA file (Ubuntu 22.04: 8.2112,
# 24.04: 8.2312). On older rsyslog, remove streamDriver.CAFile below and set once, globally:
#   global(DefaultNetstreamDriverCAFile="@@CAFILE@@")
# The SIEM certificate must chain to the CA in @@CAFILE@@ and carry @@PEER@@ in its subjectAltName (or CN).

ruleset(name="sentra_siem_fwd") {
  action(type="omfwd" name="sentra_siem_fwd"
         target="@@COLLECTOR@@" port="@@PORT@@" protocol="tcp"
         TCP_Framing="octet-counted"
         template="RSYSLOG_SyslogProtocol23Format"
         StreamDriver="gtls" StreamDriverMode="1"
         StreamDriverAuthMode="x509/name" StreamDriverPermittedPeers="@@PEER@@"
         streamDriver.CAFile="@@CAFILE@@"
         queue.type="LinkedList" queue.size="100000" queue.dequeueBatchSize="1000"
         queue.filename="sentra_siem_fwd" queue.spoolDirectory="/var/spool/rsyslog"
         queue.maxDiskSpace="1g" queue.highWatermark="80000" queue.lowWatermark="20000"
         queue.saveOnShutdown="on" queue.timeoutEnqueue="0"
         action.resumeRetryCount="-1" action.resumeInterval="10" action.reportSuspension="on")
}

if prifilt("*.info;auth,authpriv.*") then {
  call sentra_siem_fwd
}
