# Sentra SIEM - rsyslog forwarding, plain TCP (RFC 5424 + octet-counted framing, disk-assisted queue)
# Installed as /etc/rsyslog.d/60-sentra-siem.conf by install-rsyslog-forwarder.sh, which replaces @@COLLECTOR@@ / @@PORT@@.
# Use on trusted internal segments only; across untrusted networks use 60-sentra-siem-forward-tls.conf.
# Requires rsyslog >= 8.24 (Ubuntu 18.04+, RHEL 8+).

# One forwarding ruleset; the imfile inputs in 61-sentra-siem-webaccess.conf are bound to it as well.
ruleset(name="sentra_siem_fwd") {
  action(type="omfwd" name="sentra_siem_fwd"
         target="@@COLLECTOR@@" port="@@PORT@@" protocol="tcp"
         TCP_Framing="octet-counted"
         template="RSYSLOG_SyslogProtocol23Format"
         # disk-assisted queue: memory while the SIEM answers, spills to disk (max 1 GB) while it does not
         queue.type="LinkedList" queue.size="100000" queue.dequeueBatchSize="1000"
         queue.filename="sentra_siem_fwd" queue.spoolDirectory="/var/spool/rsyslog"
         queue.maxDiskSpace="1g" queue.highWatermark="80000" queue.lowWatermark="20000"
         queue.saveOnShutdown="on" queue.timeoutEnqueue="0"
         # retry forever, every 10 s; report suspension/resumption in the local log
         action.resumeRetryCount="-1" action.resumeInterval="10" action.reportSuspension="on")
}

# Everything at severity info or higher, plus all auth/authpriv messages (sshd, sudo, PAM, su) at any level.
if prifilt("*.info;auth,authpriv.*") then {
  call sentra_siem_fwd
}
