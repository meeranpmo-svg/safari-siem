# Sentra SIEM - web server access/error logs via imfile, forwarded through the sentra_siem_fwd ruleset
# (defined in 60-sentra-siem.conf). Installed by install-rsyslog-forwarder.sh --web nginx|apache|both, which keeps only
# the blocks for the chosen server(s).
#
# - Inputs are bound to ruleset sentra_siem_fwd, so the lines go ONLY to the SIEM (not duplicated into /var/log/syslog).
# - freshStartTail="on": on the very first start, begin at the end of existing files (no history flood).
# - Wildcards pick up per-vhost files (e.g. /var/log/nginx/portal.access.log); rotation is followed via inotify.
# - rsyslog runs as user "syslog" (group adm) on Ubuntu; nginx/apache logs are root:adm 0640 -> readable.
# - The engine's webaccess parser expects the default "combined" log format. For custom formats, check the
#   parse-error rate on the Sources page after onboarding.

# imfile may be loaded only once in the whole configuration - the installer comments this line out if another file
# under /etc/rsyslog.d already loads it.
module(load="imfile" mode="inotify")

#BEGIN nginx
input(type="imfile" File="/var/log/nginx/*access.log" Tag="nginx-access:" Facility="local6" Severity="info"
      ruleset="sentra_siem_fwd" freshStartTail="on" reopenOnTruncate="on" addMetadata="on")
input(type="imfile" File="/var/log/nginx/*error.log" Tag="nginx-error:" Facility="local6" Severity="warning"
      ruleset="sentra_siem_fwd" freshStartTail="on" reopenOnTruncate="on" addMetadata="on")
#END nginx

#BEGIN apache
input(type="imfile" File="/var/log/apache2/*access.log" Tag="apache-access:" Facility="local6" Severity="info"
      ruleset="sentra_siem_fwd" freshStartTail="on" reopenOnTruncate="on" addMetadata="on")
input(type="imfile" File="/var/log/apache2/*error.log" Tag="apache-error:" Facility="local6" Severity="warning"
      ruleset="sentra_siem_fwd" freshStartTail="on" reopenOnTruncate="on" addMetadata="on")
#END apache
