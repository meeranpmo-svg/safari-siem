# Sentra SIEM - Exchange on-prem message tracking + IIS logs via imfile (read-only CIFS mounts, see
# agents/exchange/README.md), forwarded through the sentra_siem_fwd ruleset from 60-sentra-siem-forward.conf.
# One pair of input() lines per Exchange server; the Tag MUST be "exmsgtrk-<SERVER>:" / "exiis-<SERVER>:" - the engine
# takes the Exchange server name from it. Header lines (#Fields ...) are forwarded on purpose (column order).
# imfile may be loaded only once in the whole rsyslog configuration and its mode is global. CIFS mounts have no inotify,
# so imfile must run in polling mode: if 61-sentra-siem-webaccess.conf is installed, change its module() line to
# mode="polling"; otherwise uncomment the line below.
#module(load="imfile" mode="polling" PollingInterval="5")

input(type="imfile" File="/mnt/exchange/TEST-EX01/msgtrk/MSGTRK*.log" Tag="exmsgtrk-TEST-EX01:" Facility="local5" Severity="info"
      ruleset="sentra_siem_fwd" freshStartTail="on" reopenOnTruncate="on" addMetadata="off")
input(type="imfile" File="/mnt/exchange/TEST-EX01/iis/u_ex*.log" Tag="exiis-TEST-EX01:" Facility="local5" Severity="info"
      ruleset="sentra_siem_fwd" freshStartTail="on" reopenOnTruncate="on" addMetadata="off")
